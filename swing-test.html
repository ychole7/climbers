<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><title>영차영차 등반대 — 대롱대롱 실험</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;background:#efe3ca}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;pointer-events:none;padding:12px;color:#63462d;text-shadow:0 1px #fff8;font-weight:800}#hud small{display:block;margin-top:5px;font-size:12px;font-weight:600}#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:16px;right:16px;display:flex;gap:10px;justify-content:center}button{background:#fff7e8;color:#67472b;border:2px solid #c8a77a;border-radius:25px;font-weight:800;padding:12px 20px;box-shadow:0 4px 0 #bfa57f}#status{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:14px;right:14px;text-align:center;color:#735338;font-weight:750;font-size:15px;pointer-events:none}#badge{position:absolute;top:calc(env(safe-area-inset-top) + 126px);right:12px;font-size:12px;background:#fff8e9d9;padding:6px 9px;border-radius:15px;color:#805e38;pointer-events:none}</style></head><body><div id="hud">🐻 영차영차 등반대 <small>대롱대롱 V2 · 홀드 3개</small></div><div id="status">곰돌이를 뒤로 당겼다가 놓아 봐!</div><div id="badge">당기기 → 놓기 → 자동 잡기</div><canvas id="game"></canvas><div id="controls"><button id="retry">↻ 다시 시작</button><button id="help">? 조작</button></div><script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),msg=document.getElementById('status');
let W,H,dpr=1,scale,ox,oy,last=0,grabbed=false,dragging=false,won=false,failed=false,attempts=0,flash=0,particles=[];
const WORLD={w:390,h:780};const holds=[{x:135,y:245,r:19,col:'#7dbfb4'},{x:277,y:172,r:20,col:'#e7a664'},{x:164,y:78,r:22,col:'#b39ad6'}];
let ball,anchor=0,rope=105,handTip={x:0,y:0},dragStart=null,dragTo=null,prevPointer=null;
let launch=0,catchPulse=0,shake=0,shots=0,grace=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function length(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function projectedDrag(p){const base=holds[anchor];let dx=p.x-base.x,dy=p.y-base.y,d=Math.hypot(dx,dy)||1;const r=clamp(d,35,rope);return{x:base.x+dx/d*r,y:base.y+dy/d*r}}
function tone(f=520,d=.09,type='sine'){try{const ac=tone.ac||(tone.ac=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*.74,ac.currentTime+d);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.065,ac.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.01)}catch(e){}}
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);scale=Math.min(W/WORLD.w,H/WORLD.h);ox=(W-WORLD.w*scale)/2;oy=(H-WORLD.h*scale)/2;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy)}
function pt(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function reset(){anchor=0;rope=104;ball={x:135,y:349,vx:0,vy:0};handTip={...holds[0]};grabbed=true;dragging=false;won=false;failed=false;dragStart=null;dragTo=null;attempts=0;flash=0;particles=[];launch=0;catchPulse=0;shake=0;shots=0;grace=0;msg.textContent='곰돌이를 당겼다가 놓아 봐!';}
function dust(x,y,col){for(let i=0;i<12;i++){let a=i*Math.PI*2/12;particles.push({x,y,vx:Math.cos(a)*(1.5+Math.random()*2),vy:Math.sin(a)*(1.5+Math.random()*2),life:36,col})}}
function pointerDown(e){e.preventDefault();if(won||failed)return;const p=pt(e);if(length(p,ball)>105)return;dragging=true;dragStart=p;dragTo=p;prevPointer={...ball};cv.setPointerCapture(e.pointerId);msg.textContent='꾹 당겨서 힘을 모아!';}
function pointerMove(e){if(!dragging)return;e.preventDefault();dragTo=pt(e)}
function pointerUp(e){if(!dragging)return;e.preventDefault();dragging=false;
 const d=length(dragStart,dragTo);if(d<16){msg.textContent='조금 더 길게 당겨 봐!';return}
 // Drag directly moves the bear while tethered; release launches along spring recoil.
 const base=holds[anchor],at=projectedDrag({x:ball.x+(dragTo.x-dragStart.x),y:ball.y+(dragTo.y-dragStart.y)});
 const vx=base.x-at.x,vy=base.y-at.y,dir=Math.hypot(vx,vy)||1;
 const power=clamp(d/140,0,1),kick=7+power*11;
 ball.x=at.x;ball.y=at.y;ball.vx+=vx/dir*kick;ball.vy+=vy/dir*kick-1.5*power;
 launch=16;grace=80;shots++;flash=3;tone(285, .14,'triangle');msg.textContent=power>.78?'강하게 발사! 타이밍을 느껴봐!':'휙! 다음 홀드에 가까이 가자!';
}
cv.addEventListener('pointerdown',pointerDown);cv.addEventListener('pointermove',pointerMove);cv.addEventListener('pointerup',pointerUp);cv.addEventListener('pointercancel',()=>{dragging=false});document.getElementById('retry').onclick=reset;document.getElementById('help').onclick=()=>{msg.textContent='곰돌이를 반대 방향으로 당겨 발사! 가까운 위쪽 홀드를 자동으로 잡아.'};addEventListener('resize',size);
function update(dt){let step=Math.min(dt,2.2);particles=particles.filter(p=>p.life-- >0);for(const p of particles){p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=.055*step}
 flash=Math.max(0,flash-step);catchPulse=Math.max(0,catchPulse-step);shake=Math.max(0,shake-step);launch=Math.max(0,launch-step);grace=Math.max(0,grace-step);
 if(won||failed)return;
 if(dragging){const delta={x:dragTo.x-dragStart.x,y:dragTo.y-dragStart.y};const dest=projectedDrag({x:prevPointer.x+delta.x*.90,y:prevPointer.y+delta.y*.90});ball.x+=(dest.x-ball.x)*.34*step;ball.y+=(dest.y-ball.y)*.34*step;ball.vx=0;ball.vy=0;return}
 const n=Math.max(1,Math.ceil(step*3)),t=step/n;
 for(let k=0;k<n;k++){
  ball.vy+=.31*t;ball.vx*=Math.pow(.996,t);ball.vy*=Math.pow(.996,t);
  ball.x+=ball.vx*t;ball.y+=ball.vy*t;
  const base=holds[anchor];let dx=ball.x-base.x,dy=ball.y-base.y,d=Math.hypot(dx,dy)||1;
  if(d>rope){const nx=dx/d,ny=dy/d,stretch=d-rope;ball.x-=nx*stretch;ball.y-=ny*stretch;const outward=ball.vx*nx+ball.vy*ny;if(outward>0){ball.vx-=nx*outward*1.02;ball.vy-=ny*outward*1.02}}
  if(ball.x<27||ball.x>363){ball.x=clamp(ball.x,27,363);ball.vx*=-.32}
  const next=anchor+1;
  if(next<holds.length && grace>0){const h=holds[next];const r=length(h,ball);const speed=Math.hypot(ball.vx,ball.vy);
   // Extra forgiving magnetic grip: only catches reachable goal during a launched swing.
   if(r<108 && speed>.5){anchor=next;ball.vx*=.55;ball.vy*=.55;dust(h.x,h.y,h.col);catchPulse=22;shake=7;flash=7;grace=0;tone(730,.16,'sine');if(next===holds.length-1){won=true;msg.textContent='🎉 찰싹! 정상 도착!';tone(970,.24,'triangle')}else{msg.textContent='찰싹! 붙었다! 관성이 남아 있어!'}break}
  }
 }
}
function ellipse(x,y,rx,ry,col,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,390,780);ctx.save();if(shake>0)ctx.translate(Math.sin(shake*2.1)*shake*.38,Math.cos(shake*1.6)*shake*.22);let g=ctx.createLinearGradient(0,0,390,780);g.addColorStop(0,'#f2dfb6');g.addColorStop(1,'#dfc79b');ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
ctx.strokeStyle='#cfb88b';ctx.lineWidth=1;for(let y=26;y<780;y+=104){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(390,y);ctx.stroke()}for(let x=30;x<390;x+=85){for(let y=12;y<780;y+=89){ellipse(x,y,2,2,'#bda274')}}
// goal progression
for(let i=0;i<holds.length;i++){let h=holds[i];ellipse(h.x+3,h.y+6,h.r+3,h.r*.62,'#a58f75');ellipse(h.x,h.y,h.r,h.r*.67,h.col,'#94785c');ellipse(h.x-5,h.y-3,h.r*.35,h.r*.18,'#ffffff44');if(i>anchor&&!won){ctx.strokeStyle='#fdf8d9';ctx.lineWidth=3;ctx.setLineDash([4,7]);ctx.beginPath();ctx.arc(h.x,h.y,h.r+14+Math.sin(performance.now()/230)*2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}}
let base=holds[anchor];if(catchPulse>0){ctx.strokeStyle='#fff4b8';ctx.lineWidth=3+catchPulse/8;ctx.beginPath();ctx.arc(base.x,base.y,23+(22-catchPulse)*2.2,0,Math.PI*2);ctx.stroke()}
ctx.strokeStyle='#6d9dc2';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(ball.x-7,ball.y-20);ctx.stroke();
// cute basic blob bear: no rigging assets
ctx.save();ctx.translate(ball.x,ball.y);let sway=Math.max(-.28,Math.min(.28,ball.vx*.017));ctx.rotate(sway);ctx.strokeStyle='#956c48';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-16,17);ctx.lineTo(-21,43);ctx.moveTo(15,17);ctx.lineTo(20,43);ctx.stroke();ellipse(0,0,25,33,'#b98555','#8d6541');ctx.strokeStyle='#64a3d0';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(13,18);ctx.moveTo(14,-18);ctx.lineTo(-13,18);ctx.stroke();ellipse(0,-36,27,24,'#c49360','#8d6541');ellipse(-20,-56,10,10,'#bc8855');ellipse(20,-56,10,10,'#bc8855');ellipse(0,-28,15,11,'#eacb9e');ellipse(-9,-37,2.4,2.8,'#3f2f25');ellipse(9,-37,2.4,2.8,'#3f2f25');ellipse(0,-30,3.5,2.8,'#3f2f25');ctx.restore();
if(dragging&&dragTo){const pull=length(dragStart,dragTo),power=clamp(pull/140,0,1),base=holds[anchor];const dx=base.x-ball.x,dy=base.y-ball.y,d=Math.hypot(dx,dy)||1;
  ctx.strokeStyle=power>.8?'#e17e37':'#e0a34b';ctx.lineWidth=3+power*4;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+dx/d*(40+power*80),ball.y+dy/d*(40+power*80));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fff9e7d9';ctx.fillRect(119,665,152,24);ctx.fillStyle='#d7bb8d';ctx.fillRect(124,671,142,12);ctx.fillStyle=power>.8?'#e17e37':'#70b99d';ctx.fillRect(124,671,142*power,12);ctx.fillStyle='#765436';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('당기는 힘',195,658);
}
for(const p of particles)ellipse(p.x,p.y,Math.max(.5,p.life/10),Math.max(.5,p.life/10),p.col);
if(flash>0){ctx.fillStyle=`rgba(255,248,203,${flash/60})`;ctx.fillRect(0,0,390,780)}
ctx.restore();if(won){ctx.fillStyle='#fff7e6e8';ctx.fillRect(45,335,300,95);ctx.fillStyle='#775332';ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillText('🎉 완등 성공!',195,374);ctx.font='14px system-ui';ctx.fillText('다시 시작해서 한 번 더!',195,399)}
}
function frame(t){const dt=Math.min((t-last)/16.666||1,3);last=t;update(dt);draw();requestAnimationFrame(frame)}size();reset();requestAnimationFrame(frame);
</script></body></html>
