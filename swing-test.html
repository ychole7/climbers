<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><title>영차영차 등반대 — 대롱대롱 실험</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;background:#efe3ca}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;text-align:center;pointer-events:none;padding:12px;color:#63462d;text-shadow:0 1px #fff8;font-weight:800}#hud small{display:block;margin-top:5px;font-size:12px;font-weight:600}#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:16px;right:16px;display:flex;gap:10px;justify-content:center}button{background:#fff7e8;color:#67472b;border:2px solid #c8a77a;border-radius:25px;font-weight:800;padding:12px 20px;box-shadow:0 4px 0 #bfa57f}#status{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:14px;right:14px;text-align:center;color:#735338;font-weight:750;font-size:15px;pointer-events:none}#badge{position:absolute;top:calc(env(safe-area-inset-top) + 126px);right:12px;font-size:12px;background:#fff8e9d9;padding:6px 9px;border-radius:15px;color:#805e38;pointer-events:none}</style></head><body><div id="hud">🐻 영차영차 등반대 <small>대롱대롱 물리 실험 · 홀드 3개</small></div><div id="status">곰돌이를 뒤로 당겼다가 놓아 봐!</div><div id="badge">당기기 → 놓기 → 자동 잡기</div><canvas id="game"></canvas><div id="controls"><button id="retry">↻ 다시 시작</button><button id="help">? 조작</button></div><script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),msg=document.getElementById('status');
let W,H,dpr=1,scale,ox,oy,last=0,grabbed=false,dragging=false,won=false,failed=false,attempts=0,flash=0,particles=[];
const WORLD={w:390,h:780};const holds=[{x:135,y:245,r:19,col:'#7dbfb4'},{x:277,y:172,r:20,col:'#e7a664'},{x:164,y:78,r:22,col:'#b39ad6'}];
let ball,anchor=0,rope=105,handTip={x:0,y:0},dragStart=null,dragTo=null,prevPointer=null;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);scale=Math.min(W/WORLD.w,H/WORLD.h);ox=(W-WORLD.w*scale)/2;oy=(H-WORLD.h*scale)/2;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy)}
function pt(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function reset(){anchor=0;rope=104;ball={x:135,y:349,vx:0,vy:0};handTip={...holds[0]};grabbed=true;dragging=false;won=false;failed=false;dragStart=null;dragTo=null;attempts=0;flash=0;particles=[];msg.textContent='곰돌이를 당겼다가 놓아 봐!';}
function dust(x,y,col){for(let i=0;i<12;i++){let a=i*Math.PI*2/12;particles.push({x,y,vx:Math.cos(a)*(1.5+Math.random()*2),vy:Math.sin(a)*(1.5+Math.random()*2),life:36,col})}}
function pointerDown(e){e.preventDefault();if(won||failed)return;const p=pt(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)>95)return;dragging=true;dragStart=p;dragTo=p;prevPointer=p;cv.setPointerCapture(e.pointerId);msg.textContent='방향을 정하고 손가락을 놓아!';}
function pointerMove(e){if(!dragging)return;dragTo=pt(e);}
function pointerUp(e){if(!dragging)return;e.preventDefault();dragging=false;let dx=dragStart.x-dragTo.x,dy=dragStart.y-dragTo.y,dist=Math.hypot(dx,dy);if(dist<12){msg.textContent='조금 더 길게 당겨 봐!';return}const power=Math.min(145,dist)*.115;ball.vx+=dx/dist*power;ball.vy+=dy/dist*power;grabbed=false;attempts++;flash=7;msg.textContent='휙! 다음 홀드를 잡아라!';}
cv.addEventListener('pointerdown',pointerDown);cv.addEventListener('pointermove',pointerMove);cv.addEventListener('pointerup',pointerUp);cv.addEventListener('pointercancel',()=>dragging=false);document.getElementById('retry').onclick=reset;document.getElementById('help').onclick=()=>{msg.textContent='곰돌이를 반대 방향으로 당겨 발사! 가까운 위쪽 홀드를 자동으로 잡아.'};addEventListener('resize',size);
function update(dt){if(won||failed){particles=particles.filter(p=>p.life-- >0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05}return;}if(dragging)return;let step=Math.min(dt,2);for(let k=0;k<Math.ceil(step*2);k++){let t=step/Math.ceil(step*2);ball.vy+=.3*t;ball.vx*=Math.pow(.993,t);ball.vy*=Math.pow(.996,t);ball.x+=ball.vx*t;ball.y+=ball.vy*t;
// Elastic safety tether: anchored hand remains attached until a higher hold is caught.
let base=holds[anchor],dx=ball.x-base.x,dy=ball.y-base.y,d=Math.hypot(dx,dy)||1;const len=rope;
if(d>len){let nx=dx/d,ny=dy/d,stretch=d-len;ball.x-=nx*stretch;ball.y-=ny*stretch;let outward=ball.vx*nx+ball.vy*ny;if(outward>0){ball.vx-=nx*outward*1.04;ball.vy-=ny*outward*1.04}}
ball.x=Math.max(30,Math.min(360,ball.x));
// The reach trigger uses current swing tip, while only forward holds can be grabbed.
let next=anchor+1;if(next<holds.length){let h=holds[next];let tipx=ball.x+(h.x-ball.x)*.22,tipy=ball.y+(h.y-ball.y)*.22;let reach=Math.hypot(ball.x-h.x,ball.y-h.y);if(reach<110&&Math.hypot(ball.vx,ball.vy)>1.3){anchor=next;rope=104;dust(h.x,h.y,h.col);flash=12;ball.vx*=.4;ball.vy*=.4;if(next===holds.length-1){won=true;msg.textContent='🎉 정상 도착! 성공! 다시 해볼까?'}else msg.textContent='찰싹! 다음 홀드도 잡아보자!';break}}}
particles=particles.filter(p=>p.life-- >0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.05}flash=Math.max(0,flash-dt)}
function ellipse(x,y,rx,ry,col,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,390,780);let g=ctx.createLinearGradient(0,0,390,780);g.addColorStop(0,'#f2dfb6');g.addColorStop(1,'#dfc79b');ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
ctx.strokeStyle='#cfb88b';ctx.lineWidth=1;for(let y=26;y<780;y+=104){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(390,y);ctx.stroke()}for(let x=30;x<390;x+=85){for(let y=12;y<780;y+=89){ellipse(x,y,2,2,'#bda274')}}
// goal progression
for(let i=0;i<holds.length;i++){let h=holds[i];ellipse(h.x+3,h.y+6,h.r+3,h.r*.62,'#a58f75');ellipse(h.x,h.y,h.r,h.r*.67,h.col,'#94785c');ellipse(h.x-5,h.y-3,h.r*.35,h.r*.18,'#ffffff44');if(i>anchor&&!won){ctx.strokeStyle='#fdf8d9';ctx.lineWidth=3;ctx.setLineDash([4,7]);ctx.beginPath();ctx.arc(h.x,h.y,h.r+14+Math.sin(performance.now()/230)*2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}}
let base=holds[anchor];ctx.strokeStyle='#6d9dc2';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(ball.x-7,ball.y-20);ctx.stroke();
// cute basic blob bear: no rigging assets
ctx.save();ctx.translate(ball.x,ball.y);let sway=Math.max(-.28,Math.min(.28,ball.vx*.017));ctx.rotate(sway);ctx.strokeStyle='#956c48';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-16,17);ctx.lineTo(-21,43);ctx.moveTo(15,17);ctx.lineTo(20,43);ctx.stroke();ellipse(0,0,25,33,'#b98555','#8d6541');ctx.strokeStyle='#64a3d0';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(13,18);ctx.moveTo(14,-18);ctx.lineTo(-13,18);ctx.stroke();ellipse(0,-36,27,24,'#c49360','#8d6541');ellipse(-20,-56,10,10,'#bc8855');ellipse(20,-56,10,10,'#bc8855');ellipse(0,-28,15,11,'#eacb9e');ellipse(-9,-37,2.4,2.8,'#3f2f25');ellipse(9,-37,2.4,2.8,'#3f2f25');ellipse(0,-30,3.5,2.8,'#3f2f25');ctx.restore();
if(dragging&&dragTo){const dx=dragStart.x-dragTo.x,dy=dragStart.y-dragTo.y;ctx.strokeStyle='#e1993c';ctx.lineWidth=4;ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+dx*.75,ball.y+dy*.75);ctx.stroke();ctx.setLineDash([]);ellipse(ball.x+dx*.75,ball.y+dy*.75,8,8,'#e6a348')}
for(const p of particles)ellipse(p.x,p.y,Math.max(.5,p.life/10),Math.max(.5,p.life/10),p.col);
if(flash>0){ctx.fillStyle=`rgba(255,248,203,${flash/60})`;ctx.fillRect(0,0,390,780)}
if(won){ctx.fillStyle='#fff7e6e8';ctx.fillRect(45,335,300,95);ctx.fillStyle='#775332';ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillText('🎉 완등 성공!',195,374);ctx.font='14px system-ui';ctx.fillText('다시 시작해서 한 번 더!',195,399)}
}
function frame(t){const dt=Math.min((t-last)/16.666||1,3);last=t;update(dt);draw();requestAnimationFrame(frame)}size();reset();requestAnimationFrame(frame);
</script></body></html>
