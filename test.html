<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/><title>영차영차 등반대 | 오른팔 독립 리깅 V2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:#664029;background:#4f3428}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}button{font:inherit;touch-action:manipulation}.app{height:100dvh;min-height:570px;width:min(100vw,460px);margin:0 auto;position:relative;overflow:hidden;background:#dec0a4 url('assets/scenery/gym-art.webp') center center/cover no-repeat;isolation:isolate}.app:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#7e42252a,transparent 16%,transparent 84%,#7e42252a);z-index:-1}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:7px;z-index:5}.tile{min-width:0;flex:1;text-align:center;border:2px solid #fff8eb;border-bottom:5px solid #d4a578;border-radius:19px;background:#fff4deed;padding:9px 2px;box-shadow:0 6px 18px #6d351a33}.tile:first-child{flex:1.16}.tile small{font-size:11px;font-weight:800}.tile b{font-size:22px;display:block;line-height:1.15;color:#ab661b}.stagewrap{position:absolute;left:6%;right:6%;top:17%;height:68%;border:10px solid #bb8f66;border-radius:26px 26px 18px 18px;background:#f2e5d3;box-shadow:inset 0 0 35px #ad927d55,0 9px 19px #613a344d;overflow:hidden}.stage{position:absolute;width:390px;height:600px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center;touch-action:none}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 22px 28px,#b4a296aa 0 2px,transparent 2.5px) 0 0/35px 43px,linear-gradient(140deg,#fff5e9,#eddccd 56%,#e4cabb);pointer-events:none}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 47.8%,#cbb4a45a 48%,transparent 48.25%),linear-gradient(35deg,transparent 61.8%,#e8bfc38c 62%,transparent 62.25%);pointer-events:none}.flag{position:absolute;top:-33px;left:47%;width:5px;height:45px;background:#9b623e;z-index:3}.flag:before{content:'🐻';position:absolute;top:0;left:4px;width:47px;height:30px;background:#f36a88;clip-path:polygon(0 0,100% 9%,87% 90%,0 84%);display:grid;place-items:center;font-size:20px}.hold{position:absolute;z-index:2;width:58px;height:49px;translate:-50% -50%;border:0;border-radius:43% 52% 44% 50%;transform:rotate(var(--r,0deg));background:var(--c,#eeaf39);box-shadow:inset 5px 7px 7px #ffffffa0,inset -9px -7px 9px #3f3a3a45,0 8px 6px #684d3a42;cursor:pointer;display:grid;place-items:center;color:transparent;outline:none}.hold:before{content:'';border-radius:50%;background:#3f4148;border:3px solid #73717b;box-shadow:0 2px 2px #2b2725a0;width:12px;height:12px}.hold.support{pointer-events:none;cursor:default}.hold.target:after{content:'';position:absolute;inset:-9px;border:3px dashed #fffaee;border-radius:50%;box-shadow:0 0 0 4px #e8a71d77;animation:pulse 1.5s ease-in-out infinite}.hold.reached:after{content:'✓';position:absolute;inset:-6px;border:3px solid #5bba92;border-radius:50%;font-weight:900;font-size:24px;display:grid;place-items:center;color:white;text-shadow:0 1px 2px #428c74;background:#70caa11f}.hold:focus-visible{outline:3px solid #369d93;outline-offset:5px}.hold.invalid:after{content:'×';position:absolute;inset:-5px;display:grid;place-items:center;color:#b4363b;font-weight:900;font-size:25px;background:#ffebebaa;border:2px solid #cf5050;border-radius:50%}@keyframes pulse{50%{box-shadow:0 0 0 7px #f3b52d55}}/* Split-image rig: torso & 3 anchored limbs remain still; ONLY right_arm rotates. */
.bear{position:absolute;left:0;top:205px;width:390px;height:390px;z-index:4;pointer-events:none;filter:drop-shadow(5px 10px 8px #56463d55)}
.bear img{position:absolute;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.arm{transform-origin:65% 49%;transform:rotate(35deg);transition:transform .54s cubic-bezier(.2,.7,.2,1);will-change:transform}
.arm.dragging{transition:none}
.hand-zone{position:absolute;width:70px;height:70px;z-index:7;translate:-50% -50%;border:2px solid #fff8ecb0;border-radius:50%;background:#fbc86711;box-shadow:0 0 0 7px #edb44c20;touch-action:none;cursor:grab;transition:opacity .2s}
.hand-zone.dragging{cursor:grabbing;background:#ffda8c60}
.hand-zone:focus-visible{outline:4px solid #2ca389}
.hand-zone:after{content:'✋';position:absolute;bottom:-19px;left:50%;translate:-50% 0;background:#fff5d9;border-radius:50%;font-size:16px;padding:3px 7px;box-shadow:0 2px 4px #784d2c66}
.hold.start:after{content:'✓';position:absolute;inset:-4px;border:2px solid #8ae0bb;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px}
.grip{position:absolute;width:26px;height:26px;border-radius:50%;z-index:6;pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;background:#ffe9ab9e;border:3px solid #fff;box-shadow:0 0 0 5px #5cbb9b88}.grip.shown{opacity:1}.cue{position:absolute;left:50%;top:14px;transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:900;color:#754522;background:#fffaf3e8;padding:9px 14px;border-radius:30px;z-index:5;box-shadow:0 4px 14px #6c42252a}.flight{position:absolute;z-index:3;overflow:visible;pointer-events:none;inset:0;width:100%;height:100%}.flight path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:6 12;filter:drop-shadow(0 2px 1px #cc863c)}.foot{position:absolute;bottom:0;left:0;right:0;z-index:6;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#bb805a 0%,#d6a174 82%,transparent);text-align:center}.prompt{background:#fff6e6;border:2px solid white;border-radius:24px;font-weight:850;font-size:14px;padding:11px 10px;margin:0 6px 10px;box-shadow:0 5px 9px #583a252b;min-height:47px}.actions{display:flex;gap:8px}.actions button{flex:1;min-height:51px;border-radius:18px;border:2px solid white;border-bottom:5px solid #ba886a;background:#fff2d9;color:#65442c;font-weight:900;font-size:14px;cursor:pointer}.actions button.primary{background:#5cba9b;color:white;border-color:#b7f0df;border-bottom-color:#36937d}.actions button:disabled{opacity:.54;cursor:default}.note{margin:9px 2px 0;color:#fff8ed;text-shadow:0 1px 3px #75472d;font-size:11px;font-weight:700;line-height:1.45}.msg{position:absolute;top:96px;left:10%;width:80%;border-radius:15px;padding:8px;background:#fff9e5;border:2px solid white;text-align:center;color:#6f421f;z-index:6;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s}.msg.visible{opacity:1}@media(max-height:720px){.stagewrap{top:17%;height:64%}.tile b{font-size:19px}.prompt{padding:8px 4px;margin-bottom:6px}.note{font-size:10px}}
</style></head><body><main class="app"><header class="hud"><div class="tile"><small>STAGE 01</small><b>🐾 연습</b></div><div class="tile"><small>오른팔 독립 이동</small><b id="step">0 / 1</b></div><div class="tile"><small>곰돌이 미션</small><b id="mission">🐻 잡아봐!</b></div></header><section class="stagewrap" id="stagewrap" aria-label="오른팔만 움직이는 테스트 벽"><div class="stage" id="stage">
<div class="flag"></div><div class="cue" id="cue">오른손을 끌어서 위쪽 홀드로!</div>
<button class="hold support" style="left:110px;top:281px;--c:#5b9ed6;--r:12deg" type="button" aria-label="고정된 왼손 지지 홀드" tabindex="-1"></button>
<button class="hold support" style="left:143px;top:544px;--c:#9c7cdb;--r:-17deg" type="button" aria-label="고정된 왼발 지지 홀드" tabindex="-1"></button>
<button class="hold support" style="left:284px;top:541px;--c:#63ba9b;--r:11deg" type="button" aria-label="고정된 오른발 지지 홀드" tabindex="-1"></button>
<div id="startHold" class="hold support start" style="left:342px;top:315px;--c:#f7ba3d;--r:17deg"></div>
<button id="target" class="hold target" style="left:283px;top:273px;--c:#f4a62c;--r:-15deg" type="button" aria-label="오른손을 옮길 노란 목표 홀드"></button>
<button id="farTarget" class="hold" style="left:346px;top:100px;--c:#ad80e5;--r:18deg" type="button" aria-label="아직 멀어서 잡을 수 없는 홀드"></button>
<div class="bear" id="bear"><img id="body" src="assets/characters/bear/rig/body.png" alt="왼팔과 양발이 고정된 곰돌이"><img id="arm" class="arm" src="assets/characters/bear/rig/right_arm.png" alt="독립적으로 움직이는 오른팔"></div>
<button id="handZone" class="hand-zone" type="button" aria-label="오른손을 드래그해서 노란 홀드를 잡기"></button>
<div id="grip" class="grip" style="left:283px;top:273px"></div>
</div></section><div class="msg" role="status" aria-live="polite" id="msg"></div><footer class="foot"><p class="prompt" id="prompt">오른손을 <strong>위쪽 노란 홀드</strong>로 드래그하거나 터치해 봐!</p><div class="actions"><button id="reset" type="button">↻ 다시하기</button><button class="primary" id="go" type="button">✋ 자동 뻗기</button></div><p class="note">파츠 분리 실험 · 왼손과 양발은 고정, 오른팔만 회전<br>원본 이미지에서 추출한 임시 파츠 · 완전한 관절 리깅은 다음 단계</p></footer></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), stage=$('stage'),wrap=$('stagewrap'),arm=$('arm'),body=$('body'),target=$('target'),far=$('farTarget'),hand=$('handZone'),cue=$('cue'),step=$('step'),mission=$('mission'),prompt=$('prompt'),go=$('go'),msg=$('msg'),startHold=$('startHold'),grip=$('grip');
const pivot={x:253.5,y:396.1}, original={x:282,y:281}, startAngle=35, goal={x:283,y:273};
const axisAngle=Math.atan2(original.y-pivot.y,original.x-pivot.x)*180/Math.PI;
const length=Math.hypot(original.x-pivot.x,original.y-pivot.y);
let angle=startAngle, state='ready',dragging=false,dragId=null,run=0,timer;
function resize(){stage.style.setProperty('--stage-scale',Math.min(wrap.clientWidth/390,wrap.clientHeight/600));placeHand()}
new ResizeObserver(resize).observe(wrap);
function handPos(){const a=(axisAngle+angle)*Math.PI/180;return {x:pivot.x+length*Math.cos(a),y:pivot.y+length*Math.sin(a)}}
function placeHand(){const p=handPos();hand.style.left=p.x+'px';hand.style.top=p.y+'px'}
function setArm(v,immediate=false){angle=Math.max(-28,Math.min(72,v));arm.classList.toggle('dragging',immediate);arm.style.transform=`rotate(${angle}deg)`;placeHand()}
function stageXY(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*390,y:(e.clientY-r.top)/r.height*600}}
function aim(p){return Math.atan2(p.y-pivot.y,p.x-pivot.x)*180/Math.PI-axisAngle}
function say(s){msg.textContent=s;msg.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>msg.classList.remove('visible'),2100)}
function reset(){run++;state='ready';dragging=false;hand.classList.remove('dragging');setArm(startAngle,false);target.classList.add('target');target.classList.remove('reached');startHold.classList.add('start');grip.classList.remove('shown');step.textContent='0 / 1';mission.textContent='🐻 잡아봐!';cue.textContent='오른손을 끌어서 위쪽 홀드로!';prompt.innerHTML='오른손을 <strong>위쪽 노란 홀드</strong>로 드래그하거나 터치해 봐!';go.disabled=false;go.textContent='✋ 자동 뻗기';hand.disabled=false;hand.style.opacity='1'}
function reach(){if(state!=='ready')return;const dist=Math.hypot(goal.x-pivot.x,goal.y-pivot.y);if(Math.abs(dist-length)>19){say('거리가 닿지 않아!');return}state='moving';const token=++run;hand.disabled=true;go.disabled=true;hand.style.opacity='.35';setArm(aim(goal));target.classList.remove('target');startHold.classList.remove('start');cue.textContent='영차! 오른팔만 쭉!';prompt.textContent='왼손과 양발은 그 자리에 그대로!';setTimeout(()=>{if(token!==run)return;state='reached';target.classList.add('reached');grip.classList.add('shown');setTimeout(()=>grip.classList.remove('shown'),450);step.textContent='1 / 1';mission.textContent='🐻 성공!';cue.textContent='오른팔만 움직였다!';prompt.textContent='오른팔 독립 이동 성공! 왼손과 양발이 고정됐는지 확인해 줘.';go.disabled=false;go.textContent='↻ 한 번 더'},600)}
hand.addEventListener('pointerdown',e=>{if(state!=='ready')return;dragging=true;dragId=e.pointerId;hand.setPointerCapture(e.pointerId);hand.classList.add('dragging');arm.classList.add('dragging');e.preventDefault()});
hand.addEventListener('pointermove',e=>{if(!dragging||dragId!==e.pointerId)return;setArm(aim(stageXY(e)),true)});
function release(e){if(!dragging||e.pointerId!==dragId)return;dragging=false;dragId=null;hand.classList.remove('dragging');arm.classList.remove('dragging');const p=handPos();if(Math.hypot(p.x-goal.x,p.y-goal.y)<49){reach()}else{setArm(startAngle);say('조금 더 위쪽 노란 홀드로 끌어 봐!')}}
hand.addEventListener('pointerup',release);hand.addEventListener('pointercancel',e=>{if(!dragging||dragId!==e.pointerId)return;dragging=false;dragId=null;hand.classList.remove('dragging');setArm(startAngle)});
target.addEventListener('click',reach);go.addEventListener('click',()=>state==='ready'?reach():reset());$('reset').addEventListener('click',reset);far.addEventListener('click',()=>say('보라색 홀드는 너무 멀어! 노란 홀드부터 잡아봐.'));
[body,arm].forEach(im=>im.addEventListener('error',()=>say('곰돌이 리깅 이미지가 없어! assets/characters/bear/rig/ 경로를 확인해줘.')));
window.addEventListener('resize',resize);resize();reset();
})();
</script></body></html>
