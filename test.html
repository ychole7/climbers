<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>영차영차 등반대 | 고정 테스트</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;color:#623a25}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}button{font:inherit}.app{width:min(100vw,480px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:#ddbb98 url('assets/scenery/gym-art.webp') center/cover no-repeat;isolation:isolate}.app:before{content:'';position:absolute;inset:0;background:linear-gradient(#8755322c,#ffffff08 50%,#a7663945);z-index:-1}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:7px;z-index:3}.tile{flex:1;min-width:0;text-align:center;background:#fff2dcf5;border:2px solid #fff8ee;border-bottom:5px solid #d5a67c;border-radius:19px;padding:10px 3px;box-shadow:0 5px 13px #78483030}.tile:first-child{flex:1.08}.tile small{display:block;font-size:11px;font-weight:800}.tile b{display:block;font-size:21px;color:#a66624;line-height:1.25}.wall{position:absolute;left:6%;right:6%;top:17%;height:65%;background:#f4e6d7;border:9px solid #bc9168;border-radius:26px;box-shadow:inset 0 0 40px #99775b29,0 11px 22px #58352b4a;overflow:hidden;display:grid;place-items:center}.stage{position:relative;width:390px;height:600px;flex:none;transform:scale(var(--scale,1));background:radial-gradient(circle at 16px 24px,#bba89b99 0 2px,transparent 2.5px) 0 0/34px 40px,linear-gradient(145deg,#fff0df,#e9d5c8 75%);touch-action:none}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,transparent 48%,#d3b8a359 48.25%,transparent 48.6%),linear-gradient(30deg,transparent 66%,#e9bfc257 66.4%,transparent 66.7%);pointer-events:none}.stage canvas{position:absolute;inset:0;width:390px;height:600px;touch-action:none;display:block}.flag{position:absolute;top:0;left:48%;height:40px;width:5px;background:#a46b43;z-index:1}.flag:after{content:'🐻';position:absolute;top:0;left:5px;width:47px;height:30px;clip-path:polygon(0 0,100% 10%,84% 90%,0 82%);background:#ed6381;display:grid;place-items:center}.cue{position:absolute;left:50%;top:22px;transform:translateX(-50%);white-space:nowrap;padding:8px 12px;background:#fff9ebed;border-radius:22px;z-index:2;font-size:12px;font-weight:850;box-shadow:0 4px 10px #835b4b29;pointer-events:none}.footer{position:absolute;left:0;right:0;bottom:0;padding:12px 14px max(14px,env(safe-area-inset-bottom));z-index:4;background:linear-gradient(0deg,#b87f5d 0%,#d2a176 82%,transparent);text-align:center}.message{font-size:14px;font-weight:800;background:#fff6e5;border:2px solid white;border-radius:22px;min-height:48px;padding:12px 8px;margin:0 0 10px;box-shadow:0 4px 10px #56382730}.actions{display:flex;gap:9px}.actions button{flex:1;min-height:52px;border:2px solid white;border-bottom:5px solid #af7d60;border-radius:18px;background:#fff0d5;color:#60402c;font-weight:900;font-size:14px}.actions .primary{background:#56b99b;color:white;border-color:#baf7de;border-bottom-color:#39937d}.actions button:disabled{opacity:.5}.note{font-size:11px;font-weight:700;color:#fff7e7;text-shadow:0 1px 2px #61402e;margin:10px 0 0;line-height:1.4}@media(max-height:700px){.wall{top:16%;height:62%}.tile b{font-size:18px}.message{padding:9px 5px;min-height:40px}.footer{padding-top:7px}.note{font-size:10px}}
</style></head><body><main class="app"><div class="hud"><div class="tile"><small>STAGE 01</small><b>🐾 연습</b></div><div class="tile"><small>오른손 이동</small><b id="counter">0 / 1</b></div><div class="tile"><small>곰돌이 미션</small><b id="status">🐻 잡아봐!</b></div></div><section id="wall" class="wall"><div id="stage" class="stage"><span class="flag"></span><div id="cue" class="cue">오른손을 노란 홀드로 드래그!</div><canvas id="canvas" width="780" height="1200" aria-label="후면 3/4 곰돌이의 오른손 이동 테스트"></canvas></div></section><footer class="footer"><p id="message" class="message">오른손을 누르고 위쪽 노란 홀드로 끌어봐!</p><div class="actions"><button id="reset">↻ 다시하기</button><button id="auto" class="primary">✋ 자동 뻗기</button></div><p class="note">후면 3/4 · 표정 보이는 옆얼굴 · 오른손만 이동<br>왼손·양발 접점 고정 / 같은 test.html 계속 사용</p></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),wall=$('wall'),cv=$('canvas'),ctx=cv.getContext('2d');ctx.scale(2,2);
const root='assets/characters/ik_back/';const names=['bear_body_back','bear_head_turn_R','bear_head_back','upperarm_back_L','upperarm_back_R','forearm_back_L','forearm_back_R','thigh_back_L','thigh_back_R','shin_back_L','shin_back_R','paw_hand_back_L','paw_hand_back_R','paw_foot_back_L','paw_foot_back_R'];
const imgs={};let ready=false,loaded=0;names.forEach(n=>{let im=new Image();im.onload=()=>{if(++loaded===names.length){ready=true;requestAnimationFrame(draw)}};im.onerror=()=>{say('캐릭터 자산을 불러오지 못했어: '+n+'.png')};im.src=root+n+'.png';imgs[n]=im});
const S=.57,LARM=115*S,LLEG=105*S;
const holds=[{id:'lh',x:137,y:264,c:'#468fd9',r:-.2},{id:'rh',x:276,y:264,c:'#eeb83c',r:.2},{id:'lf',x:159,y:469,c:'#a47bd9',r:.17},{id:'rf',x:264,y:469,c:'#56bea3',r:-.2},{id:'target',x:321,y:195,c:'#f5b932',r:.35},{id:'dec1',x:105,y:157,c:'#dfb83c',r:.3},{id:'dec2',x:316,y:110,c:'#a77be8',r:.14},{id:'dec3',x:73,y:359,c:'#ea768b',r:-.3},{id:'dec4',x:344,y:348,c:'#b49b8b',r:-.2}];
const contact={lh:{x:137,y:264},rh:{x:276,y:264},lf:{x:159,y:469},rf:{x:264,y:469}};
let body={x:201,y:355},progress=0,dragging=false,anim=null,complete=false,hand={...contact.rh};let last=performance.now();
function resize(){const scale=Math.min(wall.clientWidth/390,wall.clientHeight/600);stage.style.setProperty('--scale',scale);requestAnimationFrame(draw)}new ResizeObserver(resize).observe(wall);resize();
function say(t){$('message').textContent=t}
function lerp(a,b,t){return a+(b-a)*t}function ease(t){return t*t*(3-2*t)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function polygonHold(h,highlight=false){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.r);ctx.shadowColor='#5a4a4290';ctx.shadowBlur=8;ctx.shadowOffsetY=7;let grd=ctx.createLinearGradient(-27,-22,26,30);grd.addColorStop(0,'#fff8e4');grd.addColorStop(.2,h.c);grd.addColorStop(1,h.c);ctx.fillStyle=grd;ctx.beginPath();ctx.moveTo(-26,-12);ctx.quadraticCurveTo(-11,-30,16,-20);ctx.quadraticCurveTo(35,-9,27,13);ctx.quadraticCurveTo(11,30,-13,23);ctx.quadraticCurveTo(-36,13,-26,-12);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#454850';ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#96999e';ctx.lineWidth=3;ctx.stroke();ctx.restore();if(highlight&&!complete){ctx.save();ctx.strokeStyle='#fff9d4';ctx.lineWidth=4;ctx.setLineDash([7,8]);ctx.beginPath();ctx.arc(h.x,h.y,37,0,Math.PI*2);ctx.stroke();ctx.restore()}}
function imageAt(name,x,y,size=S,angle=0,cx=256,cy=256){if(!imgs[name]?.complete||!imgs[name].naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size,size);ctx.drawImage(imgs[name],-cx,-cy);ctx.restore()}
function segment(name,a,b,top=199){let angle=Math.atan2(b.y-a.y,b.x-a.x)-Math.PI/2;imageAt(name,a.x,a.y,S,angle,256,top)}
function joint(a,b,l1,l2,side){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);d=clamp(d,Math.abs(l1-l2)+.0001,l1+l2-.0001);let uX=dx/(Math.hypot(dx,dy)||1),uY=dy/(Math.hypot(dx,dy)||1);const along=(l1*l1-l2*l2+d*d)/(2*d),height=Math.sqrt(Math.max(0,l1*l1-along*along));return{x:a.x+uX*along+(-uY)*height*side,y:a.y+uY*along+uX*height*side}}
function skeletalPoint(key){let offsets={lh:[-42,-40],rh:[42,-40],lf:[-32,48],rf:[32,48]};let p=offsets[key];return{x:body.x+p[0]*S,y:body.y+p[1]*S}}
function drawLimb(key,reach){let shoulder=skeletalPoint(key),tip=key==='rh'?hand:contact[key],isArm=key.endsWith('h');const limbSide=key[0].toUpperCase(),l=isArm?LARM:LLEG,side=(key[0]==='r'?1:-1);let j=joint(shoulder,tip,l,l,side);let first=(isArm?'upperarm_back_':'thigh_back_')+limbSide,second=(isArm?'forearm_back_':'shin_back_')+limbSide;segment(first,shoulder,j,isArm?199:204);segment(second,j,tip,isArm?199:204);imageAt((isArm?'paw_hand_back_':'paw_foot_back_')+limbSide,tip.x,tip.y,S*.88)}
function draw(){ctx.clearRect(0,0,390,600);ctx.save();ctx.strokeStyle='#cdb3a255';ctx.lineWidth=1;for(let x=18;x<390;x+=37)for(let y=31;y<600;y+=42){ctx.fillStyle='#aa908389';ctx.beginPath();ctx.arc(x,y,1.8,0,Math.PI*2);ctx.fill()}ctx.restore();holds.forEach(h=>polygonHold(h,h.id==='target'));if(!ready)return;
// Far limbs and body are kept as independently anchored parts.
drawLimb('lf');drawLimb('rf');drawLimb('lh');
imageAt('bear_body_back',body.x,body.y);
// Right arm moves in front of body while all other endpoints remain anchored.
drawLimb('rh');
imageAt('bear_head_turn_R',body.x+4,body.y-101*S);
if(!complete){ctx.save();ctx.strokeStyle='#f9fff9';ctx.lineWidth=4;ctx.setLineDash([5,9]);ctx.beginPath();ctx.moveTo(hand.x,hand.y);ctx.quadraticCurveTo(320,268,321,195);ctx.stroke();ctx.restore()}
if(dragging){ctx.strokeStyle='#f7c657';ctx.lineWidth=3;ctx.beginPath();ctx.arc(hand.x,hand.y,24,0,Math.PI*2);ctx.stroke()}}
function interpolate(t){const e=ease(t);hand={x:lerp(contact.rh.x,321,e),y:lerp(contact.rh.y,195,e)};body={x:lerp(201,230,e),y:lerp(355,329,e)};draw()}
function finish(){complete=true;progress=1;hand={x:321,y:195};body={x:230,y:329};draw();$('counter').textContent='1 / 1';$('status').textContent='🐻 성공!';$('cue').textContent='잡았다! 영차!';say('오른손 이동 성공! 왼손과 양발은 같은 홀드에 고정됐어.');$('auto').textContent='↻ 한 번 더'}
function animate(){if(complete){reset();return}if(anim)return;dragging=false;const start=performance.now();say('영차! 오른팔을 뻗는 중…');$('cue').textContent='조금만 더!';function frame(now){let t=clamp((now-start)/750,0,1);interpolate(t);if(t<1){anim=requestAnimationFrame(frame)}else{anim=null;finish()}}anim=requestAnimationFrame(frame)}
function reset(){if(anim)cancelAnimationFrame(anim);anim=null;complete=false;dragging=false;progress=0;hand={...contact.rh};body={x:201,y:355};$('counter').textContent='0 / 1';$('status').textContent='🐻 잡아봐!';$('cue').textContent='오른손을 노란 홀드로 드래그!';$('auto').textContent='✋ 자동 뻗기';say('오른손을 누르고 위쪽 노란 홀드로 끌어봐!');draw()}
function point(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*390,y:(e.clientY-b.top)/b.height*600}}
cv.addEventListener('pointerdown',e=>{if(complete||anim)return;let p=point(e);if(Math.hypot(p.x-hand.x,p.y-hand.y)<42){dragging=true;cv.setPointerCapture(e.pointerId);$('cue').textContent='목표 홀드에 손을 올려봐!'}});
cv.addEventListener('pointermove',e=>{if(!dragging||complete)return;let p=point(e);let t=clamp(((p.y-contact.rh.y)*(195-contact.rh.y)+(p.x-contact.rh.x)*(321-contact.rh.x))/(Math.pow(195-contact.rh.y,2)+Math.pow(321-contact.rh.x,2)),0,1);interpolate(t)});
cv.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;let p=point(e);if(Math.hypot(p.x-321,p.y-195)<60||Math.hypot(hand.x-321,hand.y-195)<22)animate();else{interpolate(0);$('cue').textContent='오른손을 노란 홀드로 드래그!';say('손을 노란 홀드 가까이 가져가 봐!')}});
cv.addEventListener('pointercancel',()=>{dragging=false;interpolate(0)});cv.addEventListener('click',e=>{if(anim||complete)return;let p=point(e);if(Math.hypot(p.x-321,p.y-195)<42)animate()});$('auto').addEventListener('click',animate);$('reset').addEventListener('click',reset);
reset();
})();
</script></body></html>
