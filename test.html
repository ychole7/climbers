<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>영차영차 등반대 · 고정벽 포즈 실험</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#603a26}body{background:#5e4b3e}.app{max-width:480px;margin:auto;height:100dvh;min-height:600px;position:relative;overflow:hidden;background:#c88c5a url('assets/scenery/gym-art.webp') center/cover}.app:before{content:'';position:absolute;inset:0;background:linear-gradient(#5f34232b,#e8bb7c16 50%,#6a422775);pointer-events:none}.hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:3%;right:3%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;z-index:10}.hud section{min-width:0;background:#fff1daf5;border:2px solid #fffbef;border-bottom:5px solid #dab289;border-radius:17px;text-align:center;padding:8px 1px;box-shadow:0 4px 10px #4d271a40}.hud small{display:block;font-size:clamp(9px,2.8vw,12px);font-weight:800}.hud b{color:#aa641e;font-size:clamp(14px,4.6vw,22px);white-space:nowrap}.wall{position:absolute;top:clamp(108px,18%,160px);bottom:clamp(153px,21%,210px);left:4%;right:4%;background:linear-gradient(130deg,#f9e8d7 0 42%,#f3ded4 42% 72%,#e1d8e6 72%);border:10px solid #c29368;border-radius:24px;box-shadow:0 8px 22px #42251b55;overflow:hidden}.wall:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#957d7159 1.35px,transparent 1.75px);background-size:25px 25px;pointer-events:none}.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(36deg,transparent 43%,#d8b9a477 43.2%,transparent 43.5%),linear-gradient(144deg,transparent 52%,#d8b9a477 52.2%,transparent 52.5%);pointer-events:none}.scene{position:absolute;left:50%;top:50%;width:360px;height:520px;transform:translate(-50%,-50%);transform-origin:center;--scale:1;zoom:1}.hold{position:absolute;border-radius:38% 58% 43% 46%;transform:translate(-50%,-50%) rotate(-12deg);box-shadow:inset -6px -8px 7px #0002,inset 3px 4px 7px #fff7,0 7px 5px #5c342344;z-index:1}.hold:after{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);background:#414146;border:3px solid #88858b;border-radius:50%}.yellow{background:#f6bb21}.blue{background:#358ad6}.pink{background:#f36e8c}.green{background:#4ab7a1}.purple{background:#ad79de}.grey{background:#a69a97}.pose{position:absolute;left:31px;top:122px;width:300px;height:360px;opacity:0;z-index:3;object-fit:contain;pointer-events:none;transition:opacity .19s ease,transform .28s cubic-bezier(.2,.8,.2,1);transform:translateY(5px);filter:drop-shadow(0 6px 4px #5a312d44)}.pose.on{opacity:1;transform:translateY(0)}.target{position:absolute;z-index:5;width:84px;height:84px;border:3px dashed #fff9dc;border-radius:50%;box-shadow:0 0 0 5px #f1bb4690,0 0 17px #ffdc54;transform:translate(-50%,-50%);background:#ffe36933;cursor:pointer;touch-action:manipulation;animation:pulse 1.3s infinite}.target.hidden{display:none}@keyframes pulse{50%{box-shadow:0 0 0 10px #eabb4650,0 0 22px #ffdc54}}.cue{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#fff7e9ed;border-radius:18px;font-size:12px;white-space:nowrap;font-weight:800;z-index:7}.footer{position:absolute;bottom:0;left:0;right:0;padding:12px 3% calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#bc815c 15%,#bf8762);z-index:9}.status{border-radius:25px;background:#fff5e3;border:2px solid white;text-align:center;font-weight:800;padding:13px 5px;font-size:clamp(12px,3.5vw,15px);margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:2px solid #fff7e9;border-radius:18px;background:#fff0d9;font-weight:900;color:#76452b;padding:14px 0;font-size:16px;box-shadow:0 5px 0 #795d4b45;cursor:pointer}.actions button.main{background:#54b99c;color:white}.small{text-align:center;color:#fff8e8;font-size:11px;font-weight:700;margin:15px 0 0;text-shadow:0 1px 4px #60392e}.stage-frame{position:absolute;inset:0;overflow:hidden}@media(max-height:720px){.wall{top:105px;bottom:154px}.footer{padding-top:8px}.small{margin-top:8px}.actions button{padding:9px 0}}@media(prefers-reduced-motion:reduce){.pose,.target{transition:none;animation:none}}</style></head>
<body><main class="app"><header class="hud"><section><small>STAGE 01</small><b>🐾 연습</b></section><section><small>이동 횟수</small><b id="count">0 / 2</b></section><section><small>곰돌이 미션</small><b id="mission">준비!</b></section></header><section class="wall" id="wall" aria-label="위치가 고정된 클라이밍 벽"><div class="stage-frame"><div class="scene" id="scene"><div class="hold yellow" style="left:128px;top:140px;width:70px;height:50px"></div><div class="hold yellow" style="left:257px;top:118px;width:65px;height:52px"></div><div class="hold purple" style="left:75px;top:242px;width:59px;height:49px"></div><div class="hold blue" style="left:112px;top:351px;width:67px;height:54px"></div><div class="hold green" style="left:223px;top:428px;width:68px;height:48px"></div><div class="hold pink" style="left:290px;top:261px;width:60px;height:48px"></div><div class="hold grey" style="left:72px;top:96px;width:37px;height:32px"></div><div class="hold purple" style="left:290px;top:46px;width:51px;height:45px"></div><div class="hold yellow" style="left:75px;top:403px;width:56px;height:43px"></div><img id="p0" class="pose on" src="assets/characters/bear/poses/bear_pose_01.png" alt="기본 매달림"><img id="p1" class="pose" src="assets/characters/bear/poses/bear_pose_02.png" alt="오른손 뻗기"><img id="p2" class="pose" src="assets/characters/bear/poses/bear_pose_03.png" alt="발 올리기"><button id="target" class="target" style="left:257px;top:118px" aria-label="목표 홀드 잡기"></button><div id="cue" class="cue">빛나는 홀드를 눌러 봐!</div></div></div></section><footer class="footer"><p class="status" id="status" role="status">오른손을 위쪽 노란 홀드로 옮겨 봐!</p><div class="actions"><button id="reset" type="button">↻ 다시하기</button><button id="go" class="main" type="button">✋ 손 뻗기</button></div><p class="small">고정 벽 + 투명 곰돌이 포즈 분리 · 자유 등반은 아직 미구현</p></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const poses=[$('p0'),$('p1'),$('p2')],target=$('target'),go=$('go');let step=0;function resize(){const w=$('wall').clientWidth-20,h=$('wall').clientHeight-20;const scale=Math.min(w/360,h/520);const scene=$('scene');scene.style.transform=`translate(-50%,-50%) scale(${scale})`;}function render(){poses.forEach((p,i)=>p.classList.toggle('on',i===step));$('count').textContent=`${step} / 2`;$('mission').textContent=step===2?'성공!':step===1?'영차!':'준비!';$('status').textContent=['오른손을 위쪽 노란 홀드로 옮겨 봐!','좋아! 다음은 발을 올려 보자!','완료! 벽과 홀드는 움직이지 않아.'][step];$('cue').textContent=['빛나는 홀드를 눌러 봐!','이제 발을 딛자!','잘했어! 🎉'][step];go.textContent=['✋ 손 뻗기','👣 발 올리기','↻ 한 번 더'][step];target.classList.toggle('hidden',step===2);target.style.left=step===0?'257px':'223px';target.style.top=step===0?'118px':'428px';}function next(){step=(step+1)%3;render()}$('go').addEventListener('click',next);target.addEventListener('click',next);$('reset').addEventListener('click',()=>{step=0;render()});window.addEventListener('resize',resize);resize();render();})();
</script></body></html>
