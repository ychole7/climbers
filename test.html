<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#603a26}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:#5e4b3e}
.app{max-width:480px;margin:auto;height:100dvh;min-height:590px;position:relative;overflow:hidden;background:#c88c5a url('assets/scenery/gym-art.webp') center/cover}
.app:before{content:'';position:absolute;inset:0;background:linear-gradient(#5f34232b,#e8bb7c16 50%,#6a422775);pointer-events:none}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:3%;right:3%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;z-index:10}.hud section{min-width:0;background:#fff1daf5;border:2px solid #fffbef;border-bottom:5px solid #dab289;border-radius:17px;text-align:center;padding:8px 1px;box-shadow:0 4px 10px #4d271a40}.hud small{display:block;font-size:clamp(9px,2.8vw,12px);font-weight:800}.hud b{color:#aa641e;font-size:clamp(14px,4.6vw,22px);white-space:nowrap}
.wall{position:absolute;top:clamp(108px,18%,160px);bottom:clamp(153px,21%,210px);left:4%;right:4%;background:linear-gradient(130deg,#f9e8d7 0 42%,#f3ded4 42% 72%,#e1d8e6 72%);border:10px solid #c29368;border-radius:24px;box-shadow:0 8px 22px #42251b55;overflow:hidden}.wall:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#957d7159 1.35px,transparent 1.75px);background-size:25px 25px;pointer-events:none}.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(36deg,transparent 43%,#d8b9a477 43.2%,transparent 43.5%),linear-gradient(144deg,transparent 52%,#d8b9a477 52.2%,transparent 52.5%);pointer-events:none}.stage-frame{position:absolute;inset:0;overflow:hidden}.scene{position:absolute;left:50%;top:50%;width:360px;height:520px;transform:translate(-50%,-50%) scale(1);transform-origin:center}
.hold{position:absolute;border-radius:38% 58% 43% 46%;transform:translate(-50%,-50%) rotate(-12deg);box-shadow:inset -6px -8px 7px #0002,inset 3px 4px 7px #fff7,0 7px 5px #5c342344;z-index:1}.hold:after{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);background:#414146;border:3px solid #88858b;border-radius:50%}.yellow{background:#f6bb21}.blue{background:#358ad6}.pink{background:#f36e8c}.green{background:#4ab7a1}.purple{background:#ad79de}.grey{background:#a69a97}
/* 기존 곰돌이 PNG를 런타임에 관절 파츠로 마스킹해 회전시킨다. */
.bear-skin{position:absolute;inset:0;width:360px;height:520px;z-index:4;pointer-events:none;filter:drop-shadow(0 4px 3px #42251b20)}
.grip-dot{position:absolute;z-index:7;width:10px;height:10px;background:#ffed9a;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 5px #784b23aa;opacity:0;transition:opacity .15s}.grip-dot.show{opacity:1}
.pull-arrow{position:absolute;left:150px;top:280px;transform:translate(-50%,0);z-index:7;color:#fff9cb;background:#704b37cc;padding:4px 10px;border-radius:20px;font-size:20px;opacity:0;pointer-events:none}
.target{position:absolute;z-index:6;width:74px;height:74px;border:3px dashed #fff9dc;border-radius:50%;box-shadow:0 0 0 5px #f1bb4690,0 0 17px #ffdc54;transform:translate(-50%,-50%);background:#ffe36933;cursor:pointer;touch-action:manipulation;animation:pulse 1.3s infinite}.target.hidden{display:none}@keyframes pulse{50%{box-shadow:0 0 0 10px #eabb4650,0 0 22px #ffdc54}}.cue{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#fff7e9ed;border-radius:18px;font-size:12px;white-space:nowrap;font-weight:800;z-index:7}.contact{position:absolute;width:12px;height:12px;border-radius:50%;z-index:4;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff9e7b0;background:#79bd9c;opacity:0;transition:opacity .2s}.contact.visible{opacity:1}
.footer{position:absolute;bottom:0;left:0;right:0;padding:12px 3% calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#bc815c 15%,#bf8762);z-index:9}.status{border-radius:25px;background:#fff5e3;border:2px solid white;text-align:center;font-weight:800;padding:13px 5px;font-size:clamp(12px,3.5vw,15px);margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:2px solid #fff7e9;border-radius:18px;background:#fff0d9;font-weight:900;color:#76452b;padding:14px 0;font-size:16px;box-shadow:0 5px 0 #795d4b45;cursor:pointer}.actions button.main{background:#54b99c;color:white}.actions button:disabled{opacity:.6}.small{text-align:center;color:#fff8e8;font-size:10px;font-weight:700;margin:12px 0 0;text-shadow:0 1px 4px #60392e}@media(max-height:720px){.wall{top:105px;bottom:154px}.footer{padding-top:8px}.small{margin-top:8px}.actions button{padding:9px 0}}@media(prefers-reduced-motion:reduce){.target,.contact{transition:none;animation:none}}
</style>
<script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=57677"></script>
</head><body>
<main class="app"><header class="hud"><section><small>STAGE 01</small><b>🐾 연습</b></section><section><small>이동 횟수</small><b id="count">0 / 1</b></section><section><small>곰돌이 미션</small><b id="mission">매달림</b></section></header>
<section class="wall" id="wall" aria-label="홀드와 벽이 고정된 클라이밍 벽"><div class="stage-frame"><div class="scene" id="scene">
<div class="hold blue" style="left:108px;top:175px;width:64px;height:52px"></div>
<div class="hold yellow" style="left:218px;top:173px;width:65px;height:52px"></div>
<div class="hold yellow" style="left:252px;top:112px;width:65px;height:52px"></div>
<div class="hold green" style="left:270px;top:401px;width:68px;height:48px"></div>
<div class="hold purple" style="left:108px;top:440px;width:59px;height:49px"></div>
<div class="hold pink" style="left:290px;top:262px;width:60px;height:48px"></div>
<div class="hold grey" style="left:76px;top:94px;width:37px;height:32px"></div>
<div class="hold purple" style="left:290px;top:46px;width:51px;height:45px"></div>
<div class="hold yellow" style="left:64px;top:366px;width:56px;height:43px"></div>
<canvas id="bearCanvas" class="bear-skin" width="720" height="1040" role="img" aria-label="양손으로 홀드를 잡고 체중을 실어 올라가는 곰돌이"></canvas>
<img id="bearSource" src="assets/characters/bear/poses/bear_pose_01.png" alt="" hidden crossorigin="anonymous">
<span class="grip-dot" id="gripL" style="left:108px;top:173px"></span><span class="grip-dot" id="gripR" style="left:218px;top:173px"></span>
<span class="pull-arrow" id="pullArrow">↑ 영차!</span>
<div id="cue" class="cue">양손을 잡고 몸을 끌어올려!</div>
</div></div></section>
<footer class="footer"><p class="status" id="status" role="status">양손을 고정하고 체중을 옮기고 발로 밀어 올라가 봐!</p><div class="actions"><button id="reset" type="button">↻ 다시하기</button><button id="go" class="main" type="button">💪 몸 끌어올리기</button></div><p class="small">고정 벽 · PNG 파츠 리깅 · 발 밀기 / 팔꿈치 굽힘</p></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const wall=$('wall'),scene=$('scene'),source=$('bearSource'),canvas=$('bearCanvas');
const ctx=canvas.getContext('2d'),go=$('go'),resetButton=$('reset');
const arrow=$('pullArrow'),cue=$('cue'),status=$('status'),gripL=$('gripL'),gripR=$('gripR');
const clamp=v=>Math.max(0,Math.min(1,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const phase=(t,a,b)=>ease((t-a)/(b-a));
const mix=(a,b,t)=>a+(b-a)*t;
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let ready=false,busy=false,done=false,token=0,progress=0,lastStamp=0;
const BASE=V(22,155); // 기존 장면과 동일한 원본 300×360 PNG 배치
// 실제 PNG의 손끝, 어깨, 엉덩이, 무릎, 발바닥 좌표를 이용한다.
const art={
 shoulderL:V(113,124),elbowL:V(85,72),handL:V(86,18),
 shoulderR:V(191,124),elbowR:V(201,70),handR:V(196,18),
 hipL:V(124,235),kneeL:V(101,273),footL:V(99,319),
 hipR:V(180,235),kneeR:V(218,277),footR:V(215,328)
};
const globalPoint=p=>add(p,BASE);
const partMasks={};
// 원본을 관절별로 따로 마스킹한다. 새 PNG나 외부 라이브러리는 필요하지 않다.
function masked(name,draw){
 const c=document.createElement('canvas');c.width=300;c.height=360;
 const g=c.getContext('2d');g.beginPath();draw(g);g.clip();g.drawImage(source,0,0,300,360);
 partMasks[name]=c;
}
function capsule(g,a,b,r1,r2){
 const theta=Math.atan2(b.y-a.y,b.x-a.x),nx=-Math.sin(theta),ny=Math.cos(theta),ux=Math.cos(theta),uy=Math.sin(theta);
 g.moveTo(a.x+nx*r1,a.y+ny*r1);
 g.lineTo(b.x+nx*r2,b.y+ny*r2);
 g.quadraticCurveTo(b.x+ux*r2*1.5,b.y+uy*r2*1.5,b.x-nx*r2,b.y-ny*r2);
 g.lineTo(a.x-nx*r1,a.y-ny*r1);
 g.quadraticCurveTo(a.x-ux*r1*1.5,a.y-uy*r1*1.5,a.x+nx*r1,a.y+ny*r1);
 g.closePath();
}
function initParts(){
 masked('body',g=>{g.moveTo(109,96);g.bezierCurveTo(91,116,96,153,95,182);g.lineTo(102,229);g.quadraticCurveTo(110,258,152,263);g.quadraticCurveTo(199,258,209,224);g.lineTo(211,166);g.quadraticCurveTo(212,114,191,96);g.closePath();});
 masked('head',g=>{g.ellipse(153,114,63,66,0,0,Math.PI*2);});
 for(const side of ['L','R']){
  masked('upperArm'+side,g=>capsule(g,art['shoulder'+side],art['elbow'+side],24,20));
  masked('lowerArm'+side,g=>capsule(g,art['elbow'+side],art['hand'+side],21,18));
  masked('thigh'+side,g=>capsule(g,art['hip'+side],art['knee'+side],27,24));
  masked('calf'+side,g=>capsule(g,art['knee'+side],art['foot'+side],24,20));
 }
 // 손바닥과 발바닥은 고정된 접점에 별도로 그려 마찰감을 유지한다.
 for(const side of ['L','R']){
  masked('paw'+side,g=>{const p=art['hand'+side];g.ellipse(p.x,p.y,23,26,0,0,Math.PI*2);});
  masked('sole'+side,g=>{const p=art['foot'+side];g.ellipse(p.x,p.y,26,28,0,0,Math.PI*2);});
 }
}
// 고정점 둘 사이의 두 관절 뼈가 풀 수 있는 원의 교차점을 계산한다.
function bend(a,b,l1,l2,preferred){
 const d0=dist(a,b),d=Math.max(.01,Math.min(d0,l1+l2-.005));
 const ux=(b.x-a.x)/Math.max(.01,d0),uy=(b.y-a.y)/Math.max(.01,d0);
 const along=(l1*l1-l2*l2+d*d)/(2*d),height=Math.sqrt(Math.max(0,l1*l1-along*along));
 const c1=V(a.x+ux*along-uy*height,a.y+uy*along+ux*height);
 const c2=V(a.x+ux*along+uy*height,a.y+uy*along-ux*height);
 return dist(c1,preferred)<dist(c2,preferred)?c1:c2;
}
function drawRigid(name,fromSrc,toSrc,fromDest,toDest){
 const dx=toSrc.x-fromSrc.x,dy=toSrc.y-fromSrc.y;
 const targetX=toDest.x-fromDest.x,targetY=toDest.y-fromDest.y;
 const srcAngle=Math.atan2(dy,dx),dstAngle=Math.atan2(targetY,targetX);
 const scale=Math.min(1.16,Math.max(.86,Math.hypot(targetX,targetY)/Math.max(1,Math.hypot(dx,dy))));
 ctx.save();ctx.translate(fromDest.x,fromDest.y);ctx.rotate(dstAngle-srcAngle);
 ctx.translate(-fromSrc.x,-fromSrc.y);
 // 각 파츠는 회전과 소폭의 길이 보정만 적용해 전신 고무 변형을 방지한다.
 if(Math.abs(scale-1)>.001){ctx.translate(fromSrc.x,fromSrc.y);ctx.rotate(srcAngle);ctx.scale(scale,1);ctx.rotate(-srcAngle);ctx.translate(-fromSrc.x,-fromSrc.y);}
 ctx.drawImage(partMasks[name],0,0);ctx.restore();
}
function drawBodyPart(name,destCenter,sourceCenter,rotation=0){
 ctx.save();ctx.translate(destCenter.x,destCenter.y);ctx.rotate(rotation);ctx.drawImage(partMasks[name],-sourceCenter.x,-sourceCenter.y);ctx.restore();
}
function drawAt(name,src,dst){ctx.drawImage(partMasks[name],dst.x-src.x,dst.y-src.y);}
function render(t){
 progress=t;ctx.clearRect(0,0,360,520);if(!ready)return;
 const brace=phase(t,0,.22),push=phase(t,.21,.81),settle=phase(t,.80,1);
 const lift=44*push-2*settle;
 const sway=-7*brace+5*push+2*settle;
 const bodyOffset=V(sway,-lift);
 const shoulderL=add(globalPoint(art.shoulderL),bodyOffset);
 const shoulderR=add(globalPoint(art.shoulderR),bodyOffset);
 const hipL=add(globalPoint(art.hipL),bodyOffset);
 const hipR=add(globalPoint(art.hipR),bodyOffset);
 const hands=[globalPoint(art.handL),globalPoint(art.handR)];
 const feet=[globalPoint(art.footL),globalPoint(art.footR)];
 // 팔꿈치는 손 고정 + 상승한 어깨 위치를 만족하며 안쪽으로 굽힌다.
 const elbowL=bend(shoulderL,hands[0],62,58,add(globalPoint(art.elbowL),V(18*push,-13*push)));
 const elbowR=bend(shoulderR,hands[1],62,58,add(globalPoint(art.elbowR),V(-18*push,-13*push)));
 // 발은 약간 밀어주되 홀드에 고정; 무릎은 골반 움직임을 따라 편다.
 const kneeL=bend(hipL,feet[0],69,62,add(globalPoint(art.kneeL),V(-10*push,-10*push)));
 const kneeR=bend(hipR,feet[1],69,62,add(globalPoint(art.kneeR),V(10*push,-10*push)));
 // 뒤쪽 팔·다리부터 그리고, 몸통/머리로 연결 이음새를 덮는다.
 for(const [side,shoulder,elbow,hand,hip,knee,foot] of [
  ['L',shoulderL,elbowL,hands[0],hipL,kneeL,feet[0]],
  ['R',shoulderR,elbowR,hands[1],hipR,kneeR,feet[1]]]){
  drawRigid('calf'+side,art['knee'+side],art['foot'+side],knee,foot);
  drawRigid('thigh'+side,art['hip'+side],art['knee'+side],hip,knee);
  drawRigid('lowerArm'+side,art['elbow'+side],art['hand'+side],elbow,hand);
  drawRigid('upperArm'+side,art['shoulder'+side],art['elbow'+side],shoulder,elbow);
 }
 drawBodyPart('body',add(globalPoint(V(151,187)),bodyOffset),V(151,187),sway*.0019);
 drawBodyPart('head',add(globalPoint(V(153,114)),add(bodyOffset,V(0,-3*push))),V(153,114),-.027*brace+.035*push);
 for(const side of ['L','R']){
  drawAt('paw'+side,art['hand'+side],globalPoint(art['hand'+side]));
  drawAt('sole'+side,art['foot'+side],globalPoint(art['foot'+side]));
 }
 arrow.style.opacity=(t>.25&&t<.85)?String(Math.min(1,(t-.25)*8,(.85-t)*9)):'0';
 arrow.style.transform=`translate(-50%,${-lift}px)`;
 gripL.classList.toggle('show',t>.03);gripR.classList.toggle('show',t>.03);
}
function resize(){
 const scale=Math.min(1,(wall.clientWidth-20)/360,(wall.clientHeight-20)/520);
 scene.style.transform=`translate(-50%,-50%) scale(${scale})`;
 const ratio=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(360*ratio);canvas.height=Math.round(520*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);render(progress);
}
function labels(){
 $('count').textContent=done?'1 / 1':'0 / 1';
 $('mission').textContent=done?'동작 완료!':'매달림';
 go.textContent=done?'↻ 한 번 더':'💪 영차! 올라가기';
 status.textContent=done?'팔꿈치와 무릎 굽힘 확인! 올라간 위치를 유지하고 있어.':'체중 이동 → 발로 밀기 → 팔꿈치 굽힘 → 가슴 상승';
 cue.textContent=done?'1초 등반 동작 완료!':'양손 고정, 관절이 실제로 움직이는지 확인';
}
function reset(){token++;busy=false;done=false;go.disabled=false;progress=0;render(0);labels();}
function start(){
 if(!ready){status.textContent='곰돌이 이미지 로딩 중이야.';return;}
 if(busy)return;if(done){reset();return;}
 busy=true;go.disabled=true;const own=++token,duration=1150;
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduced){render(1);busy=false;done=true;go.disabled=false;labels();return;}
 lastStamp=0;
 function tick(time){
  if(own!==token)return;
  if(!lastStamp)lastStamp=time;
  const t=clamp((time-lastStamp)/duration);
  render(t);
  if(t<1)requestAnimationFrame(tick);
  else{busy=false;done=true;go.disabled=false;labels();}
 }
 requestAnimationFrame(tick);
}
source.addEventListener('load',()=>{ready=true;initParts();resize();reset();});
source.addEventListener('error',()=>{status.textContent='기존 곰돌이 PNG를 불러오지 못했어. assets 경로를 확인해 줘.';go.disabled=true;});
$('reset').addEventListener('click',reset);go.addEventListener('click',start);
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&busy)reset();});
resize();labels();if(source.complete&&source.naturalWidth){ready=true;initParts();resize();reset();}
})();
</script></body></html>
