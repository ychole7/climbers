<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영차영차 등반대 · 통짜 포즈 접점 정렬 테스트</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#603a26}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{background:#5e4b3e}
.app{max-width:480px;margin:auto;height:100dvh;min-height:590px;position:relative;overflow:hidden;background:#c88c5a url('assets/scenery/gym-art.webp') center/cover}
.app:before{content:'';position:absolute;inset:0;background:linear-gradient(#5f34232b,#e8bb7c16 50%,#6a422775);pointer-events:none}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:3%;right:3%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;z-index:10}.hud section{min-width:0;background:#fff1daf5;border:2px solid #fffbef;border-bottom:5px solid #dab289;border-radius:17px;text-align:center;padding:8px 1px;box-shadow:0 4px 10px #4d271a40}.hud small{display:block;font-size:clamp(9px,2.8vw,12px);font-weight:800}.hud b{color:#aa641e;font-size:clamp(14px,4.6vw,22px);white-space:nowrap}
.wall{position:absolute;top:clamp(108px,18%,160px);bottom:clamp(153px,21%,210px);left:4%;right:4%;background:linear-gradient(130deg,#f9e8d7 0 42%,#f3ded4 42% 72%,#e1d8e6 72%);border:10px solid #c29368;border-radius:24px;box-shadow:0 8px 22px #42251b55;overflow:hidden}.wall:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#957d7159 1.35px,transparent 1.75px);background-size:25px 25px;pointer-events:none}.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(36deg,transparent 43%,#d8b9a477 43.2%,transparent 43.5%),linear-gradient(144deg,transparent 52%,#d8b9a477 52.2%,transparent 52.5%);pointer-events:none}.stage-frame{position:absolute;inset:0;overflow:hidden}.scene{position:absolute;left:50%;top:50%;width:360px;height:520px;transform:translate(-50%,-50%) scale(1);transform-origin:center}
.hold{position:absolute;border-radius:38% 58% 43% 46%;transform:translate(-50%,-50%) rotate(-12deg);box-shadow:inset -6px -8px 7px #0002,inset 3px 4px 7px #fff7,0 7px 5px #5c342344;z-index:1}.hold:after{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);background:#414146;border:3px solid #88858b;border-radius:50%}.yellow{background:#f6bb21}.blue{background:#358ad6}.pink{background:#f36e8c}.green{background:#4ab7a1}.purple{background:#ad79de}.grey{background:#a69a97}
/* 포즈의 PNG 비율과 크기를 유지하고, JS가 몸통 기준 이동 및 교차 전환을 제어한다. */
.pose{position:absolute;display:block;opacity:0;z-index:3;pointer-events:none;object-fit:contain;filter:drop-shadow(0 5px 4px #5a312d45);will-change:left,top,opacity,transform;transition:none;transform:translate3d(0,0,0)}.pose.on{opacity:1}.pose.moving{z-index:5}
.target{position:absolute;z-index:6;width:74px;height:74px;border:3px dashed #fff9dc;border-radius:50%;box-shadow:0 0 0 5px #f1bb4690,0 0 17px #ffdc54;transform:translate(-50%,-50%);background:#ffe36933;cursor:pointer;touch-action:manipulation;animation:pulse 1.3s infinite}.target.hidden{display:none}@keyframes pulse{50%{box-shadow:0 0 0 10px #eabb4650,0 0 22px #ffdc54}}.cue{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#fff7e9ed;border-radius:18px;font-size:12px;white-space:nowrap;font-weight:800;z-index:7}.contact{position:absolute;width:12px;height:12px;border-radius:50%;z-index:4;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff9e7b0;background:#79bd9c;opacity:0;transition:opacity .2s}.contact.visible{opacity:1}
.footer{position:absolute;bottom:0;left:0;right:0;padding:12px 3% calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#bc815c 15%,#bf8762);z-index:9}.status{border-radius:25px;background:#fff5e3;border:2px solid white;text-align:center;font-weight:800;padding:13px 5px;font-size:clamp(12px,3.5vw,15px);margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{border:2px solid #fff7e9;border-radius:18px;background:#fff0d9;font-weight:900;color:#76452b;padding:14px 0;font-size:16px;box-shadow:0 5px 0 #795d4b45;cursor:pointer}.actions button.main{background:#54b99c;color:white}.actions button:disabled{opacity:.6}.small{text-align:center;color:#fff8e8;font-size:10px;font-weight:700;margin:12px 0 0;text-shadow:0 1px 4px #60392e}@media(max-height:720px){.wall{top:105px;bottom:154px}.footer{padding-top:8px}.small{margin-top:8px}.actions button{padding:9px 0}}@media(prefers-reduced-motion:reduce){.target,.contact{transition:none;animation:none}}
</style>
<script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=50381"></script>
</head><body>
<main class="app"><header class="hud"><section><small>STAGE 01</small><b>🐾 연습</b></section><section><small>이동 횟수</small><b id="count">0 / 2</b></section><section><small>곰돌이 미션</small><b id="mission">준비!</b></section></header>
<section class="wall" id="wall" aria-label="홀드와 벽이 고정된 클라이밍 벽"><div class="stage-frame"><div class="scene" id="scene">
<div class="hold blue" style="left:108px;top:175px;width:64px;height:52px"></div>
<div class="hold yellow" style="left:218px;top:173px;width:65px;height:52px"></div>
<div class="hold yellow" style="left:252px;top:112px;width:65px;height:52px"></div>
<div class="hold green" style="left:270px;top:401px;width:68px;height:48px"></div>
<div class="hold purple" style="left:108px;top:440px;width:59px;height:49px"></div>
<div class="hold pink" style="left:290px;top:262px;width:60px;height:48px"></div>
<div class="hold grey" style="left:76px;top:94px;width:37px;height:32px"></div>
<div class="hold purple" style="left:290px;top:46px;width:51px;height:45px"></div>
<div class="hold yellow" style="left:64px;top:366px;width:56px;height:43px"></div>
<img class="pose on" id="p0" width="300" height="360" src="assets/characters/bear/poses/bear_pose_01.png" alt="양손으로 매달리는 곰돌이" draggable="false">
<img class="pose" id="p1" width="310" height="382" src="assets/characters/bear/poses/bear_pose_02.png" alt="오른손을 뻗은 곰돌이" draggable="false">
<img class="pose" id="p2" width="310" height="375" src="assets/characters/bear/poses/bear_pose_03.png" alt="발을 올린 곰돌이" draggable="false">
<span class="contact" id="contact" aria-hidden="true"></span><button id="target" class="target" style="left:252px;top:112px" aria-label="위쪽 노란 홀드 잡기"></button><div id="cue" class="cue">위쪽 노란 홀드를 눌러 봐!</div>
</div></div></section>
<footer class="footer"><p class="status" id="status" role="status">오른손을 위쪽 노란 홀드로 옮겨 봐!</p><div class="actions"><button id="reset" type="button">↻ 다시하기</button><button id="go" class="main" type="button">✋ 손 뻗기</button></div><p class="small">고정된 벽 · 손 뻗기 → 접점 고정 → 몸통 당기기 · 기존 PNG 유지</p></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),wall=$('wall');
const sprites=[$('p0'),$('p1'),$('p2')],target=$('target'),go=$('go'),contact=$('contact');
// 각 PNG의 손발 접점(anchor)은 원본 이미지에 맞춰 유지한다.
// body는 이미지 내부의 몸통 중심 추정 좌표. 이 좌표는 애니메이션 연결에만 쓰인다.
// 필요할 경우 body 값만 미세 조정하고, 홀드 좌표나 PNG 자체는 수정하지 않는다.
const poses=[
 {x:22,y:155,anchor:{x:196,y:18},activeHold:{x:218,y:173},body:{x:150,y:200},w:300,h:360},
 {anchor:{x:230,y:12},activeHold:{x:252,y:112},body:{x:155,y:207},w:310,h:382},
 {anchor:{x:265,y:316},activeHold:{x:270,y:401},body:{x:155,y:203},w:310,h:375}
];
for(let i=1;i<poses.length;i++){const p=poses[i];p.x=p.activeHold.x-p.anchor.x;p.y=p.activeHold.y-p.anchor.y;}
const prefersReduced=matchMedia('(prefers-reduced-motion: reduce)');
const durations=[920,760];
// 원본 PNG의 홀드 접점을 축으로 약하게 압축해 손 고정 상태의 당기는 힘을 표현한다.
const gripScales=[1,.947,1.035];
let step=0,busy=false,motionId=0,frameId=0;
function resize(){const w=wall.clientWidth-20,h=wall.clientHeight-20,scale=Math.min(1,w/360,h/520);scene.style.transform=`translate(-50%,-50%) scale(${scale})`;}
function put(img,x,y){img.style.left=`${x}px`;img.style.top=`${y}px`;}
function paintStill(){sprites.forEach((s,i)=>{s.classList.remove('moving');s.classList.toggle('on',i===step);put(s,poses[i].x,poses[i].y);s.style.opacity=i===step?'1':'0';s.style.transformOrigin=`${poses[i].anchor.x}px ${poses[i].anchor.y}px`;s.style.transform=`scaleY(${gripScales[i]})`;});}
function render(){
 $('count').textContent=`${step} / 2`;$('mission').textContent=['준비!','영차!','성공!'][step];
 $('status').textContent=['오른손을 위쪽 노란 홀드로 옮겨 봐!','좋아! 이번엔 오른발을 초록 홀드에 올려 봐!','완료! 손발 접점에 맞춰 두 동작을 연결했어.'][step];
 $('cue').textContent=['위쪽 노란 홀드를 눌러 봐!','아래쪽 초록 홀드를 눌러 봐!','성공! 🎉'][step];
 go.textContent=['✋ 손 뻗기','👣 발 올리기','↻ 한 번 더'][step];
 target.classList.toggle('hidden',step===2);if(step<2){const t=poses[step+1].activeHold;target.style.left=`${t.x}px`;target.style.top=`${t.y}px`;target.setAttribute('aria-label',step===0?'노란 홀드 잡기':'초록 홀드 밟기');}
 contact.classList.toggle('visible',step>0);if(step>0){const t=poses[step].activeHold;contact.style.left=`${t.x}px`;contact.style.top=`${t.y}px`;}
}
function ease(t){return 1-Math.pow(1-t,3);}
function finish(id,newStep){if(id!==motionId)return;cancelAnimationFrame(frameId);step=newStep;busy=false;go.disabled=false;target.disabled=false;paintStill();render();}
function next(){
 if(busy)return;if(step===2){reset();return;}
 busy=true;go.disabled=true;target.disabled=true;target.classList.add('hidden');
 const id=++motionId,newStep=step+1,old=sprites[step],fresh=sprites[newStep],a=poses[step],b=poses[newStep];
 const duration=durations[step],clamp=v=>Math.max(0,Math.min(1,v));
 // 이전 자세의 실제 몸통 중심(접점 고정 압축 후)을 읽어 새 포즈의 등장 위치를 정한다.
 const bodyOf=p=>({x:p.x+p.body.x,y:p.y+p.anchor.y+(p.body.y-p.anchor.y)*gripScales[step]});
 const oldBody=bodyOf(a),targetBody={x:b.x+b.body.x,y:b.y+b.body.y};
 const entry={x:oldBody.x-b.body.x,y:oldBody.y-b.body.y};
 // 준비 -> 손 뻗어 잡기 -> 접점 고정 후 당기기 -> 다음 정지 자세.
 old.classList.add('moving');fresh.classList.add('moving');fresh.classList.remove('on');
 old.style.transformOrigin=`${a.anchor.x}px ${a.anchor.y}px`;
 fresh.style.transformOrigin=`${b.anchor.x}px ${b.anchor.y}px`;
 put(old,a.x,a.y);put(fresh,entry.x,entry.y);
 old.style.opacity='1';fresh.style.opacity='0';
 fresh.style.transform='scaleY(1)';
 if(prefersReduced.matches){finish(id,newStep);return;}
 const startAt=performance.now();let phase=-1;
 function tick(now){
  if(id!==motionId)return;
  const t=clamp((now-startAt)/duration);
  // 첫 16%는 자세를 유지하며 준비한다. 벽과 기존 접점은 이동하지 않는다.
  const ready=ease(clamp(t/.16));
  const breathing=2.2*Math.sin(Math.PI*ready);
  old.style.transform=`scaleY(${gripScales[step]-(breathing/300)})`;
  // 18~57%: 새로운 자세가 기존 몸통 위치에서 나타나며 새 손/발을 목표 홀드로 보낸다.
  const reach=ease(clamp((t-.18)/.39));
  put(fresh,entry.x+(b.x-entry.x)*reach,entry.y+(b.y-entry.y)*reach);
  const swap=ease(clamp((t-.19)/.16));
  old.style.opacity=String(1-swap);fresh.style.opacity=String(swap);
  // 57~94%: 접점 좌표를 고정하고 이미지의 세로 크기를 아주 조금만 바꿔 몸통을 당긴다.
  // transform-origin을 접점에 놓으므로 해당 손/발은 홀드에서 움직이지 않는다.
  const pull=ease(clamp((t-.57)/.37));
  const scale=1+(gripScales[newStep]-1)*pull;
  fresh.style.transform=`scaleY(${scale})`;
  const nextPhase=t<.18?0:t<.57?1:t<.94?2:3;
  if(nextPhase!==phase){phase=nextPhase;
   $('status').textContent=step===0
    ? ['손을 뻗을 준비!','오른손을 노란 홀드로!','홀드를 잡고 영차!','안정적으로 매달렸어!'][phase]
    : ['발을 옮길 준비!','초록 홀드로 오른발을!','발로 밀어 올려!','자세를 잡았어!'][phase];
  }
  if(t<1)frameId=requestAnimationFrame(tick);else finish(id,newStep);
 }
 frameId=requestAnimationFrame(tick);
}
function reset(){motionId++;cancelAnimationFrame(frameId);busy=false;go.disabled=false;target.disabled=false;step=0;paintStill();render();}
go.addEventListener('click',next);target.addEventListener('click',next);$('reset').addEventListener('click',reset);
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&busy)reset();});
resize();reset();
})();
</script></body></html>
