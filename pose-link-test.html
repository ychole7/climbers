*{box-sizing:border-box}body{margin:0;background:#f3dfbd;color:#57341f;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;overflow:hidden;touch-action:none}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#f9e8cc;box-shadow:0 0 50px #704b3a44}.top{z-index:3;display:flex;align-items:center;gap:8px;padding:10px 10px 8px;background:#f4d4a9;border-bottom:3px solid #ad7952}.pill{flex:1;border-radius:15px;background:#fff7e8;padding:9px 11px;font-size:13px;font-weight:850;border:2px solid #dec4a5;box-shadow:0 3px #ba9774}.pill small{font-size:10px;color:#967659}.stage{flex:1;position:relative;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.footer{z-index:2;padding:9px 12px 13px;background:#f5dfb9;border-top:3px solid #d0a772}.message{font-size:13px;font-weight:800;background:#fffaf0;border-radius:12px;padding:10px;min-height:39px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1;border:2px solid #d3a881;border-radius:13px;background:#fff7e7;color:#65402c;font-weight:900;padding:11px 5px;font-size:13px}.actions button.primary{background:#ffe39a}.hint{font-size:11px;color:#946d51;margin-top:8px;text-align:center}</style></head><body><div class="app"><div class="top"><div class="pill">🐻 코스 1<br><small>숨은 발판 · 포즈 연결</small></div><div class="pill" id="moves">🐾 0수</div><div class="pill" id="honey">🍯 0/1</div></div><div class="stage"><canvas id="cv"></canvas></div><div class="footer"><div class="message" id="msg">손이나 발을 끌어서 다음 홀드에 놓아봐!</div><div class="actions"><button id="undo">↶ 되돌리기</button><button id="hint" class="primary">💡 힌트</button><button id="restart">⟳ 처음부터</button></div><div class="hint">기존 reach-core.js 판정 사용 · 포즈 전환 전용 실험</div></div></div><script src="pose-link-test-core.js"></script><script>
(()=>{'use strict';const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),stage=STAGES[0];const $=s=>document.querySelector(s);const contacts0=stage.start.slice();let contacts=contacts0.slice(),history=[],moves=0,honey=new Set(),drag=-1,dragP=null,hoverHold=null,hintMove=null,poseTarget=pose(stage,contacts),displayTorso={...poseTarget.torso},cameraY=1020,keys={},limbs=[],time=0,win=false;const SCENE_W=700;const nHands=2;
const chosen=['#f4a844','#e79539','#76a3c5','#6f98c1'];
const msg=s=>{$('#msg').textContent=s};
function resize(){const dpr=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function trans(){const w=cv.clientWidth,h=cv.clientHeight,scale=w/SCENE_W;return {w,h,s:scale,oy:h*.58-cameraY*scale}}function posWorld(x,y){let t=trans();return {x:x*t.s,y:y*t.s+t.oy}}function worldPos(x,y){let t=trans();return {x:x/t.s,y:(y-t.oy)/t.s}}
function rounded(x,y,w,h,r,fill,stroke,line=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function circle(x,y,r,fill,stroke='',lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function capsule(a,b,width,fill,edge){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=width+2.5;ctx.strokeStyle=edge;ctx.stroke();ctx.lineWidth=width;ctx.strokeStyle=fill;ctx.stroke()}
function getHold(id){return holdOf(stage,id)}function getPoint(i){if(drag===i&&dragP)return dragP;return getHold(contacts[i])}function getEnd(i){let h=getPoint(i);return {x:h.x,y:h.y}}
function solveJoint(a,b,L,i){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;let clamped=Math.max(.1,Math.min(d,2*L-1));let mx=(a.x+b.x)/2,my=(a.y+b.y)/2,hh=Math.sqrt(Math.max(0,L*L-clamped*clamped/4));let px=-dy/d,py=dx/d;let candidates=[{x:mx+px*hh,y:my+py*hh},{x:mx-px*hh,y:my-py*hh}];let side= i===0?-1:i===1?1:i===2?-1:1;const anchorX=displayTorso.x;let desired={x:mx+side*hh*.7,y:my+(i<2?0:hh*.25)};let prev=limbs[i]?.joint;
// Prefer a natural outward elbow/knee, keep prior bend side only when similarly plausible.
const score=c=>Math.hypot(c.x-desired.x,c.y-desired.y)+(prev?Math.hypot(c.x-prev.x,c.y-prev.y)*.12:0);
let best=candidates.sort((x,y)=>score(x)-score(y))[0];if(d>2*L){best={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}return best}
function fitBody(){const target=pose(stage,contacts,drag,dragP);if(target.ok){poseTarget=target;displayTorso.x+=(target.torso.x-displayTorso.x)*.18;displayTorso.y+=(target.torso.y-displayTorso.y)*.18}cameraY+=(displayTorso.y-90-cameraY)*.045}
function drawWall(){let t=trans();ctx.fillStyle='#f7e8c8';ctx.fillRect(0,0,t.w,t.h);let polys=[[[0,-350],[360,-280],[270,200],[0,90]],[[360,-280],[700,-300],[700,280],[270,200]],[[0,90],[270,200],[450,700],[0,620]],[[270,200],[700,280],[700,860],[450,700]],[[0,620],[450,700],[240,1450],[0,1450]],[[450,700],[700,860],[700,1450],[240,1450]]],colors=['#d7e6d4','#f1d7b9','#e5d2d4','#c8dfdd','#e9dfc1','#e5d6b9'];polys.forEach((poly,j)=>{ctx.beginPath();poly.forEach(([x,y],k)=>{let p=posWorld(x,y);k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.fillStyle=colors[j];ctx.fill()});for(let y=130;y<1550;y+=78)for(let x=40;x<700;x+=83){let p=posWorld(x+Math.sin(y*.14+x)*15,y+Math.sin(x*.2)*14);circle(p.x,p.y,1.6,'#bea689')}ctx.fillStyle='#967d60';ctx.font='bold 12px system-ui';for(let yy=300;yy<1450;yy+=300){let p=posWorld(0,yy);ctx.fillText(Math.round((1500-yy)/300)+'m',5,p.y)} }
function drawHolds(){const t=trans();let validSet=new Set();if(drag>=0){for(let h of stage.holds){if(canPlace(stage,contacts,drag,h.id).ok)validSet.add(h.id)}} stage.holds.forEach(h=>{let p=posWorld(h.x,h.y);if(p.y< -30||p.y>t.h+30)return;let isFeet=h.type==='chip',r=(isFeet?13:27)*t.s,hover=hoverHold===h.id,valid=validSet.has(h.id),held=contacts.includes(h.id);if(valid){circle(p.x,p.y,r+9,'#c8edcc77');circle(p.x,p.y,r+6,'', '#55a76d',2)}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.12);ctx.shadowColor='#65431f66';ctx.shadowBlur=4;ctx.shadowOffsetY=4;rounded(-r,-r*.44,2*r,r*.88,r*.4,isFeet?'#a3a7a5':h.type==='crimp'?'#df7b80':'#f4ae30','#8e7256',1.5);ctx.restore();if(hover)circle(p.x,p.y,r+8,'','#ffcb4f',4);if(h.honey){ctx.font='18px system-ui';ctx.fillText('🍯',p.x+12,p.y-8)}if(h.id===stage.goal){ctx.font='20px system-ui';ctx.fillText('🏁',p.x+15,p.y-10)}if(hintMove?.id===h.id){circle(p.x,p.y,r+11,'','#fff64a',3)}})}
function drawBear(){let t=trans();ctx.save();ctx.translate(0,t.oy);ctx.scale(t.s,t.s);const c=displayTorso,ends=[0,1,2,3].map(i=>getEnd(i));const shoulders=[0,1,2,3].map(i=>({x:c.x+BEAR.off[i][0],y:c.y+BEAR.off[i][1]}));let J=shoulders.map((a,i)=>solveJoint(a,ends[i],BEAR.len[i]/2,i));limbs=J.map((joint,i)=>({joint}));
// Puffy limbs sit behind the rounded bear torso; short visual caps hide the long skeletal geometry.
for(let i=2;i>=0;i-=2){let j=i;capsule(shoulders[j],J[j],i<2?38:48,'#b8753e','#794725');capsule(J[j],ends[j],i<2?35:42,'#c8874a','#794725')}
for(let i=3;i>=1;i-=2){capsule(shoulders[i],J[i],i<2?38:48,'#b8753e','#794725');capsule(J[i],ends[i],i<2?35:42,'#c8874a','#794725')}
ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.max(-.16,Math.min(.16,(ends[0].x+ends[1].x-2*c.x)/700)));ctx.beginPath();ctx.ellipse(0,6,63,82,0,0,Math.PI*2);ctx.fillStyle='#b97842';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#83512e';ctx.stroke();ctx.beginPath();ctx.ellipse(0,6,40,53,0,0,Math.PI*2);ctx.fillStyle='#eed3a5';ctx.fill();rounded(-62,41,124,23,9,'#2d82c2','#225680',3);rounded(-13,40,26,24,5,'#385a65');ctx.restore();
// head deliberately forward-facing, using a round short-legged teddy silhouette
let hx=c.x,hy=c.y-92+Math.sin(time*.002)*1.6;circle(hx-42,hy-33,21,'#b77842','#754722',3);circle(hx+42,hy-33,21,'#b77842','#754722',3);circle(hx-42,hy-33,10,'#e9c392');circle(hx+42,hy-33,10,'#e9c392');circle(hx,hy,62,'#c1844b','#80502b',4);circle(hx-26,hy+12,11,'#e39a86');circle(hx+26,hy+12,11,'#e39a86');circle(hx-20,hy-3,5,'#29211d');circle(hx+20,hy-3,5,'#29211d');ctx.beginPath();ctx.ellipse(hx,hy+21,22,18,0,0,Math.PI*2);ctx.fillStyle='#f5dfbc';ctx.fill();circle(hx,hy+15,5,'#432a24');ctx.beginPath();ctx.arc(hx,hy+20,7,0,Math.PI);ctx.strokeStyle='#543324';ctx.lineWidth=2.5;ctx.stroke();
for(let i=0;i<4;i++){const e=ends[i];circle(e.x,e.y,i<2?19:22,'#a56539','#744321',3);circle(e.x,e.y+4,i<2?9:11,'#f0c5a0');circle(e.x-8,e.y-9,3,'#f0c5a0');circle(e.x,e.y-12,3,'#f0c5a0');circle(e.x+8,e.y-9,3,'#f0c5a0')}
ctx.restore()}
function draw(){time=performance.now();fitBody();ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);drawWall();drawHolds();drawBear();requestAnimationFrame(draw)}requestAnimationFrame(draw);
function coords(e){let r=cv.getBoundingClientRect();return worldPos(e.clientX-r.left,e.clientY-r.top)}function nearestLimb(p){let idx=-1,best=50;for(let i=0;i<4;i++){let q=getEnd(i),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<best){best=d;idx=i}}return idx}function nearestHold(p,threshold=56){let h=null,d=threshold;for(let q of stage.holds){let dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<d){d=dd;h=q}}return h}
cv.addEventListener('pointerdown',e=>{if(win)return;let p=coords(e);drag=nearestLimb(p);if(drag<0){msg('손이나 발바닥에서 끌기 시작해봐!');return}dragP=p;cv.setPointerCapture(e.pointerId);msg(['왼손','오른손','왼발','오른발'][drag]+'을 옮겨봐! 초록색은 가능한 홀드야.')});cv.addEventListener('pointermove',e=>{if(drag<0)return;dragP=coords(e);let h=nearestHold(dragP);hoverHold=h?.id||null});
function finish(e){if(drag<0)return;let p=coords(e),h=nearestHold(p);if(h){let r=canPlace(stage,contacts,drag,h.id);if(r.ok){history.push({contacts:contacts.slice(),moves,honey:[...honey]});contacts=r.next;moves++;if(h.honey)honey.add(h.id);$('#moves').textContent='🐾 '+moves+'수';$('#honey').textContent='🍯 '+honey.size+'/1';msg('찰싹! '+(['왼손','오른손','왼발','오른발'][drag])+' 성공!');if(isWin(stage,contacts)){win=true;msg('🎉 완등! '+moves+'수 · 다시 하려면 처음부터')}hintMove=null}else msg(r.why==='reach'?'아직 닿지 않아! 발을 먼저 올려볼까?':r.why==='cross'?'몸이 너무 꼬여! 다른 홀드를 잡아봐.':'여기는 지금 잡을 수 없어.')}else msg('홀드 가까이 놓아봐!');drag=-1;dragP=null;hoverHold=null}
cv.addEventListener('pointerup',finish);cv.addEventListener('pointercancel',()=>{drag=-1;dragP=null;hoverHold=null});$('#restart').onclick=()=>{contacts=contacts0.slice();history=[];moves=0;honey.clear();win=false;hintMove=null;poseTarget=pose(stage,contacts);displayTorso={...poseTarget.torso};cameraY=1020;$('#moves').textContent='🐾 0수';$('#honey').textContent='🍯 0/1';msg('손발 하나씩 드래그! 발을 먼저 올려봐.')};$('#undo').onclick=()=>{let h=history.pop();if(!h)return;contacts=h.contacts;moves=h.moves;honey=new Set(h.honey);win=false;$('#moves').textContent='🐾 '+moves+'수';$('#honey').textContent='🍯 '+honey.size+'/1';msg('한 수 되돌렸어.')};$('#hint').onclick=()=>{let r=solve(stage,contacts,[...honey],false);hintMove=r?.path?.[0]||null;msg(hintMove?'💡 '+['왼손','오른손','왼발','오른발'][hintMove.limb]+' → 빛나는 홀드':'현재 상태에서 길이 없어. 되돌려 봐!')};
})();
</script></body></html>
