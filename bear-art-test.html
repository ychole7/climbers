<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>영차영차 등반대 | 시안 곰돌이 첫 적용</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#624028;background:#2f241e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}.app{position:relative;width:min(100vw,460px);height:100dvh;min-height:650px;margin:auto;overflow:hidden;background:#f9e6c8 url('assets/scenery/gym-art.webp') center/cover no-repeat}.app:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#9c693f33,transparent 17%,transparent 85%,#865a4933);pointer-events:none}.top{position:absolute;top:max(env(safe-area-inset-top),12px);left:12px;right:12px;display:flex;gap:8px;z-index:10}.hud{flex:1;background:#fff4dfed;border:2px solid #fff;border-bottom:5px solid #e2ba91;border-radius:20px;box-shadow:0 5px 15px #6b381a26;text-align:center;padding:10px 6px 8px;font-size:11px;font-weight:900}.hud strong{display:block;font-size:23px;color:#a86717;line-height:1.15;margin-top:4px}.hud:first-child{flex:1.3}.wall{position:absolute;left:12%;width:76%;top:19%;height:66%;border:12px solid #c59b73;border-radius:26px 26px 15px 15px;background:radial-gradient(circle at 20% 25%,#eee4d6 0 2px,transparent 2.3px) 0 0/37px 42px,linear-gradient(130deg,#f7eee0,#e7d7c2 55%,#d3bbab);box-shadow:inset 0 0 40px #b9a58a77,8px 12px 18px #754c3b44}.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(40deg,transparent 49.8%,#ae968440 50%,transparent 50.3%),linear-gradient(110deg,transparent 45%,#ae968433 45.3%,transparent 45.6%);pointer-events:none}.hold{position:absolute;width:52px;height:41px;border-radius:48% 42% 47% 38%;transform:rotate(var(--angle,0deg));box-shadow:inset -8px -7px 9px #4a323325,inset 5px 7px 7px #fff8,0 7px 6px #5b403b33;background:var(--c);z-index:1}.hold:after{content:'';position:absolute;left:48%;top:47%;width:9px;height:9px;border:2px solid #66636a;border-radius:50%;background:#332f35;box-shadow:0 1px 2px #fff8}.hold.small{width:31px;height:26px}.hold.star{clip-path:polygon(50% 0%,63% 31%,99% 35%,73% 58%,80% 95%,50% 76%,18% 95%,27% 59%,0 35%,36% 31%);width:48px;height:48px}.flag{position:absolute;top:-45px;left:50%;height:53px;border-left:5px solid #a35f30;z-index:2}.flag:after{content:'🐻';position:absolute;top:0;left:0;background:#fa6986;color:white;clip-path:polygon(0 0,100% 10%,82% 90%,0 78%);width:48px;height:35px;padding-left:4px;display:grid;place-content:center}.sprite{position:absolute;top:31%;left:50%;width:120%;max-width:none;aspect-ratio:1;transform:translateX(-50%);z-index:4;pointer-events:none;filter:drop-shadow(5px 12px 8px #513c2b40)}.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .27s ease, transform .35s cubic-bezier(.2,.8,.3,1);transform:translateY(12px) scale(.985);image-rendering:auto}.sprite img.active{opacity:1;transform:translateY(0) scale(1)}.sprite.move{animation:bob .5s ease-in-out}@keyframes bob{0%{margin-top:3px}55%{margin-top:-9px}100%{margin-top:0}}.hint{position:absolute;top:74%;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;background:#fff9ecf0;border:2px solid white;border-radius:25px;padding:10px 16px;box-shadow:0 5px 15px #673d2a44;z-index:8;font-size:13px;font-weight:800}.foot{position:absolute;bottom:0;left:0;right:0;padding:11px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#b87c53 0%,#dca575 86%,transparent);z-index:10}.actions{display:flex;gap:8px}.btn{appearance:none;cursor:pointer;border:2px solid #fff5e5;border-bottom:5px solid #ba886b;background:#fff2dd;color:#67402c;box-shadow:0 3px 7px #5c332a35;border-radius:17px;min-width:0;flex:1;font-weight:900;padding:13px 4px;font-size:13px;touch-action:manipulation}.btn[aria-pressed=true]{background:#66bb9e;color:#fff;border-color:#ccf8e7;border-bottom-color:#3a8f76}.notice{margin:8px 3px 0;color:#fff8eb;font-size:11px;text-align:center;text-shadow:0 1px 3px #62402b;font-weight:700}.status{position:absolute;z-index:11;top:104px;left:50%;transform:translateX(-50%);width:90%;text-align:center;background:#ffe2e2;border:2px solid #d98680;padding:7px;border-radius:12px;color:#a33;display:none;font-size:12px;font-weight:800}.status.visible{display:block}@media(max-height:720px){.wall{top:18%;height:66%}.sprite{top:28%;width:108%}.hint{top:73%}.hud{padding:6px}.hud strong{font-size:20px}}@media(min-width:461px){body{background:repeating-linear-gradient(45deg,#4a322c,#4a322c 20px,#412b26 20px,#412b26 40px)}}
</style></head><body><main class="app"><header class="top"><div class="hud">STAGE 01<strong>🐾 연습</strong></div><div class="hud">동작 단계<strong id="stepText">1 / 3</strong></div><div class="hud">곰돌이 모션<strong>🐻</strong></div></header><div class="status" id="status" role="alert"></div><section class="wall" aria-label="클라이밍 벽과 홀드"><div class="flag"></div><div class="hold" style="left:9%;top:15%;--c:#f6b92c;--angle:-22deg"></div><div class="hold" style="left:64%;top:11%;--c:#aa7add;--angle:16deg"></div><div class="hold small" style="left:39%;top:25%;--c:#b7a39e"></div><div class="hold" style="left:10%;top:42%;--c:#4e94e9;--angle:27deg"></div><div class="hold" style="right:4%;top:37%;--c:#ed758c;--angle:-25deg"></div><div class="hold small" style="left:41%;top:47%;--c:#e1b854"></div><div class="hold" style="left:6%;top:66%;--c:#efad2e;--angle:20deg"></div><div class="hold" style="right:8%;top:67%;--c:#65b5a0;--angle:-19deg"></div><div class="hold small" style="left:34%;top:77%;--c:#8b80df"></div><div class="hold star" style="right:20%;top:82%;--c:#eeb23f"></div></section><div class="sprite" id="sprite"><img class="active" src="assets/characters/bear/poses/bear_pose_01_hang.png" alt="양손을 든 통통한 곰돌이 기본 매달림 자세" data-pose="0"><img src="assets/characters/bear/poses/bear_pose_02_reach.png" alt="한 손을 위로 뻗는 곰돌이" data-pose="1"><img src="assets/characters/bear/poses/bear_pose_03_step.png" alt="한 발을 올리는 곰돌이" data-pose="2"></div><div class="hint" id="poseLabel">① 기본 매달림 — 시안 캐릭터 적용</div><footer class="foot"><div class="actions"><button class="btn" type="button" data-choice="0" aria-pressed="true">🐾 기본</button><button class="btn" type="button" data-choice="1" aria-pressed="false">✋ 손 뻗기</button><button class="btn" type="button" data-choice="2" aria-pressed="false">🦶 발 올리기</button></div><div class="notice">비주얼 통합 테스트 · 통짜 포즈 전환 / 자유 손발 조작은 미구현</div></footer></main><script>
(()=>{'use strict';const imgs=[...document.querySelectorAll('img[data-pose]')],buttons=[...document.querySelectorAll('[data-choice]')],sprite=document.getElementById('sprite'),label=document.getElementById('poseLabel'),step=document.getElementById('stepText'),status=document.getElementById('status');const labels=['① 기본 매달림 — 시안 캐릭터 적용','② 오른손 뻗기 — 통짜 포즈 전환','③ 한 발 올리기 — 통짜 포즈 전환'];function select(i){if(i<0||i>2)return;imgs.forEach((img,j)=>img.classList.toggle('active',i===j));buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));label.textContent=labels[i];step.textContent=`${i+1} / 3`;sprite.classList.remove('move');void sprite.offsetWidth;sprite.classList.add('move')}buttons.forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.choice))));imgs.forEach(img=>{img.addEventListener('error',()=>{status.classList.add('visible');status.textContent='이미지를 불러오지 못했어. GitHub의 assets/characters/bear/poses/ 경로를 확인해줘.'})});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')select((Number(document.querySelector('[aria-pressed=true]').dataset.choice)+1)%3);if(e.key==='ArrowLeft')select((Number(document.querySelector('[aria-pressed=true]').dataset.choice)+2)%3)});})();
</script></body></html>
