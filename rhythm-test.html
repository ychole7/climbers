<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7e9ce"><title>영차영차 등반대 — 번갈아 잡기 실험</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8d8b8;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;max-width:520px;margin:auto;background:#f6e8ce;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:2;top:env(safe-area-inset-top);left:0;right:0;padding:14px 15px 8px;pointer-events:none}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{background:#fff8e9;border:2px solid #a77854;border-radius:16px;padding:7px 12px;color:#68472f;font-size:17px;font-weight:900;box-shadow:0 4px 0 #c7a786}.stat{border:2px solid #ac835d;border-radius:14px;background:#fff8e9;padding:7px 12px;font-weight:800;color:#725139;box-shadow:0 3px 0 #cfb28a;font-size:13px}.message{margin-top:12px;padding:10px 13px;border-radius:15px;background:rgba(255,249,234,.95);border:2px solid #d6b78a;text-align:center;color:#654329;font-size:14px;font-weight:800;box-shadow:0 3px 12px #8a6b4128}.bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:15px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#f7e8c9 22%,#f7e8c9)}.controls{display:flex;gap:9px}.controls button{flex:1;border:0;border-radius:15px;padding:14px 5px;background:#9e7357;color:white;font-size:14px;font-weight:900;box-shadow:0 5px 0 #75523e;touch-action:manipulation}.controls button.primary{background:#e7a24d;box-shadow:0 5px 0 #b97732;color:#56381f}.controls button:active{transform:translateY(3px);box-shadow:none}.footnote{text-align:center;color:#9b7957;font-size:11px;margin-top:10px;font-weight:650}.overlay{position:absolute;inset:0;background:#352a207a;z-index:5;display:flex;justify-content:center;align-items:center;padding:25px}.overlay[hidden]{display:none}.dialog{width:100%;background:#fff9ed;border:4px solid #a77854;border-radius:25px;padding:25px 18px 19px;text-align:center;color:#68452d;box-shadow:0 12px 0 #61442b66}.dialog h2{margin:0 0 10px;font-size:27px}.dialog p{line-height:1.65;font-size:15px}.dialog button{width:100%;background:#df9744;border:0;padding:15px;border-radius:15px;font-weight:900;color:#fff;font-size:17px;box-shadow:0 5px 0 #a9652c}.badge{display:inline-block;background:#d9edd9;border-radius:30px;padding:5px 12px;font-size:12px;color:#467449;font-weight:900}
</style></head><body><div id="app"><canvas id="view" aria-label="등반 게임 화면"></canvas><div class="top"><div class="hud"><div class="brand">🐻 영차영차!</div><div class="stat" id="stats">✋ 0/6　🍯 0</div></div><div class="message" id="msg" aria-live="polite">빛나는 홀드를 탭해서 잡아 봐!</div></div><div class="bottom"><div class="controls"><button id="restart">↻ 다시 시작</button><button id="sound">🔊 효과음 켜짐</button><button class="primary" id="help">? 방법</button></div><div class="footnote">번갈아 잡기 V1 · 조작 재미 검증용 · 기존 게임과 분리</div></div><div id="overlay" class="overlay" hidden><div class="dialog"><div class="badge" id="badgetxt">완등!</div><h2 id="dialogtitle">우와!</h2><p id="dialogtext"></p><button id="dialogbtn">다시 도전!</button></div></div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const el=id=>document.getElementById(id);let W=390,H=740,dpr=1,scale=1,offsetX=0,offsetY=0,clock=0,last=0,phase='select',step=0,usedHoney=false,misses=0,gestureCount=0,sound=true,currentHand=0,anim=0,from={x:170,y:525},to={x:170,y:525},body={x:170,y:525},notice='',noticeT=0,timing=0,windowStart=.35,windowEnd=.76,goalRoute='safe';
const holds=[{x:160,y:560,c:'#7fbeae',id:0},{x:235,y:505,c:'#8ab5da',id:1},{x:140,y:440,c:'#edb96b',id:2},{x:205,y:366,c:'#82c4ae',id:3},{x:158,y:280,c:'#e9a1a9',id:4},{x:190,y:197,c:'#ecd16e',id:5},{x:291,y:315,c:'#d8a5e0',id:6,honey:true}];let routeChoices=[3,6],active=[0],effects=[];let resetFlag=false;
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);const sx=W/390,sy=H/760;scale=Math.min(sx,sy);offsetX=(W-390*scale)/2;offsetY=(H-760*scale)/2}window.addEventListener('resize',resize);resize();
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function line(x,y,X,Y,color,width){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function drawWall(){rr(16,106,358,565,16,'#ead4ad','#b58d61',5);ctx.strokeStyle='#d3b891';ctx.lineWidth=1;for(let y=152;y<659;y+=64){ctx.beginPath();ctx.moveTo(17,y);ctx.lineTo(374,y);ctx.stroke()}for(let x=58;x<360;x+=65)for(let y=150;y<647;y+=70)ellipse(x,y,1.7,1.7,'#ba9a71');ctx.fillStyle='#c6ad8c';ctx.fillRect(17,655,357,14);rr(24,654,341,38,8,'#86b3ac','#6c978e',3);ctx.fillStyle='#7e5b3c';ctx.font='bold 15px system-ui';ctx.fillText('GOAL',237,179);ctx.fillText('🏁',317,187);}
function drawHold(h,selectable){const t=clock;const radius=h.id===6?20:22;ellipse(h.x+2,h.y+8,radius+1,12,'#9d785766');if(selectable){ellipse(h.x,h.y,radius+8+Math.sin(t*5)*2,20+Math.sin(t*5)*2,'#fff1ab7d')}ctx.save();ctx.translate(h.x,h.y);ctx.rotate(Math.sin(h.id*17)*.18);ellipse(0,0,radius,13,h.c);ellipse(-4,-4,radius*.61,4,'#ffffff55');ctx.restore();if(h.honey){ctx.font='23px system-ui';ctx.textAlign='center';ctx.fillText('🍯',h.x,h.y-21)}if(selectable){ctx.fillStyle='#614b31';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('TAP',h.x,h.y+5)}}
function drawBear(){const poseTarget=step===0?{x:179,y:607}:step===1?{x:181,y:555}:step===2?{x:171,y:501}:step===3?{x:181,y:438}:step===4?{x:202,y:371}:step===5?{x:183,y:310}:{x:188,y:230};const sway=Math.sin(clock*5)*1.6+(phase==='timing'?Math.sin(clock*21)*3:0);let x=body.x+sway,y=body.y;ellipse(x+4,y+44,39,11,'#6a4a2730'); // feet
const footY=y+55;line(x-17,y+16,x-26,footY,'#9c683d',22);line(x+16,y+17,x+25,footY,'#9c683d',22);ellipse(x-27,footY,16,12,'#b98452');ellipse(x+26,footY,16,12,'#b98452');
// gripping arms using currently attached holds; other hand follows shoulder
const lastHold=holds[Math.min(step-1,5)]||holds[0];const attached=holds[Math.min(step,5)]||holds[0];const armL=step%2===0?lastHold:attached,armR=step%2===0?attached:lastHold;const L={x:Math.max(29,Math.min(360,armL.x)),y:Math.max(158,Math.min(y+5,armL.y))},R={x:Math.max(29,Math.min(360,armR.x)),y:Math.max(158,Math.min(y+5,armR.y))};line(x-27,y-17,(x-27+L.x)/2,L.y+25,'#b88956',18);line((x-27+L.x)/2,L.y+25,L.x,L.y,'#b88956',15);line(x+27,y-17,(x+27+R.x)/2,R.y+22,'#b88956',18);line((x+27+R.x)/2,R.y+22,R.x,R.y,'#b88956',15);ellipse(L.x,L.y,11,10,'#ab7645');ellipse(R.x,R.y,11,10,'#ab7645');ellipse(x,y+2,44,49,'#b98855');ellipse(x,y-7,34,40,'#d4a574');line(x-26,y-37,x+21,y+33,'#5ba2c5',9);line(x+27,y-37,x-21,y+33,'#5ba2c5',9);rr(x-36,y+22,72,9,4,'#528fb2');ellipse(x,y+42,13,10,'#b27847');ellipse(x,y-61,43,40,'#c59662');ellipse(x-28,y-90,14,16,'#af784a');ellipse(x+29,y-91,14,16,'#af784a');ellipse(x-28,y-90,7,8,'#e2b68f');ellipse(x+29,y-91,7,8,'#e2b68f'); // side glance
if(phase==='timing'||step>=3){ellipse(x+23,y-64,3.1,4.2,'#4a3327');ellipse(x+34,y-58,9,7,'#e7c397');ellipse(x+37,y-59,4,3,'#593c2d');ctx.font='18px system-ui';ctx.fillText('💦',x+43,y-83)} else {ellipse(x-15,y-67,3.1,4.2,'#4a3327');ellipse(x+14,y-67,3.1,4.2,'#4a3327');ellipse(x,y-52,16,11,'#e9c9a4');ellipse(x,y-57,5,3.5,'#584033')}
if(phase==='timing'){ellipse(x+33,y-108,6,7,'#76b8e2')}
return poseTarget}
function drawTiming(){const x=50,y=618,w=290;rr(x-8,y-28,w+16,63,17,'#fffae9','#98704c',3);rr(x,y,w,18,9,'#e9caa2');rr(x+114,y,w*.21,18,5,'#84bf84');const p=.5+.5*Math.sin(timing*7.5);ellipse(x+w*p,y+9,9,20,'#e77a46');ctx.fillStyle='#76503b';ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillText('🟡 움직이는 바늘이 초록색일 때 탭!',195,y-8)}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#f7e9ce';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);drawWall();const allowed=phase==='select'?active:[];holds.forEach(h=>drawHold(h,allowed.includes(h.id)));drawBear();if(phase==='timing')drawTiming();ctx.restore()}
function update(dt){clock+=dt;if(noticeT>0)noticeT-=dt;if(phase==='moving'){anim+=dt;let p=Math.min(anim/.43,1),e=1-Math.pow(1-p,3);body.x=from.x+(to.x-from.x)*e;body.y=from.y+(to.y-from.y)*e;if(p>=1){phase=step>=6?'win':'select';afterMove()}}if(phase==='timing')timing+=dt;draw()}
function say(t){el('msg').textContent=t}function beep(freq=440,dur=.09){if(!sound)return;try{const ac=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.3,ac.currentTime+dur);g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function stats(){el('stats').textContent=`✋ ${step}/6　🍯 ${usedHoney?1:0}　💦 ${misses}`}
function startMove(h){phase='moving';anim=0;from={...body};step++;to={x:180+(h.x-180)*.16,y:605-step*64};if(step===6)to.y=230;beep(500+step*70,.12);stats();say(['','좋아! 다음은 오른손!','찰싹! 이번엔 왼손!','이제 선택이야! 꿀을 노려볼까?','거의 다 왔어!','마지막 홀드까지!','정상! 잘했어!'][step])}
function selectHold(id){if(phase!=='select')return;if(!active.includes(id)){say('빛나는 홀드 중에서 골라 봐!');return}gestureCount++;if(step===3&&id===6){goalRoute='honey';phase='timing';timing=0;say('🍯 도전! 바늘이 초록색일 때 화면을 탭!');beep(660)}else{if(step===3)goalRoute='safe';startMove(holds[id])}}
function afterMove(){if(phase==='win'){win();return}if(step===3){active=[3,6];say('안전한 초록 홀드, 아니면 🍯 도전?')}else if(step===4){if(goalRoute==='honey'){usedHoney=true;say('🍯 획득! 다음 홀드로 올라가자!')}active=[4]}else active=[step];stats()}
function tapTiming(){const p=.5+.5*Math.sin(timing*7.5);if(p>=.38&&p<=.59){usedHoney=true;beep(880,.2);startMove(holds[6]);say('✨ 찰싹! 꿀 홀드 성공!')}else{misses++;beep(190,.17);stats();phase='select';active=[3,6];say('앗, 손이 미끄러졌어! 다시 도전하거나 안전 홀드를 잡아 봐.')}}
function win(){phase='win';const message=usedHoney?'🍯 꿀까지 챙긴 대성공!':'첫 완등 성공! 다음에는 꿀에도 도전해 봐.';el('badgetxt').textContent='🏁 완등';el('dialogtitle').textContent='영차영차! 🎉';el('dialogtext').innerHTML=`${message}<br><b>홀드 6개 · 실수 ${misses}회</b><br>홀드를 잡는 게 재미있었는지 평가해 봐!`;el('dialogbtn').textContent='다시 도전하기';el('overlay').hidden=false;beep(990,.25)}
function reset(){phase='select';step=0;body={x:173,y:605};anim=0;active=[0];usedHoney=false;misses=0;goalRoute='safe';el('overlay').hidden=true;say('① 빛나는 홀드를 탭! 왼손·오른손은 자동으로 번갈아 잡아.');stats()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(phase==='timing'){tapTiming();return}if(phase!=='select')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-offsetX)/scale,y=(e.clientY-r.top-offsetY)/scale;let nearest=null,best=Infinity;for(const id of active){const h=holds[id],d=Math.hypot(x-h.x,y-h.y);if(d<best){best=d;nearest=id}}if(best<=42)selectHold(nearest);else say('반짝이는 홀드를 터치해 봐!')});el('restart').onclick=reset;el('sound').onclick=()=>{sound=!sound;el('sound').textContent=sound?'🔊 효과음 켜짐':'🔇 효과음 꺼짐'};el('help').onclick=()=>{el('badgetxt').textContent='조작 방법';el('dialogtitle').textContent='홀드를 탭! ✋';el('dialogtext').innerHTML='빛나는 홀드를 탭하면 곰돌이가 왼손·오른손으로 번갈아 잡아요.<br>꿀 홀드는 타이밍 도전!<br><b>안전한 홀드는 언제나 성공해요.</b>';el('dialogbtn').textContent='게임으로 돌아가기';el('overlay').hidden=false};el('dialogbtn').onclick=()=>{if(phase==='win')reset();else el('overlay').hidden=true};window.addEventListener('keydown',e=>{if(e.code==='Space'&&phase==='timing'){e.preventDefault();tapTiming()}});reset();function frame(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;update(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
