e}.wall:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,transparent 28%,#e5bea91b 28% 43%,transparent 43%),linear-gradient(24deg,transparent 63%,#a8c6d01c 63% 75%,transparent 75%),repeating-linear-gradient(0deg,transparent 0 20%,#c9b29842 calc(20% + 1px),transparent calc(20% + 2px) 40%);opacity:.7}.wall:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 36% 10%,#fff9,transparent 48%)}.flag{position:absolute;top:4.2%;left:50%;transform:translateX(-50%);font-size:31px;filter:drop-shadow(0 2px 2px #5e443c);z-index:2}.tipbar{position:relative;z-index:6;margin:0 19px 8px;display:flex;gap:6px;align-items:stretch;min-height:39px}.pill{display:flex;align-items:center;justify-content:center;padding:7px 9px;border-radius:18px;font-size:11px;font-weight:850;text-align:center}.tiptext{flex:1}.gripText{white-space:nowrap;padding-inline:12px}.hold{position:absolute;z-index:3;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;width:clamp(58px,20%,91px);aspect-ratio:1;filter:drop-shadow(0 7px 4px #64472e66);transition:left .3s,top .3s,filter .2s,scale .2s}.hold img{width:100%;height:100%;object-fit:contain;pointer-events:none}.hold.reachable:before{content:"";position:absolute;inset:17%;border:4px solid #85e6aa;border-radius:50%;box-shadow:0 0 0 3px #ffffffbc,0 0 16px #82f9a5c7;animation:pulse 1.35s infinite}.hold.blocked{opacity:.68;filter:grayscale(.1) drop-shadow(0 3px 2px #64472e44)}.hold.used{opacity:.38}.hold:active{scale:.9}.hold:focus-visible{outline:3px solid #2969bc;border-radius:50%}@keyframes pulse{50%{opacity:.5;scale:1.1}}.bear{position:absolute;width:clamp(105px,34%,163px);aspect-ratio:210/266;left:50%;top:85%;transform:translate(-50%,-50%);z-index:4;transition:left .43s cubic-bezier(.15,.83,.24,1),top .43s cubic-bezier(.15,.83,.24,1),rotate .43s;filter:drop-shadow(0 8px 5px #5b392b80);pointer-events:none}.bear img{width:100%;height:100%;object-fit:contain}.bear.wobble{animation:wobble .35s 2}.bear.jump{animation:bounce .4s}.bear.fall{animation:fall .65s forwards}@keyframes wobble{25%{rotate:8deg}75%{rotate:-8deg}}@keyframes bounce{50%{scale:1.06}}@keyframes fall{100%{translate:0 180px;rotate:25deg;opacity:0}}.footer{position:relative;z-index:7;display:grid;grid-template-columns:.95fr .95fr 1.05fr 1.15fr .65fr;gap:6px;padding:7px 9px calc(env(safe-area-inset-bottom) + 13px);background:linear-gradient(transparent,#67482a77)}.control{border-radius:18px;font-size:11px;font-weight:900;min-height:53px;color:#6c4a34;padding:7px 2px}.control .symbol{display:block;font-size:22px}.control.hint{background:linear-gradient(#8acdb0,#63ac89);color:#fff;text-shadow:0 1px 2px #3f6e5b}.control:disabled{opacity:.5}.control:active{transform:translateY(2px);box-shadow:0 2px 0 #a57650}.mode{position:relative;z-index:6;display:flex;justify-content:center;gap:5px;padding-bottom:5px}.mode button{border:1px solid #c7a47f;border-radius:100px;background:#fff3deee;color:#825c46;padding:4px 13px;font-size:11px;font-weight:800}.mode button.active{background:#79b694;color:white}.overlay{position:absolute;inset:0;background:#2e211f88;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.overlay[hidden]{display:none}.dialog{max-width:340px;width:100%;text-align:center;background:#fff4df;border:4px solid white;border-radius:26px;padding:22px 18px;box-shadow:0 10px 0 #8b6743,0 23px 40px #0005}.dialog h2{margin:5px 0;color:#b27331}.dialog p{line-height:1.7;font-size:14px}.dialog button{background:#7eb596;color:white;font-weight:900;border:0;padding:13px 22px;border-radius:14px}.timing{margin:14px 0;height:22px;border-radius:20px;background:linear-gradient(90deg,#e98d84 0 35%,#f5cd70 35% 44%,#7bc995 44% 56%,#f5cd70 56% 65%,#e98d84 65%);position:relative}.timing i{position:absolute;height:32px;top:-5px;left:50%;width:5px;background:#624029;border-radius:4px}.hud,.tipbar,.footer{flex-shrink:0}@media(max-width:360px){.pan </style></head><body><main class="app"><header class="hud"><div class="panel"><div class="tiny">⛰️ STAGE</div><div class="big stageTitle" id="stageLabel">STAGE 01</div><div class="sub" id="stageDesc">첫 홀드, 첫 선택</div></div><div class="panel moves"><div class="tiny">🐾 이동</div><div class="big" id="moveLabel">0 / 4</div><div class="sub">⭐ 목표 이동 횟수</div></div><div class="panel"><div class="tiny">균형 <span id="balanceText" style="float:right">안정</span></div><div class="meter"><i class="needle" id="needle"></i></div><div class="sub">왼쪽 ◀　▶ 오른쪽</div></div></header><div class="tipbar"><div class="pill tiptext" id="tip">빛나는 홀드를 눌러 등반을 시작해요!</div><div class="pill gripText" id="grip">✊ 그립 ❤️❤️❤️</div></div><div class="wallWrap"><section class="wall" id="wall" aria-label="클라이밍 게임판"><div class="flag">🚩</div><div id="holds"></div><div class="bear" id="bear"><img src="assets/characters/bear_pose_0.png" alt="등반하는 곰돌이"></div></section></div><footer class="footer"><button class="control" id="reset"><span class="symbol">⟳</span>다시하기</button><button class="control" id="undo"><span class="symbol">↶</span>되돌리기</button><button class="control hint" id="hint"><span class="symbol">💡</span>힌트</button><button class="control" id="next"><span class="symbol">☰</span>스테이지</button><button class="control" id="settings"><span class="symbol">⚙️</span>설정</button></footer><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="timing" id="timingTrack" hidden><i id="cursor"></i></div><button id="dialogAction">확인</button></div></div></main><script>
'use strict';
const stageNames=['첫 홀드, 첫 선택','왼쪽으로 돌아가기','위험한 지름길','중앙에서 균형 잡기','저그와 크림프','사선의 비밀','왼쪽 우회로','어려운 선택','위험한 클라이밍','정상 정복'];
const files={jug:'jug',crimp:'crimp',sloper:'sloper',volume:'volume',pinch:'pinch',pocket:'pocket'};
const stagePresets=[
[[27,78,'jug'],[73,78,'jug'],[28,59,'crimp'],[51,59,'jug'],[74,59,'sloper'],[50,41,'jug'],[50,23,'jug']],
[[32,80,'jug'],[72,78,'jug'],[60,62,'jug'],[28,59,'jug'],[47,42,'jug'],[69,39,'jug'],[50,21,'jug']],
[[22,79,'jug'],[76,77,'crimp'],[49,60,'jug'],[78,58,'crimp'],[31,41,'jug'],[64,41,'jug'],[50,22,'jug']],
[[25,79,'jug'],[75,79,'jug'],[35,61,'sloper'],[62,61,'jug'],[50,43,'sloper'],[28,41,'jug'],[50,22,'jug']],
[[24,80,'jug'],[76,79,'crimp'],[33,62,'jug'],[70,62,'crimp'],[49,44,'jug'],[29,42,'crimp'],[50,22,'jug']],
[[22,80,'jug'],[68,80,'jug'],[40,61,'jug'],[78,61,'crimp'],[54,43,'sloper'],[27,42,'jug'],[50,22,'jug']],
[[22,79,'jug'],[75,79,'jug'],[26,60,'jug'],[53,61,'crimp'],[76,43,'jug'],[34,43,'jug'],[50,22,'jug']],
[[25,80,'crimp'],[77,80,'jug'],[39,61,'jug'],[72,61,'sloper'],[27,42,'crimp'],[52,42,'jug'],[50,22,'jug']],
[[25,79,'jug'],[73,79,'crimp'],[27,61,'crimp'],[64,61,'jug'],[50,44,'sloper'],[78,42,'crimp'],[50,22,'jug']],
[[24,80,'jug'],[74,80,'crimp'],[37,62,'jug'],[67,60,'crimp'],[28,43,'sloper'],[73,43,'jug'],[50,22,'jug']]
];
let level=0, path=[], grip=3, balance=0, mode='tutorial', busy=false, pending=null, anim=0, timingStart=0, timer=null, sounds=false;
const $=id=>document.getElementById(id), nodeList=()=>stagePresets[level].map((v,i)=>({id:i,x:v[0],y:v[1],type:v[2]}));
const root=()=>path.length?nodeList()[path.at(-1)]:{x:50,y:91,id:-1};
function candidates(){const now=root();return nodeList().filter(n=>!path.includes(n.id)&&n.y<now.y-7&&now.y-n.y<=23&&Math.abs(n.x-now.x)<=42)}
function newBalance(n){let v=balance+(n.x>root().x+10?1:n.x<root().x-10?-1:0);if(n.type==='jug'&&Math.abs(v)>0)v+=v>0?-1:1;return Math.max(-2,Math.min(2,v))}
function allowed(n){return candidates().some(k=>k.id===n.id)&&Math.abs(newBalance(n))<2&&!(n.type==='sloper'&&newBalance(n)!==0)}
function render(){const arr=nodeList(),can=candidates();$('stageLabel').textContent='STAGE '+String(level+1).padStart(2,'0');$('stageDesc').textContent=stageNames[level];$('moveLabel').textContent=path.length+' / '+(level<2?4:5);$('needle').style.left=(50+balance*22)+'%';$('balanceText').textContent=balance===0?'안정':balance>0?'오른쪽':'왼쪽';$('grip').textContent='✊ 그립 '+'❤️'.repeat(Math.max(0,grip));$('undo').disabled=!path.length||busy;
$('holds').innerHTML='';arr.forEach(n=>{const b=document.createElement('button');b.className='hold'+(allowed(n)?' reachable':'')+(path.includes(n.id)?' used':'')+(!can.some(k=>k.id===n.id)?' blocked':'');b.style.left=n.x+'%';b.style.top=n.y+'%';b.setAttribute('aria-label',n.type+' 홀드 '+(n.id+1));b.innerHTML='<img src="assets/holds/'+(files[n.type]||'jug')+'.png" alt="">';b.onclick=()=>choose(n.id);$('holds').appendChild(b)});
const r=root(),bear=$('bear');bear.style.left=r.x+'%';bear.style.top=(r.y-5)+'%';bear.querySelector('img').src='assets/characters/bear_pose_'+(path.length?(r.x<42?1:r.x>58?2:0):0)+'.png';$('tip').textContent=mode==='tutorial'?(level===0?'빛나는 홀드를 눌러 등반을 시작해요!':'초록 테두리 홀드를 터치해요. 안전한 길을 찾아보세요!'):'홀드를 읽고 정상까지 올라가세요!';$('tip').style.display=mode==='tutorial'?'flex':'none'}
function show(title,body,button,fn){$('dialogTitle').textContent=title;$('dialogText').textContent=body;$('dialogAction').textContent=button;$('overlay').hidden=false;$('timingTrack').hidden=true;$('dialogAction').onclick=()=>{close();fn?.()}}
function close(){$('overlay').hidden=true;clearInterval(timer);pending=null}
function choose(id){if(busy)return;const n=nodeList()[id];if(!n)return;if(!allowed(n)){const reason=n.type==='sloper'?'슬로퍼는 몸의 균형을 먼저 맞춰야 해요.':'그 홀드까지 손이 닿지 않거나 균형이 맞지 않아요.';$('tip').textContent=reason;$('bear').classList.add('wobble');setTimeout(()=>$('bear').classList.remove('wobble'),550);return}if(n.type==='crimp'&&level>1){pending=n;startTiming();return}advance(n)}
function advance(n,loss=0){busy=true;const old={id:n.id,grip,balance};grip=Math.max(0,grip-loss);balance=newBalance(n);path.push(n.id);$('bear').classList.add('jump');render();setTimeout(()=>{$('bear').classList.remove('jump');busy=false;if(grip===0){show('아차! 미끄덩!','그립을 모두 소모했어. 되돌리거나 다시 도전해봐!','되돌리기',()=>undo())}else if(n.id===6){show('🎉 정상 정복!','영차! 잘했어! ⭐ '+(path.length<=(level<2?4:5)?'⭐⭐':'⭐')+' · '+path.length+'번 이동','다음 스테이지',()=>{level=(level+1)%10;reset()})}},490)}
function startTiming(){busy=true;$('dialogTitle').textContent='⚡ 손끝으로 꽉!';$('dialogText').textContent='움직이는 바가 초록색에 올 때 탭!';$('dialogAction').textContent='지금 잡기!';$('overlay').hidden=false;$('timingTrack').hidden=false;timingStart=performance.now();timer=setInterval(()=>{$('cursor').style.left=(50+48*Math.sin((performance.now()-timingStart)/280))+'%'},25);$('dialogAction').onclick=()=>{const p=50+48*Math.sin((performance.now()-timingStart)/280);const loss=Math.abs(p-50)<7?0:Math.abs(p-50)<18?1:2;const n=pending;close();busy=false;advance(n,loss)}}
function undo(){if(!path.length||busy)return;path.pop();balance=0;grip=3;const ids=[...path];path=[];ids.forEach(id=>{const n=nodeList()[id];balance=newBalance(n);path.push(id);if(n.type==='crimp')grip=Math.max(1,grip-1)});render()}
function reset(){path=[];balance=0;grip=3;busy=false;close();render()}
$('undo').onclick=undo;$('reset').onclick=reset;$('hint').onclick=()=>{const pick=candidates().find(allowed);if(pick){const b=[...document.querySelectorAll('.hold')][pick.id];b.style.filter='drop-shadow(0 0 17px #ffdc42)';$('tip').textContent='빛나는 홀드부터 잡아보세요!'}else $('tip').textContent='되돌리기로 다른 길을 찾아보세요!'};
$('next').onclick=()=>show('스테이지 선택','현재 '+(level+1)+'단계 · 다음 스테이지로 넘어갈까요?','다음 단계',()=>{level=(level+1)%10;reset()});$('settings').onclick=()=>show('게임 안내','홀드를 한 번 터치해 이동하세요. 저그는 균형을 회복하고, 크림프는 타이밍 조작이 필요합니다. 되돌리기는 무료입니다.','확인');render();
</script></body></html>
