<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e9cfaa"><title>영차영차 등반대 · 공간감 2.5D 플레이 빌드</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#6c422b;color:#70482e;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}
.app{position:relative;isolation:isolate;width:min(100%,480px);height:100dvh;margin:auto;overflow:hidden;background:#c89e72 url('assets/scenery/gym-art.webp') center center/100% 100% no-repeat}
.app:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#3f240f4a 0%,transparent 23%,transparent 78%,#28150d75 100%);z-index:0}
.hud{position:absolute;z-index:10;top:calc(env(safe-area-inset-top) + 4px);left:9px;right:9px;display:grid;grid-template-columns:1.1fr .78fr 1.17fr;gap:6px}
.panel,.pill,.control{background:linear-gradient(160deg,#fffdf5,#f5dec3);border:2px solid #fff7eb;box-shadow:0 5px 0 #a77750,0 8px 14px #3b291b49;border-radius:19px}.panel{height:clamp(72px,10.3vh,100px);padding:9px 8px;min-width:0}.tiny{font-size:clamp(9px,2.65vw,12px);font-weight:850;color:#82583b}.big{font-size:clamp(21px,5.5vw,28px);font-weight:950;white-space:nowrap}.stageTitle{font-size:clamp(17px,4.8vw,22px)}.moves{text-align:center;color:#bf761d}.moves .big{font-size:clamp(27px,8vw,38px)}.sub{font-size:clamp(8px,2.15vw,11px);color:#98785e;white-space:nowrap}.meter{height:14px;background:linear-gradient(90deg,#e97787 0 20%,#f1c36f 20% 40%,#8fd3ac 40% 60%,#ebd16e 60% 80%,#82bada 80%);border:2px solid #fff7e8;border-radius:20px;position:relative;margin:10px 1px 7px}.needle{position:absolute;top:50%;left:50%;height:23px;width:23px;border-radius:50%;background:#96623f;border:4px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 5px #45251d66;transition:left .2s}
.tipbar{position:absolute;z-index:10;left:12px;right:12px;top:calc(env(safe-area-inset-top) + clamp(87px,11.5vh,116px));display:flex;gap:5px}.pill{padding:8px 7px;min-height:35px;display:flex;justify-content:center;align-items:center;font-size:clamp(9px,2.4vw,12px);font-weight:850;text-align:center;border-radius:23px}.tiptext{flex:1}.gripText{white-space:nowrap}
.wallWrap{position:absolute;z-index:4;left:17%;right:17%;top:25%;bottom:16%;padding:0;pointer-events:none}.wall{width:100%;height:100%;position:relative;background:none;border:0;box-shadow:none;transform:none;overflow:visible;pointer-events:none}.wall:before,.wall:after{display:none}.flag{display:none}
.hold{position:absolute;z-index:4;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:clamp(54px,27%,98px);aspect-ratio:1;filter:drop-shadow(2px 8px 4px #4c302590);transition:left .34s,top .34s,filter .2s;pointer-events:auto}.hold img{width:100%;height:100%;object-fit:contain;pointer-events:none}.hold.reachable:before{content:'';position:absolute;inset:13%;border:4px solid #8affad;border-radius:50%;box-shadow:0 0 0 3px #fff9,0 0 19px #7dffb9;animation:pulse 1.5s infinite}.hold.blocked{opacity:.92}.hold.used{opacity:.52}.hold:active{scale:.93}.hold:focus-visible{outline:3px solid #36bbff;border-radius:50%}@keyframes pulse{50%{opacity:.54;scale:1.1}}
.bear{position:absolute;z-index:5;left:50%;top:85%;width:clamp(110px,62%,188px);aspect-ratio:210/266;transform:translate(-50%,-50%);transition:left .44s cubic-bezier(.1,.8,.3,1),top .44s cubic-bezier(.1,.8,.3,1);filter:drop-shadow(2px 10px 5px #32190c91);pointer-events:none}.bear img{width:100%;height:100%;object-fit:contain}.bear.wobble{animation:wobble .35s 2}.bear.jump{animation:bounce .43s}.bear.fall{animation:fall .6s forwards}@keyframes wobble{25%{rotate:8deg}75%{rotate:-8deg}}@keyframes bounce{50%{scale:1.05}}@keyframes fall{100%{translate:0 140px;opacity:0}}
.footer{position:absolute;z-index:12;bottom:calc(env(safe-area-inset-bottom) + 8px);left:7px;right:7px;display:grid;grid-template-columns:1fr 1fr 1.1fr 1.17fr .77fr;gap:5px}.control{min-width:0;min-height:clamp(52px,8.3vh,77px);padding:5px 1px;font-size:clamp(10px,2.6vw,12px);font-weight:850;color:#6b4932}.control .symbol{display:block;font-size:clamp(19px,5.3vw,26px)}.control.hint{background:linear-gradient(#88cfad,#5eae8e);color:white}.control:disabled{opacity:.46}.control:active{transform:translateY(2px)}
.mode{display:none!important}.overlay{position:absolute;inset:0;z-index:30;display:flex;justify-content:center;align-items:center;background:#2d1c176b;padding:18px}.overlay[hidden]{display:none}.dialog{background:#fff3df;border:4px solid white;border-radius:24px;text-align:center;padding:23px 17px;width:min(330px,100%);box-shadow:0 12px 0 #815a37,0 19px 30px #0005}.dialog h2{margin:0;color:#ae743b}.dialog p{font-size:14px;line-height:1.7}.dialog button{border:0;border-radius:14px;background:#70b38d;color:white;font-weight:900;padding:13px 20px}.timing{position:relative;margin:14px 0;height:22px;border-radius:20px;background:linear-gradient(90deg,#e98785 0 35%,#eec46b 35% 44%,#80c996 44% 56%,#eec46b 56% 65%,#e98785 65%)}.timing i{position:absolute;top:-5px;left:50%;width:5px;height:32px;border-radius:4px;background:#5d3427}
@media(max-height:740px){.wallWrap{top:27%;bottom:16%}.panel{padding:6px}.tipbar{top:calc(env(safe-area-inset-top) + 81px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="app"><header class="hud"><div class="panel"><div class="tiny">⛰️ STAGE</div><div class="big stageTitle" id="stageLabel">STAGE 01</div><div class="sub" id="stageDesc">첫 홀드, 첫 선택</div></div><div class="panel moves"><div class="tiny">🐾 이동</div><div class="big" id="moveLabel">0 / 4</div><div class="sub">⭐ 목표 이동 횟수</div></div><div class="panel"><div class="tiny">균형 <span id="balanceText" style="float:right">안정</span></div><div class="meter"><i class="needle" id="needle"></i></div><div class="sub">왼쪽 ◀　▶ 오른쪽</div></div></header><div class="tipbar"><div class="pill tiptext" id="tip">빛나는 홀드를 눌러 등반을 시작해요!</div><div class="pill gripText" id="grip">✊ 그립 ❤️❤️❤️</div></div><div class="wallWrap"><section class="wall" id="wall" aria-label="클라이밍 게임판"><div class="flag">🚩</div><div id="holds"></div><div class="bear" id="bear"><img src="assets/characters/bear_pose_0.png" alt="등반하는 곰돌이"></div></section></div><footer class="footer"><button class="control" id="reset"><span class="symbol">⟳</span>다시하기</button><button class="control" id="undo"><span class="symbol">↶</span>되돌리기</button><button class="control hint" id="hint"><span class="symbol">💡</span>힌트</button><button class="control" id="next"><span class="symbol">☰</span>스테이지</button><button class="control" id="settings"><span class="symbol">⚙️</span>설정</button></footer><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="timing" id="timingTrack" hidden><i id="cursor"></i></div><button id="dialogAction">확인</button></div></div></main><script>
'use strict';
const stageNames=['첫 홀드, 첫 선택','왼쪽으로 돌아가기','위험한 지름길','중앙에서 균형 잡기','저그와 크림프','사선의 비밀','왼쪽 우회로','어려운 선택','위험한 클라이밍','정상 정복'];
const files={jug:'jug',crimp:'crimp',sloper:'sloper',volume:'volume',pinch:'pinch',pocket:'pocket'};
const stagePresets=[
[[27,78,'jug'],[73,78,'jug'],[28,59,'crimp'],[51,59,'jug'],[74,59,'sloper'],[50,41,'jug'],[50,23,'jug']],
[[32,80,'jug'],[72,78,'jug'],[60,62,'jug'],[28,59,'jug'],[47,42,'jug'],[69,39,'jug'],[50,21,'jug']],
[[22,79,'jug'],[76,77,'crimp'],[49,60,'jug'],[78,58,'crimp'],[31,41,'jug'],[64,41,'jug'],[50,22,'jug']],
[[25,79,'jug'],[75,79,'jug'],[35,61,'sloper'],[62,61,'jug'],[50,43,'sloper'],[28,41,'jug'],[50,22,'jug']],
[[24,80,'jug'],[76,79,'crimp'],[33,62,'jug'],[70,62,'crimp'],[49,44,'jug'],[29,42,'crimp'],[50,22,'jug']],
[[22,80,'jug'],[68,80,'jug'],[40,61,'jug'],[78,61,'crimp'],[54,43,'sloper'],[27,42,'jug'],[50,22,'jug']],
[[22,79,'jug'],[75,79,'jug'],[26,60,'jug'],[53,61,'crimp'],[76,43,'jug'],[34,43,'jug'],[50,22,'jug']],
[[25,80,'crimp'],[77,80,'jug'],[39,61,'jug'],[72,61,'sloper'],[27,42,'crimp'],[52,42,'jug'],[50,22,'jug']],
[[25,79,'jug'],[73,79,'crimp'],[27,61,'crimp'],[64,61,'jug'],[50,44,'sloper'],[78,42,'crimp'],[50,22,'jug']],
[[24,80,'jug'],[74,80,'crimp'],[37,62,'jug'],[67,60,'crimp'],[28,43,'sloper'],[73,43,'jug'],[50,22,'jug']]
];
let level=0, path=[], grip=3, balance=0, mode='tutorial', busy=false, pending=null, anim=0, timingStart=0, timer=null, sounds=false;
const $=id=>document.getElementById(id), nodeList=()=>stagePresets[level].map((v,i)=>({id:i,x:v[0],y:v[1],type:v[2]}));
const root=()=>path.length?nodeList()[path.at(-1)]:{x:50,y:91,id:-1};
function candidates(){const now=root();return nodeList().filter(n=>!path.includes(n.id)&&n.y<now.y-7&&now.y-n.y<=23&&Math.abs(n.x-now.x)<=42)}
function newBalance(n){let v=balance+(n.x>root().x+10?1:n.x<root().x-10?-1:0);if(n.type==='jug'&&Math.abs(v)>0)v+=v>0?-1:1;return Math.max(-2,Math.min(2,v))}
function allowed(n){return candidates().some(k=>k.id===n.id)&&Math.abs(newBalance(n))<2&&!(n.type==='sloper'&&newBalance(n)!==0)}
function render(){const arr=nodeList(),can=candidates();$('stageLabel').textContent='STAGE '+String(level+1).padStart(2,'0');$('stageDesc').textContent=stageNames[level];$('moveLabel').textContent=path.length+' / '+(level<2?4:5);$('needle').style.left=(50+balance*22)+'%';$('balanceText').textContent=balance===0?'안정':balance>0?'오른쪽':'왼쪽';$('grip').textContent='✊ 그립 '+'❤️'.repeat(Math.max(0,grip));$('undo').disabled=!path.length||busy;
$('holds').innerHTML='';arr.forEach(n=>{const b=document.createElement('button');b.className='hold'+(allowed(n)?' reachable':'')+(path.includes(n.id)?' used':'')+(!can.some(k=>k.id===n.id)?' blocked':'');b.style.left=n.x+'%';b.style.top=n.y+'%';b.setAttribute('aria-label',n.type+' 홀드 '+(n.id+1));b.innerHTML='<img src="assets/holds/'+(files[n.type]||'jug')+'.png" alt="">';b.onclick=()=>choose(n.id);$('holds').appendChild(b)});
const r=root(),bear=$('bear');bear.style.left=r.x+'%';bear.style.top=(r.y-5)+'%';bear.querySelector('img').src='assets/characters/bear_pose_'+(path.length?(r.x<42?1:r.x>58?2:0):0)+'.png';$('tip').textContent=mode==='tutorial'?(level===0?'빛나는 홀드를 눌러 등반을 시작해요!':'초록 테두리 홀드를 터치해요. 안전한 길을 찾아보세요!'):'홀드를 읽고 정상까지 올라가세요!';$('tip').style.display=mode==='tutorial'?'flex':'none'}
function show(title,body,button,fn){$('dialogTitle').textContent=title;$('dialogText').textContent=body;$('dialogAction').textContent=button;$('overlay').hidden=false;$('timingTrack').hidden=true;$('dialogAction').onclick=()=>{close();fn?.()}}
function close(){$('overlay').hidden=true;clearInterval(timer);pending=null}
function choose(id){if(busy)return;const n=nodeList()[id];if(!n)return;if(!allowed(n)){const reason=n.type==='sloper'?'슬로퍼는 몸의 균형을 먼저 맞춰야 해요.':'그 홀드까지 손이 닿지 않거나 균형이 맞지 않아요.';$('tip').textContent=reason;$('bear').classList.add('wobble');setTimeout(()=>$('bear').classList.remove('wobble'),550);return}if(n.type==='crimp'&&level>1){pending=n;startTiming();return}advance(n)}
function advance(n,loss=0){busy=true;const old={id:n.id,grip,balance};grip=Math.max(0,grip-loss);balance=newBalance(n);path.push(n.id);$('bear').classList.add('jump');render();setTimeout(()=>{$('bear').classList.remove('jump');busy=false;if(grip===0){show('아차! 미끄덩!','그립을 모두 소모했어. 되돌리거나 다시 도전해봐!','되돌리기',()=>undo())}else if(n.id===6){show('🎉 정상 정복!','영차! 잘했어! ⭐ '+(path.length<=(level<2?4:5)?'⭐⭐':'⭐')+' · '+path.length+'번 이동','다음 스테이지',()=>{level=(level+1)%10;reset()})}},490)}
function startTiming(){busy=true;$('dialogTitle').textContent='⚡ 손끝으로 꽉!';$('dialogText').textContent='움직이는 바가 초록색에 올 때 탭!';$('dialogAction').textContent='지금 잡기!';$('overlay').hidden=false;$('timingTrack').hidden=false;timingStart=performance.now();timer=setInterval(()=>{$('cursor').style.left=(50+48*Math.sin((performance.now()-timingStart)/280))+'%'},25);$('dialogAction').onclick=()=>{const p=50+48*Math.sin((performance.now()-timingStart)/280);const loss=Math.abs(p-50)<7?0:Math.abs(p-50)<18?1:2;const n=pending;close();busy=false;advance(n,loss)}}
function undo(){if(!path.length||busy)return;path.pop();balance=0;grip=3;const ids=[...path];path=[];ids.forEach(id=>{const n=nodeList()[id];balance=newBalance(n);path.push(id);if(n.type==='crimp')grip=Math.max(1,grip-1)});render()}
function reset(){path=[];balance=0;grip=3;busy=false;close();render()}
$('undo').onclick=undo;$('reset').onclick=reset;$('hint').onclick=()=>{const pick=candidates().find(allowed);if(pick){const b=[...document.querySelectorAll('.hold')][pick.id];b.style.filter='drop-shadow(0 0 17px #ffdc42)';$('tip').textContent='빛나는 홀드부터 잡아보세요!'}else $('tip').textContent='되돌리기로 다른 길을 찾아보세요!'};
$('next').onclick=()=>show('스테이지 선택','현재 '+(level+1)+'단계 · 다음 스테이지로 넘어갈까요?','다음 단계',()=>{level=(level+1)%10;reset()});$('settings').onclick=()=>show('게임 안내','홀드를 한 번 터치해 이동하세요. 저그는 균형을 회복하고, 크림프는 타이밍 조작이 필요합니다. 되돌리기는 무료입니다.','확인');render();
</script></body></html>
