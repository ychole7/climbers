<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd8d66"><title>영차영차 등반대 · 퍼즐 연구소</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;background:#6e452e;color:#67432f}button{font:inherit;touch-action:manipulation;cursor:pointer}.game{width:min(100%,470px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:#d7b58c url('assets/scenery/gym-art.webp') center/100% 100% no-repeat}.game:before{content:"";position:absolute;inset:0;background:linear-gradient(#40240f40,transparent 25%,transparent 74%,#4b2c165e);pointer-events:none}.top{position:absolute;top:calc(5px + env(safe-area-inset-top));left:9px;right:9px;display:grid;grid-template-columns:1.1fr .85fr 1fr;gap:6px;z-index:10}.card,.action,.message{background:linear-gradient(145deg,#fffdf3,#f4dec0);border:2px solid #fff8e9;border-radius:17px;box-shadow:0 4px 0 #a67550,0 6px 13px #3f291d4c}.card{height:76px;padding:8px;min-width:0}.mini{font-size:10px;font-weight:800;color:#94735a}.stat{font-size:19px;font-weight:950;white-space:nowrap}.small{font-size:10px;color:#97735c}.balancebar{height:11px;border-radius:10px;background:linear-gradient(90deg,#e27c78 0 25%,#eac070 25% 39%,#7fc69b 39% 61%,#eac070 61% 75%,#e27c78 75%);margin:9px 0;position:relative}.balancebar i{position:absolute;width:15px;height:15px;border-radius:100%;background:#633d29;border:3px solid white;top:-2px;left:50%;transform:translateX(-50%);transition:left .25s}.message{position:absolute;z-index:10;top:calc(90px + env(safe-area-inset-top));left:11px;right:11px;padding:8px 10px;text-align:center;font-weight:800;font-size:12px;min-height:35px}.board{position:absolute;left:10%;right:10%;top:21%;bottom:16%;pointer-events:none}.board:after{content:"";position:absolute;inset:0;border-radius:25px;box-shadow:inset 0 0 20px #fff4;pointer-events:none}.hold,.foothold{position:absolute;z-index:5;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;pointer-events:auto}.hold{width:clamp(57px,24%,94px);aspect-ratio:1}.hold img,.foothold img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(3px 7px 4px #44302399);pointer-events:none}.hold:before,.foothold:before{content:"";position:absolute;inset:12%;border-radius:50%;border:3px solid transparent;pointer-events:none}.hold.open:before,.foothold.open:before{border-color:#93ffc1;box-shadow:0 0 12px 4px #52e1a499;animation:pulse 1.3s infinite}.hold.locked{opacity:.67;filter:saturate(.6)}.hold.done{opacity:.55}.hold:focus-visible,.foothold:focus-visible{outline:3px solid #45d99b;border-radius:50%}.hold .tag{position:absolute;top:-8px;left:48%;transform:translateX(-50%);background:#fff9e7;border-radius:15px;padding:1px 5px;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 2px 4px #0003}.foothold{width:48px;height:48px}.foothold .tag{position:absolute;top:-15px;left:-10px;font-size:10px;white-space:nowrap;background:#fff8e3;border-radius:10px;padding:2px 4px}.foothold.used:before{border-color:#ffd54d;box-shadow:0 0 12px #ffdb63}.bear{position:absolute;z-index:6;width:clamp(72px,34%,116px);aspect-ratio:210/266;top:85%;left:50%;transform:translate(-50%,-58%);filter:drop-shadow(4px 9px 4px #322012aa);transition:left .43s ease,top .43s ease;pointer-events:none}.bear img{width:100%;height:100%;object-fit:contain}.bear.shake{animation:shake .35s}.footer{position:absolute;z-index:11;bottom:calc(env(safe-area-inset-bottom) + 7px);left:7px;right:7px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.action{min-height:58px;font-size:12px;font-weight:850;color:#704934;padding:5px 0}.action b{display:block;font-size:23px}.action.highlight{background:linear-gradient(#a2d8a8,#66b48b);color:#fff}.action:disabled{opacity:.5}.modal{position:absolute;z-index:50;inset:0;background:#2c180fc0;display:flex;align-items:center;justify-content:center;padding:18px}.modal[hidden]{display:none}.dialog{background:#fff2dc;border:4px solid white;border-radius:24px;padding:24px 20px;text-align:center;width:min(330px,100%);box-shadow:0 12px 0 #91623c}.dialog h2{margin:0 0 10px}.dialog p{font-size:14px;line-height:1.6}.dialog button{border:0;background:#65af84;border-radius:12px;padding:12px 24px;color:#fff;font-weight:900}.timing{height:25px;background:linear-gradient(90deg,#ea8585 0 34%,#f1c776 34% 43%,#80c89b 43% 57%,#f1c776 57% 66%,#ea8585 66%);border-radius:20px;margin:20px 0;position:relative}.timing i{position:absolute;width:5px;background:#49352a;height:34px;top:-4px;left:0}.legend{font-size:10px;color:#6a5241;margin-top:5px}@keyframes pulse{50%{opacity:.5;scale:1.07}}@keyframes shake{25%{rotate:-7deg}75%{rotate:7deg}}@media(max-height:720px){.board{top:23%;bottom:16%}.card{height:66px}.message{top:calc(79px + env(safe-area-inset-top))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="game"><header class="top"><div class="card"><div class="mini">🧗 STAGE</div><div class="stat" id="stageNum">01 / 03</div><div class="small" id="stageName">발판 퍼즐</div></div><div class="card"><div class="mini">🐾 이동</div><div class="stat" id="moves">0</div><div class="small" id="best">목표 4회</div></div><div class="card"><div class="mini">균형 · <span id="balanceName">중립</span></div><div class="balancebar"><i id="balanceNeedle"></i></div><div class="small" id="grip">✊ 그립 ♥♥♥</div></div></header><div class="message" id="message">홀드를 선택하세요!</div><div class="board" id="board"><div id="holds"></div><div id="foots"></div><div class="bear" id="bear"><img id="bearImg" src="assets/characters/bear_pose_0.png" alt="등반 중인 곰돌이"></div></div><footer class="footer"><button class="action" id="reset"><b>⟳</b>다시하기</button><button class="action" id="undo"><b>↶</b>되돌리기</button><button class="action highlight" id="hint"><b>💡</b>힌트</button><button class="action" id="select"><b>☰</b>스테이지</button></footer><div class="modal" id="modal" hidden><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="timing" id="timing" hidden><i id="needle"></i></div><button id="modalAction">확인</button><div class="legend" id="modalFoot"></div></div></div></main><script src="game.js"></script></body></html>
