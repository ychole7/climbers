<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e9cfaa"><title>영차영차 등반대 · 공간감 2.5D 플레이 빌드</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#6c422b;color:#70482e;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}
.app{position:relative;isolation:isolate;width:min(100%,480px);height:100dvh;margin:auto;overflow:hidden;background:#c89e72 url('assets/scenery/gym-art.webp') center center/100% 100% no-repeat}
.app:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#3f240f4a 0%,transparent 23%,transparent 78%,#28150d75 100%);z-index:0}
.hud{position:absolute;z-index:10;top:calc(env(safe-area-inset-top) + 4px);left:9px;right:9px;display:grid;grid-template-columns:1.1fr .78fr 1.17fr;gap:6px}
.panel,.pill,.control{background:linear-gradient(160deg,#fffdf5,#f5dec3);border:2px solid #fff7eb;box-shadow:0 5px 0 #a77750,0 8px 14px #3b291b49;border-radius:19px}.panel{height:clamp(72px,10.3vh,100px);padding:9px 8px;min-width:0}.tiny{font-size:clamp(9px,2.65vw,12px);font-weight:850;color:#82583b}.big{font-size:clamp(21px,5.5vw,28px);font-weight:950;white-space:nowrap}.stageTitle{font-size:clamp(17px,4.8vw,22px)}.moves{text-align:center;color:#bf761d}.moves .big{font-size:clamp(27px,8vw,38px)}.sub{font-size:clamp(8px,2.15vw,11px);color:#98785e;white-space:nowrap}.meter{height:14px;background:linear-gradient(90deg,#e97787 0 20%,#f1c36f 20% 40%,#8fd3ac 40% 60%,#ebd16e 60% 80%,#82bada 80%);border:2px solid #fff7e8;border-radius:20px;position:relative;margin:10px 1px 7px}.needle{position:absolute;top:50%;left:50%;height:23px;width:23px;border-radius:50%;background:#96623f;border:4px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 5px #45251d66;transition:left .2s}
.tipbar{position:absolute;z-index:10;left:12px;right:12px;top:calc(env(safe-area-inset-top) + clamp(87px,11.5vh,116px));display:flex;gap:5px}.pill{padding:8px 7px;min-height:35px;display:flex;justify-content:center;align-items:center;font-size:clamp(9px,2.4vw,12px);font-weight:850;text-align:center;border-radius:23px}.tiptext{flex:1}.gripText{white-space:nowrap}
.wallWrap{position:absolute;z-index:4;left:17%;right:17%;top:25%;bottom:16%;padding:0;pointer-events:none}.wall{width:100%;height:100%;position:relative;background:none;border:0;box-shadow:none;transform:none;overflow:visible;pointer-events:none}.wall:before,.wall:after{display:none}.flag{display:none}
.hold{position:absolute;z-index:4;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:clamp(59.4px,29.7%,107.8px);aspect-ratio:1;filter:drop-shadow(2px 8px 4px #4c302590);transition:left .34s,top .34s,filter .2s;pointer-events:auto}.hold img{width:100%;height:100%;object-fit:contain;pointer-events:none}.hold.reachable:before{content:'';position:absolute;inset:13%;border:4px solid #8affad;border-radius:50%;box-shadow:0 0 0 3px #fff9,0 0 19px #7dffb9;animation:pulse 1.5s infinite}.hold.blocked{opacity:.92}.hold.used{opacity:.52}.hold:active{scale:.93}.hold:focus-visible{outline:3px solid #36bbff;border-radius:50%}@keyframes pulse{50%{opacity:.54;scale:1.1}}
.bear{position:absolute;z-index:5;left:50%;top:85%;width:clamp(82.5px,46.5%,141px);aspect-ratio:210/266;transform:translate(-50%,-50%);transition:left .44s cubic-bezier(.1,.8,.3,1),top .44s cubic-bezier(.1,.8,.3,1);filter:drop-shadow(2px 10px 5px #32190c91);pointer-events:none}.bear img{width:100%;height:100%;object-fit:contain}.bear.wobble{animation:wobble .35s 2}.bear.jump{animation:bounce .43s}.bear.fall{animation:fall .6s forwards}@keyframes wobble{25%{rotate:8deg}75%{rotate:-8deg}}@keyframes bounce{50%{scale:1.05}}@keyframes fall{100%{translate:0 140px;opacity:0}}
.footer{position:absolute;z-index:12;bottom:calc(env(safe-area-inset-bottom) + 8px);left:7px;right:7px;display:grid;grid-template-columns:1fr 1fr 1.1fr 1.17fr .77fr;gap:5px}.control{min-width:0;min-height:clamp(52px,8.3vh,77px);padding:5px 1px;font-size:clamp(10px,2.6vw,12px);font-weight:850;color:#6b4932}.control .symbol{display:block;font-size:clamp(19px,5.3vw,26px)}.control.hint{background:linear-gradient(#88cfad,#5eae8e);color:white}.control:disabled{opacity:.46}.control:active{transform:translateY(2px)}
.mode{display:none!important}.overlay{position:absolute;inset:0;z-index:30;display:flex;justify-content:center;align-items:center;background:#2d1c176b;padding:18px}.overlay[hidden]{display:none}.dialog{background:#fff3df;border:4px solid white;border-radius:24px;text-align:center;padding:23px 17px;width:min(330px,100%);box-shadow:0 12px 0 #815a37,0 19px 30px #0005}.dialog h2{margin:0;color:#ae743b}.dialog p{font-size:14px;line-height:1.7}.dialog button{border:0;border-radius:14px;background:#70b38d;color:white;font-weight:900;padding:13px 20px}.timing{position:relative;margin:14px 0;height:22px;border-radius:20px;background:linear-gradient(90deg,#e98785 0 35%,#eec46b 35% 44%,#80c996 44% 56%,#eec46b 56% 65%,#e98785 65%)}.timing i{position:absolute;top:-5px;left:50%;width:5px;height:32px;border-radius:4px;background:#5d3427}
@media(max-height:740px){.wallWrap{top:27%;bottom:16%}.panel{padding:6px}.tipbar{top:calc(env(safe-area-inset-top) + 81px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
 .hold[data-goal="true"]:after{content:"🏁";position:absolute;top:-16px;left:39%;font-size:20px;filter:drop-shadow(1px 2px 2px #0004)} </style></head><body><main class="app"><header class="hud"><div class="panel"><div class="tiny">⛰️ STAGE</div><div class="big stageTitle" id="stageLabel">STAGE 01</div><div class="sub" id="stageDesc">첫 홀드, 첫 선택</div></div><div class="panel moves"><div class="tiny">🐾 이동</div><div class="big" id="moveLabel">0 / 4</div><div class="sub">⭐ 목표 이동 횟수</div></div><div class="panel"><div class="tiny">균형 <span id="balanceText" style="float:right">안정</span></div><div class="meter"><i class="needle" id="needle"></i></div><div class="sub">왼쪽 ◀　▶ 오른쪽</div></div></header><div class="tipbar"><div class="pill tiptext" id="tip">빛나는 홀드를 눌러 등반을 시작해요!</div><div class="pill gripText" id="grip">✊ 그립 ❤️❤️❤️</div></div><div class="wallWrap"><section class="wall" id="wall" aria-label="클라이밍 게임판"><div class="flag">🚩</div><div id="holds"></div><div class="bear" id="bear"><img src="assets/characters/bear_pose_0.png" alt="등반하는 곰돌이"></div></section></div><footer class="footer"><button class="control" id="reset"><span class="symbol">⟳</span>다시하기</button><button class="control" id="undo"><span class="symbol">↶</span>되돌리기</button><button class="control hint" id="hint"><span class="symbol">💡</span>힌트</button><button class="control" id="next"><span class="symbol">☰</span>스테이지</button><button class="control" id="settings"><span class="symbol">⚙️</span>설정</button></footer><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="timing" id="timingTrack" hidden><i id="cursor"></i></div><button id="dialogAction">확인</button></div></div></main><script src="game.js"></script></body></html>
