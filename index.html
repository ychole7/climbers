<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#bb8a61"><title>영차영차 등반대 · FLOW LAB</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{background:#694e3d;color:#66452d;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;user-select:none;touch-action:none}button{font:inherit;cursor:pointer;touch-action:manipulation}.game{width:min(100%,470px);height:100dvh;min-height:520px;position:relative;margin:auto;overflow:hidden;background:#ddc5a5 url('assets/scenery/gym-art.webp') center/100% 100% no-repeat}.game:before{content:"";position:absolute;inset:0;background:linear-gradient(#38200e85,transparent 24%,transparent 75%,#47290f50);pointer-events:none}.hud{position:absolute;z-index:9;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.stat{background:linear-gradient(#fffdf1,#f5dabb);border:2px solid #fff9e8;box-shadow:0 4px 0 #a77751,0 5px 10px #0003;border-radius:15px;text-align:center;padding:6px 4px;min-height:63px}.stat small{display:block;font-size:10px;font-weight:850;color:#9a765b}.stat strong{font-size:20px;font-weight:950}.progress{position:absolute;top:calc(84px + env(safe-area-inset-top));left:12px;right:12px;height:9px;background:#704b38a8;border:2px solid #ffffffb8;border-radius:10px;z-index:9;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#ffd97b,#8decb7);border-radius:8px}.board{position:absolute;top:16%;bottom:17%;left:6%;right:6%;overflow:hidden;z-index:2}.track{position:absolute;inset:0;pointer-events:none}.track:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#fff7e455 50%,transparent 50.3%);opacity:.5}.hold{position:absolute;width:clamp(66px,23vw,104px);height:clamp(66px,23vw,104px);transform:translate(-50%,-50%);filter:drop-shadow(3px 6px 3px #4b301b75)}.hold img{width:100%;height:100%;object-fit:contain}.hold .honey{position:absolute;top:0;right:0;font-size:24px;filter:drop-shadow(0 2px 2px #764321)}.hold .danger{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;white-space:nowrap;background:#a73f38;color:#fff;padding:3px 5px;border-radius:8px}.hold.chosen{filter:drop-shadow(0 0 8px #97ffc2) drop-shadow(3px 6px 3px #4b301b80)}.hold.chosen:before{content:"";position:absolute;inset:10%;border:3px solid #8cf0ac;border-radius:50%;animation:pulse 1s infinite}.catch{position:absolute;left:3%;right:3%;top:69%;height:2px;border-top:3px dashed #fff7d7b0;opacity:.55}.bear{position:absolute;z-index:4;top:68%;left:28%;width:clamp(84px,28%,125px);aspect-ratio:210/266;transform:translate(-50%,-52%);filter:drop-shadow(5px 9px 5px #523622a6);transition:left .18s ease-out}.bear img{width:100%;height:100%;object-fit:contain;transform-origin:50% 70%;animation:climb .44s ease-in-out infinite alternate}.bear.jump img{animation:jump .37s ease-out}.bear.hurt img{animation:hurt .33s}.aim{position:absolute;top:50%;left:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff8ba;opacity:0}.message{position:absolute;top:calc(102px + env(safe-area-inset-top));left:8%;right:8%;z-index:7;text-align:center;color:#fff9dc;font-weight:950;font-size:15px;text-shadow:0 2px 2px #5b3522,0 0 7px #5b3522;pointer-events:none;min-height:26px}.pop{animation:pop .3s}.controls{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:9px;right:9px;z-index:10;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}.ctrl{height:69px;background:linear-gradient(#fffaf0,#edcda5);border:3px solid #fff9e9;border-radius:19px;box-shadow:0 5px 0 #98643c;color:#69472f;font-size:16px;font-weight:950;touch-action:none}.ctrl b{font-size:25px;display:block}.ctrl.active{background:linear-gradient(#a9e2ae,#69b88b);color:#fff}.ctrl.jumpbtn{background:linear-gradient(#ffd475,#ee9450);color:#fff;border-color:#fff1b3;box-shadow:0 5px 0 #b36935}.ctrl.jumpbtn.ready{animation:alert .55s infinite alternate}.ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 #98643c}.timing{position:absolute;bottom:calc(91px + env(safe-area-inset-bottom));left:17%;right:17%;z-index:8;height:17px;background:linear-gradient(90deg,#b95c5c 0 28%,#f3cb63 28% 40%,#7fe39e 40% 60%,#f3cb63 60% 72%,#b95c5c 72%);border:2px solid #fff9e4;border-radius:20px;opacity:.95;box-shadow:0 2px 8px #5035256b}.timing i{position:absolute;left:50%;top:-5px;height:23px;width:5px;background:#fff;border:1px solid #603b2a;border-radius:5px;box-shadow:0 0 5px #0006}.overlay{position:absolute;z-index:30;inset:0;background:#29170cc4;display:flex;align-items:center;justify-content:center;padding:20px}.overlay[hidden]{display:none}.dialog{background:linear-gradient(#fff9e9,#f1ddbc);border:4px solid #fff9ed;border-radius:24px;padding:22px 18px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 0 #9b6d4b}.dialog h1{font-size:25px;margin:0 0 8px}.dialog p{font-size:14px;line-height:1.65}.dialog button{padding:13px 24px;border:0;border-radius:14px;background:#67b78c;color:white;font-weight:950;font-size:17px;box-shadow:0 4px 0 #41785b;width:100%;margin-top:10px}.tips{font-size:12px;background:#fff5de;border-radius:12px;padding:10px;text-align:left;line-height:1.7}.flash{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0}.flash.good{animation:flashgreen .36s}.flash.bad{animation:flashred .35s}.floatfx{position:absolute;z-index:12;left:50%;top:43%;font-size:28px;color:#fff;font-weight:950;text-shadow:0 3px 0 #8c5d37;transform:translateX(-50%);animation:rise .9s forwards;pointer-events:none;white-space:nowrap}.summary{font-size:14px;font-weight:850;margin:12px 0}.tiny{font-size:11px;color:#9b7455} @keyframes climb{to{transform:translateY(-8px) rotate(3deg)}}@keyframes jump{0%{transform:scale(.85) translateY(10px)}50%{transform:scale(1.15) translateY(-30px)}100%{transform:scale(1)}}@keyframes hurt{25%{transform:rotate(-16deg) translateY(10px)}75%{transform:rotate(12deg) translateY(15px)}}@keyframes pulse{50%{opacity:.2}}@keyframes pop{50%{transform:scale(1.06)}}@keyframes rise{to{opacity:0;transform:translate(-50%,-65px)}}@keyframes flashgreen{40%{background:#9effb754;opacity:1}}@keyframes flashred{40%{background:#e3333d50;opacity:1}}@keyframes alert{to{filter:brightness(1.23);transform:scale(1.035)}}
</style></head><body><main class="game" id="game"><div class="hud"><div class="stat"><small>🏔️ 등반</small><strong id="height">0%</strong></div><div class="stat"><small>🔥 콤보</small><strong id="combo">0</strong></div><div class="stat"><small>❤️ 하트 · 🍯 꿀</small><strong id="health">♥♥♥ · 0</strong></div></div><div class="progress"><div id="prog"></div></div><div class="message" id="msg">준비!</div><div class="board" id="board"><div class="track" id="track"></div><div class="catch"></div><div class="bear" id="bear"><img src="assets/characters/bear_pose_0.png" id="bearimg" alt="클라이밍 중인 곰돌이"></div></div><div class="timing" id="timing"><i id="needle"></i></div><div class="controls"><button class="ctrl active" id="left"><b>◀</b>왼쪽</button><button class="ctrl" id="right"><b>▶</b>오른쪽</button><button class="ctrl jumpbtn" id="grab"><b>✊</b>타이밍 잡기</button></div><div class="flash" id="flash"></div><div class="overlay" id="overlay"><section class="dialog" id="dialog"><h1>🐻 영차영차 FLOW</h1><p><b>멈추지 않고 올라가는 35초 클라이밍!</b><br>이번엔 퍼즐보다 리듬과 아슬아슬한 순간을 테스트하자.</p><div class="tips">◀ ▶ 좌우 라인을 바꿔 안전한 홀드 선택<br>⚡ 빨간 홀드에 닿기 직전 <b>타이밍 잡기</b><br>🍯 꿀을 챙기고 콤보를 이어가기<br>❤️ 3번 실수하면 도전 종료</div><button id="start">등반 시작!</button><div class="tiny">기존 v2 게임에는 적용되지 않는 독립 테스트</div></section></div></main><script>
'use strict';
const $=id=>document.getElementById(id),TOTAL=27,DURATION=35,LANES=[28,72],CATCH=.69;let rows=[],lane=0,hearts=3,honey=0,combo=0,best=0,done=0,elapsed=0,playing=false,last=0,interval=1.19,pending=false,armed=null,windowOpen=false,quality=0,raf=0,blocked=false,missed=0;let sound=null;
function note(f=460,len=.08,kind='sine'){try{sound=sound||new(window.AudioContext||window.webkitAudioContext)();if(sound.state==='suspended')sound.resume();const o=sound.createOscillator(),g=sound.createGain(),t=sound.currentTime;o.type=kind;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g).connect(sound.destination);o.start(t);o.stop(t+len)}catch(e){}}
// Each choice has a purpose: the alternate route can provide honey, health, or a crimp challenge.
const seeded=(i)=>{let x=(i*9301+49297)%233280;return x/233280};
function makeRows(){rows=[];for(let i=0;i<TOTAL;i++){let a={i,passed:false,el:[],holds:[]};for(let l=0;l<2;l++){let n=(i*7+l*11)%9,kind='jug';if(i>2&&n===1)kind='crimp';else if(i>3&&n===4)kind='sloper';else if(n===6)kind='volume';a.holds.push({kind,honey:i>2&&(i*3+l*7)%7===0,heal:kind==='volume'})}if(i%5===3&&i>2){a.holds[0]={kind:'crimp',honey:true};a.holds[1]={kind:'jug',honey:false}}if(i%6===5){a.holds[0]={kind:'volume',heal:true};a.holds[1]={kind:'crimp',honey:true}}rows.push(a)} }
function build(){const track=$('track');track.replaceChildren();rows.forEach(r=>r.holds.forEach((h,l)=>{const e=document.createElement('div');e.className='hold';e.style.left=LANES[l]+'%';e.innerHTML=`<img draggable="false" src="assets/holds/${h.kind}.png" alt="">${h.honey?'<span class="honey">🍯</span>':''}${h.kind==='crimp'?'<span class="danger">⚡ 타이밍</span>':''}`;track.append(e);r.el[l]=e}));}
function announce(t){const e=$('msg');e.textContent=t;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function effect(t,good=true){const p=document.createElement('div');p.className='floatfx';p.textContent=t;$('game').append(p);setTimeout(()=>p.remove(),950);const f=$('flash');f.className='flash '+(good?'good':'bad');setTimeout(()=>f.className='flash',370)}
function setLane(v){if(!playing)return;lane=Math.max(0,Math.min(1,v));$('bear').style.left=LANES[lane]+'%';$('bearimg').src=`assets/characters/bear_pose_${lane===0?2:1}.png`;$('left').classList.toggle('active',lane===0);$('right').classList.toggle('active',lane===1);note(290+lane*90,.04)}
$('left').onpointerdown=e=>{e.preventDefault();setLane(0)};$('right').onpointerdown=e=>{e.preventDefault();setLane(1)};
// A timing press is accepted only in a readable window around the next red hold.
function attempt(){if(!playing)return;const r=rows.find(x=>!x.passed);if(!r||r.holds[lane].kind!=='crimp'){announce('⚡ 빨간 크림프에서 사용!');return}const phase=elapsed/interval-r.i;const distance=Math.abs(1-phase);if(distance>.36){announce('조금 더 가까워졌을 때!');return}armed={row:r.i,lane,delta:distance};quality=distance<.12?2:distance<.24?1:0;note(quality===2?980:520,.12,'triangle');announce(quality===2?'✨ PERFECT 준비!':quality===1?'GOOD!':'아슬아슬!')}
$('grab').onpointerdown=e=>{e.preventDefault();attempt()};
let sx=0;const board=$('board');board.addEventListener('pointerdown',e=>{sx=e.clientX});board.addEventListener('pointerup',e=>{if(!playing)return;const dx=e.clientX-sx;if(Math.abs(dx)>28)setLane(dx>0?1:0);else setLane(e.clientX<board.getBoundingClientRect().left+board.clientWidth/2?0:1)});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')setLane(0);if(e.key==='ArrowRight'||e.key==='d')setLane(1);if(e.key===' '){e.preventDefault();attempt()}});
function process(r){r.passed=true;const h=r.holds[lane];let ok=true;if(h.kind==='crimp'){ok=!!armed&&armed.row===r.i&&armed.lane===lane&&armed.delta<.30;armed=null}else if(h.kind==='sloper'){ok=combo<7||lane===r.i%2;/* higher combos ask for deliberate switching */}if(ok){combo++;best=Math.max(best,combo);if(h.honey){honey++;effect('🍯 +1')}else if(combo%5===0){effect('🔥 '+combo+' COMBO!')}if(h.heal&&hearts<3){hearts++;announce('💚 볼륨에서 하트 회복!')}else if(h.kind==='crimp'){effect('⚡ PERFECT!');$('bear').classList.add('jump');setTimeout(()=>$('bear').classList.remove('jump'),400)}else if(combo%3===0)note(610+combo*12,.075);done++}else{hearts--;combo=0;missed++;effect('💔 앗!',false);$('bear').classList.add('hurt');setTimeout(()=>$('bear').classList.remove('hurt'),400);announce('놓쳤다! 다음 홀드에 집중!');note(180,.25,'sawtooth');done++}if(hearts<=0)finish(false);}
function render(){const nowIndex=elapsed/interval;let imminent=rows[Math.floor(nowIndex)]||null;const h=imminent?.holds[lane];const crimp=!!h&&h.kind==='crimp'&&Math.abs(Math.ceil(nowIndex)-nowIndex)<.35; // catch occurs when index crosses row+1
$('grab').classList.toggle('ready',crimp);$('grab').innerHTML=`<b>${crimp?'⚡':'✊'}</b>${crimp?'지금 잡기!':'타이밍 잡기'}`;const phase=nowIndex-Math.floor(nowIndex);$('needle').style.left=(50+47*Math.sin(phase*Math.PI*2))+'%';
const boardH=board.clientHeight;rows.forEach(r=>{const y=(CATCH+(r.i+1-nowIndex)*.32)*boardH;for(let l=0;l<2;l++){const e=r.el[l];e.style.top=y+'px';e.style.display=y< -65||y>boardH+65?'none':'';e.classList.toggle('chosen',r.i===Math.floor(nowIndex)&&l===lane)}});
$('height').textContent=Math.min(100,Math.round(done/TOTAL*100))+'%';$('combo').textContent=combo;$('health').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts)+' · '+honey;$('prog').style.width=(done/TOTAL*100)+'%';}
function frame(t){if(!playing)return;if(!last)last=t;let dt=Math.min(.05,(t-last)/1000);last=t;elapsed+=dt;while(playing&&Math.floor(elapsed/interval)>done&&done<TOTAL){process(rows[done]);}if(!playing)return;render();if(done>=TOTAL||elapsed>=DURATION)finish(true);else raf=requestAnimationFrame(frame)}
function finish(success){playing=false;cancelAnimationFrame(raf);const star=success?(missed===0&&honey>=4?3:honey>=2?2:1):0;$('overlay').hidden=false;$('dialog').innerHTML=`<h1>${success?'🏔️ 정상 정복!':'🐻 앗, 떨어졌어!'}</h1><div style="font-size:33px">${'⭐'.repeat(star)}${'☆'.repeat(3-star)}</div><p class="summary">진행 ${Math.round(done/TOTAL*100)}% · 🍯 ${honey}개<br>최고 콤보 🔥 ${best} · 실수 ${missed}회</p><p>${success?'빠르고 안전하게, 꿀까지 모으면 3성!':'괜찮아! 다음에는 안전한 라인을 선택해 봐.'}</p><button id="again">다시 등반하기</button><div class="tiny">이 실험판은 기존 v2 저장 기록을 변경하지 않아.</div>`;$('again').onclick=start;}
function start(){cancelAnimationFrame(raf);makeRows();build();hearts=3;honey=0;combo=0;best=0;done=0;missed=0;elapsed=0;last=0;armed=null;lane=0;playing=true;$('overlay').hidden=true;$('bear').style.left=LANES[0]+'%';$('bearimg').src='assets/characters/bear_pose_2.png';$('left').classList.add('active');$('right').classList.remove('active');announce('출발! 안전한 홀드를 골라!');raf=requestAnimationFrame(frame)}$('start').onclick=start;
render();
</script></body></html>
