<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="game-build" content="v3-wind-surf-landing-feel">
<title>둥실둥실 낙하대</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,flowers=[];
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  flowers=[];for(let i=0;i<Math.ceil(W/14);i++)flowers.push({x:Math.random()*W,y:Math.random()*60+18,c:['#fff','#ffd6e8','#ffe066','#c9b8ff'][i%4]});
}
addEventListener('resize',resize);resize();

const WORLD=4200,GROUND=WORLD-90,MAXALT=1200,PLANE_Y=170,START_Y=PLANE_Y-16,BONUS_ALT=350;
const OL='#4a3a33';
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeOut=p=>1-(1-p)*(1-p);
const CHARS=[
  {name:'토토',kind:'bunny',body:'#fff4f0',ear:'#ffc4d0',chute:['#ff8fab','#fff3b0']},
  {name:'삐약',kind:'chick',body:'#ffe27a',ear:'#ffb347',chute:['#7ed6a7','#ffffff']},
  {name:'몽이',kind:'bear',body:'#dcae80',ear:'#b5835a',chute:['#7ab8ff','#ffd6e8']}
];

// ---------- 사운드 ----------
let AC=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}
function sfx(f,d=.12,type='sine',v=.15,slide=0){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d);
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- 안전 개산 고도(실제 물리로 계산) ----------
function surfToAlt(px){return px/(GROUND-22-START_Y)*MAXALT}
const DANGER_ALT=(()=>{
  for(let d=0;d<3000;d+=5){
    let y=0,vy=680,c=0;const dt=1/60;
    while(y<d){c=Math.min(1,c+dt/.6);const tv=680-585*easeOut(c);vy+=(tv-vy)*Math.min(1,(3+5*c)*dt);y+=vy*dt}
    if(vy<190)return Math.round(surfToAlt(d));
  }return 300;
})();

// ---------- 상태 ----------
let G={stage:1,jump:0,total:0,phase:'title'};
let P,plane,target,wind,stars=[],birds=[],clouds=[],parts=[],popups=[];
let camY=0,t=0;
const input={down:false,x:0,y:0,startX:0,startY:0,flare:0,left:false,right:false};
for(let i=0;i<8;i++)clouds.push({x:Math.random()*400,y:Math.random()*800,s:rnd(.6,1.3)});

function newJump(){
  const s=G.stage,ch=CHARS[G.jump%3];
  const dir=Math.random()<.5?1:-1;
  plane={x:dir>0?-90:W+90,y:PLANE_Y,vx:dir*(150+s*12)};
  wind={v:(Math.random()<.5?-1:1)*Math.min(20+s*18,130)*rnd(.4,1)};
  const tw=Math.max(150-s*12,70);
  target={x:W*rnd(.25,.75),w:tw,vx:s>=2?(35+s*8)*(Math.random()<.5?-1:1):0};
  P={x:plane.x,y:START_Y,vx:0,vy:0,ch,state:'plane',chute:0,openAlt:null,stars:0,rot:0,bank:0,spin:0,flare:0,flareGood:false,landT:0,result:null};
  stars=[];for(let i=0;i<10+s*2;i++)stars.push({x:rnd(30,W-30),y:rnd(600,GROUND-500),got:false});
  birds=[];if(s>=2)for(let i=0;i<Math.min(s,6);i++)birds.push({x:Math.random()*W,y:rnd(900,GROUND-500),vx:rnd(60,120)*(Math.random()<.5?-1:1),hit:false});
  clouds=[];for(let i=0;i<16;i++)clouds.push({x:Math.random()*W,y:rnd(260,GROUND-600),s:rnd(.6,1.4)});
  camY=0;G.phase='play';
}
function alt(y){return Math.max(0,Math.round(surfToAlt(GROUND-22-y)))}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-160,160),vy:rnd(-260,-40),life:rnd(.4,.8),c,s:rnd(2,4)})}
function pop(text,x,y,col,size=22){popups.push({text,x,y,col,size,t:0})}

function jump(){P.state='fall';P.vx=plane.vx*.5;P.vy=-140;sfx(520,.15,'triangle',.15,300);pop('뛰어내려!',P.x,P.y-camY-40,'#4a3a33',22)}
function openChute(){P.state='chute';P.openAlt=alt(P.y);sfx(300,.25,'sine',.18,500);buzz(20);
  if(P.openAlt<BONUS_ALT)pop(P.openAlt<DANGER_ALT?'늦었다?!':'과감해!',P.x,P.y-camY-90,'#ff9f1c',24)}

function land(){
  P.touchSpeed=P.vy;
  const s=P.state==='chute'&&P.vy<190;
  const d=Math.abs(P.x-target.x);
  const soft=s&&P.flareGood&&P.vy<120;
  let acc=0,label;
  if(!s)label='꽈당!';
  else if(d<target.w*.14){acc=100;label='퍼펙트!'}
  else if(d<target.w*.5){acc=60;label='좋아요!'}
  else if(d<target.w*.5+18){acc=30;label='아슬아슬!'}
  else label='풀밭 착지';
  const bold=(s&&acc>0&&P.openAlt<BONUS_ALT)?Math.round((BONUS_ALT-P.openAlt)/(BONUS_ALT-DANGER_ALT)*100):0;
  const starPts=P.stars*10;
  const pts=s?acc+Math.min(bold,100)+starPts+(soft&&acc>0?20:0):Math.floor(starPts/2);
  P.result={safe:s,soft,softPts:soft&&acc>0?20:0,acc,bold:Math.min(bold,100),starPts,pts,label,onMat:s&&acc>0};
  P.state='landed';P.vx=0;P.vy=0;P.landT=0;G.total+=pts;
  if(!s){sfx(160,.35,'sawtooth',.12,-100);buzz(120);burst(P.x,P.y+18,'#a0794f',14)}
  else if(acc===100){[660,880,1100].forEach((f,i)=>setTimeout(()=>sfx(f,.18,'triangle',.14),i*90));burst(P.x,P.y,'#ffd84d',soft?30:20);buzz(soft?55:40);if(soft)pop('사뿐! +20',P.x,P.y-camY-55,'#ff8fab',22)}
  else{sfx(soft?780:660,.15,'triangle',.12);burst(P.x,P.y+10,soft?'#ffe9a8':'#ffffff',soft?20:10);if(soft&&acc>0)pop('사뿐! +20',P.x,P.y-camY-55,'#ff8fab',22)}
}
function next(){G.jump++;if(G.jump%3===0)G.stage++;newJump()}

// ---------- 업데이트 ----------
function update(dt){
  t+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
  for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<1.1);
  if(G.phase!=='play')return;
  plane.x+=plane.vx*dt;
  if(P.state==='plane'){
    if(plane.vx>0&&plane.x>W+90)plane.x=-90;if(plane.vx<0&&plane.x<-90)plane.x=W+90;
    P.x=plane.x;P.y=START_Y;
  }
  if(target.vx){target.x+=target.vx*dt;const m=target.w/2+14;if(target.x<m){target.x=m;target.vx*=-1}if(target.x>W-m){target.x=W-m;target.vx*=-1}}
  for(const b of birds){b.x+=b.vx*dt;if(b.x<-40)b.x=W+40;if(b.x>W+40)b.x=-40}

  if(P.state==='fall'||P.state==='chute'){
    let steer=(input.right?1:0)-(input.left?1:0);
    if(input.down)steer=P.state==='chute'?clamp((input.x-input.startX)/68,-1,1):clamp((input.x-P.x)/50,-1,1);
    if(P.state==='fall'){
      P.vy=Math.min(P.vy+950*dt,680);
      P.vx+=(steer*950+wind.v*.5-P.vx*1.6)*dt;P.vx=clamp(P.vx,-290,290);
      P.bank+=(steer-P.bank)*Math.min(1,dt*8);
    }else{
      P.chute=Math.min(1,P.chute+dt/.6);const e=easeOut(P.chute);
      const pullDown=input.down?clamp((input.y-input.startY-22)/48,0,1):0;
      P.flare+=(pullDown-P.flare)*Math.min(1,dt*10);
      if(P.flare>.45&&alt(P.y)<90&&alt(P.y)>12)P.flareGood=true;
      const tv=680-585*e-72*P.flare;P.vy+=(tv-P.vy)*Math.min(1,(3+5*P.chute+2*P.flare)*dt);
      P.bank+=(steer-P.bank)*Math.min(1,dt*(steer===0?2.8:4.5));
      P.vx+=(P.bank*610+wind.v*1.3*e-P.vx*1.35)*dt;P.vx=clamp(P.vx,-240,240);
    }
    P.spin*=Math.pow(.05,dt);
    P.rot+=((P.state==='fall'?steer*.35:P.bank*.3+P.vx/650)-P.rot)*Math.min(1,5*dt);
    P.x+=P.vx*dt;P.y+=P.vy*dt;
    if(P.x<16){P.x=16;P.vx=Math.abs(P.vx)*.4}if(P.x>W-16){P.x=W-16;P.vx=-Math.abs(P.vx)*.4}
    for(const s of stars)if(!s.got&&Math.hypot(s.x-P.x,s.y-P.y)<32){s.got=true;P.stars++;sfx(880+P.stars*40,.1,'triangle',.12);burst(s.x,s.y,'#ffd84d',8);pop('+10',s.x,s.y-camY-56,'#ffb300',18)}
    for(const b of birds)if(!b.hit&&Math.hypot(b.x-P.x,b.y-P.y)<34){b.hit=true;P.vx+=Math.sign(b.vx)*260;P.vy*=.8;P.spin=1;sfx(300,.2,'square',.08,-150);buzz(30);pop('앗!',P.x,P.y-camY-40,'#ff6b6b',24)}
    const surf=GROUND-22-((target.vx&&Math.abs(P.x-target.x)<target.w*.5+18)?16:0);
    if(P.y>=surf){P.y=surf;land()}
    camY=clamp(P.y-H*.38,0,WORLD-H);
  }else if(P.state==='landed'){
    P.landT+=dt;P.chute=Math.max(0,P.chute-dt*2);
    if(P.result.onMat&&target.vx)P.x+=target.vx*dt;
  }
}

// ---------- 그리기 도우미 ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align='center',stroke=true){
  ctx.font=`800 ${size}px -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function ell(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}

function drawChar(x,y,ch,o={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(o.scale||1,o.scale||1);if(o.squish)ctx.scale(1.35,.6);
  const arms={fall:[[14,0,28,-8]],chute:[[12,-6,16,-28]],down:[[13,4,20,14]],cheer:[[12,-4,22,-22]]}[o.arms||'down'][0];
  for(const sx of[-1,1]){
    ctx.lineCap='round';ctx.lineWidth=9;ctx.strokeStyle=OL;ctx.beginPath();ctx.moveTo(sx*arms[0],arms[1]);ctx.lineTo(sx*arms[2],arms[3]);ctx.stroke();
    ctx.lineWidth=5.5;ctx.strokeStyle=ch.body;ctx.stroke();
  }
  ell(-7,17,6,4,ch.ear,OL);ell(7,17,6,4,ch.ear,OL);
  if(ch.kind==='bunny'){for(const sx of[-1,1]){ctx.save();ctx.translate(sx*8,-26);ctx.rotate(sx*.15);ell(0,0,5.5,13,ch.body,OL);ell(0,1,2.5,8,ch.ear);ctx.restore()}}
  if(ch.kind==='bear'){for(const sx of[-1,1]){ell(sx*13,-13,7,7,ch.body,OL);ell(sx*13,-13,3.5,3.5,ch.ear)}}
  if(ch.kind==='chick'){ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-18);ctx.quadraticCurveTo(-6,-28,0,-26);ctx.quadraticCurveTo(4,-30,3,-18);ctx.stroke()}
  ell(0,0,18,18,ch.body,OL);
  const f=o.face||'happy';ctx.fillStyle=OL;ctx.strokeStyle=OL;ctx.lineWidth=2;
  if(f==='dizzy'){for(const sx of[-6,6]){ctx.beginPath();ctx.moveTo(sx-3,-5);ctx.lineTo(sx+3,1);ctx.moveTo(sx+3,-5);ctx.lineTo(sx-3,1);ctx.stroke()}}
  else if(f==='wow'){for(const sx of[-6,6]){ell(sx,-2,3.3,3.8,OL);ell(sx+1,-3.2,1.1,1.1,'#fff')}}
  else{for(const sx of[-6,6])ell(sx,-2,2.4,2.8,OL)}
  ell(-11,5,3.5,2.2,'rgba(255,120,150,.45)');ell(11,5,3.5,2.2,'rgba(255,120,150,.45)');
  if(ch.kind==='chick'){ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(-4,3);ctx.lineTo(4,3);ctx.lineTo(0,8);ctx.closePath();ctx.fill()}
  else if(f==='wow'){ell(0,6,2.6,3.2,OL)}
  else{ctx.beginPath();ctx.arc(-2,5,2,0,Math.PI);ctx.arc(2,5,2,0,Math.PI);ctx.stroke()}
  ctx.restore();
}
function drawChute(x,y,p,ch,rot,scale=1){
  if(p<=0)return;const e=easeOut(p);ctx.save();ctx.translate(x,y);ctx.rotate(rot*.6);
  ctx.scale(scale,scale);const R=58*e,cy=-28-58*e;
  ctx.strokeStyle='rgba(74,58,51,.55)';ctx.lineWidth=1.2;
  for(const k of[-1,-.45,.45,1]){ctx.beginPath();ctx.moveTo(Math.sign(k)*15,-26);ctx.lineTo(k*R,cy);ctx.stroke()}
  const n=6;
  for(let i=0;i<n;i++){const a0=Math.PI+i*Math.PI/n,a1=a0+Math.PI/n;ctx.beginPath();ctx.moveTo(0,cy);ctx.arc(0,cy,R,a0,a1);ctx.closePath();ctx.fillStyle=ch.chute[i%2];ctx.fill()}
  ctx.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(-R+R/n+i*2*R/n,cy,R/n,0,Math.PI);ctx.fill()}
  ctx.beginPath();ctx.arc(0,cy,R,Math.PI,0);ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();
  ell(0,cy-R,4*e,4*e,ch.chute[0],OL);
  ctx.restore();
}
function drawPlane(x,y,dir){
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.lineWidth=2;ctx.strokeStyle=OL;
  ctx.fillStyle='#ffb3c4';ctx.beginPath();ctx.moveTo(-50,-2);ctx.lineTo(-66,-30);ctx.lineTo(-44,-30);ctx.lineTo(-30,-4);ctx.closePath();ctx.fill();ctx.stroke();
  rr(-62,-14,120,32,16);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffb3c4';rr(-62,4,120,14,7);ctx.fill();
  for(let i=0;i<3;i++)ell(-22+i*20,-2,5,5,'#bfe6ff',OL);
  ell(-6,14,30,7,'#ffd6e0',OL);
  ell(60,1,4,4,'#ffb3c4',OL);
  ctx.fillStyle='rgba(120,120,120,.5)';const s=Math.abs(Math.sin(t*40));ell(64,1,3,20*s+4);
  ctx.restore();
}
function drawCloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(255,255,255,.88)';
  ctx.beginPath();ctx.arc(-26,6,18,0,7);ctx.arc(0,-4,26,0,7);ctx.arc(28,6,18,0,7);ctx.rect(-26,6,54,18);ctx.fill();ctx.restore()}
function drawStar(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr2=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}
  ctx.closePath();ctx.fillStyle='#ffd84d';ctx.fill();ctx.strokeStyle='#e0a800';ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}
function drawBird(b,sy){ctx.save();ctx.translate(b.x,sy);ctx.scale(b.vx>0?1:-1,1);
  ell(0,0,13,10,'#8ec5ff',OL);const w=Math.sin(t*18)*6;ell(-2,-4-w*.5,7,4+Math.abs(w)*.4,'#c9e4ff',OL);
  ell(5,-2,1.8,1.8,OL);ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(18,2);ctx.lineTo(12,4);ctx.fill();ctx.restore()}

function drawGround(){
  const gy=GROUND-camY;if(gy>H+60)return;
  ctx.fillStyle='#20b9c5';ctx.fillRect(0,gy-8,W,H-gy+68);
  for(let i=0;i<5;i++){ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(i*W/4,gy+16+(i%2)*12);ctx.quadraticCurveTo(i*W/4+22,gy+8+(i%2)*12,i*W/4+48,gy+16+(i%2)*12);ctx.stroke()}
  ell(W/2,gy+30,W*.62,132,'#edcf8c');
  ell(W/2,gy+23,W*.57,118,'#79c96a');
  ell(W/2,gy+18,W*.48,95,'#8bd575');
  for(const side of[-1,1]){
    const tx=W/2+side*W*.39,ty=gy-8;
    ctx.strokeStyle='#8a6844';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tx,ty+12);ctx.lineTo(tx-side*7,ty-42);ctx.stroke();
    for(let i=0;i<4;i++){ctx.strokeStyle='#328d58';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx-side*7,ty-38);ctx.quadraticCurveTo(tx+side*(8+i*4),ty-58-i*2,tx+side*(20+i*8),ty-46+i*2);ctx.stroke()}
  }
  for(const f of flowers){ell(f.x,gy+f.y,3,3,f.c);ell(f.x,gy+f.y,1.2,1.2,'#ffcf3a')}
  // 바람자루
  const px=W-34,top=gy-58;ctx.strokeStyle='#8a6b55';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,gy);ctx.lineTo(px,top);ctx.stroke();
  const len=12+Math.abs(wind.v)/130*30,dir=Math.sign(wind.v)||1,wob=Math.sin(t*8)*2;
  for(let i=0;i<3;i++){ctx.fillStyle=i%2?'#fff':'#ff6b6b';ctx.beginPath();const a=i*len/3,b=(i+1)*len/3;
    ctx.moveTo(px+dir*a,top+i*1.2+wob*i/3);ctx.lineTo(px+dir*b,top+(i+1)*1.2+wob*(i+1)/3);ctx.lineTo(px+dir*b,top+12-(i+1)*1.2+wob*(i+1)/3);ctx.lineTo(px+dir*a,top+12-i*1.2+wob*i/3);ctx.fill()}
}
function drawTarget(){
  const gy=GROUND-camY;if(gy>H+60)return;const x=target.x,w=target.w;let my=gy-4;
  if(target.vx){
    const d=Math.sign(target.vx),leg=Math.sin(t*10)*3;
    for(const lx of[-.28,.28])ell(x+lx*w+leg*(lx>0?1:-1),gy-2,7,5,'#8fd6a0',OL);
    ell(x+d*(w*.42+10),gy-12,9,8,'#8fd6a0',OL);ell(x+d*(w*.42+13),gy-14,1.6,1.6,OL);
    ell(x,gy-10,w*.42,15,'#5fb878',OL);my=gy-20;
  }
  ell(x,my,w/2,9,'#ff8fab',OL);ell(x,my,w*.35,6.5,'#fff');ell(x,my,w*.14,3.8,'#ff5c8a');
  if(P&&P.state==='chute'&&gy<H+10){
    const flight=Math.max(0,(GROUND-22-P.y)/Math.max(P.vy,55));
    const steer=(input.right?1:0)-(input.left?1:0);
    const touchSteer=input.down?clamp((input.x-input.startX)/68,-1,1):steer;
    const drift=wind.v*1.3*easeOut(P.chute),aim=touchSteer*610+drift;
    const px=clamp(P.x+aim*flight+(P.vx-aim)*(1-Math.exp(-1.35*flight))/1.35,16,W-16);
    const tx=clamp(target.x+target.vx*flight,target.w/2,W-target.w/2);
    const miss=Math.abs(px-tx);
    const color=miss<target.w*.14?'#54bd78':miss<target.w*.5?'#f0b44b':'#ed6b70';
    ctx.save();ctx.setLineDash([4,6]);ctx.lineWidth=2;ctx.strokeStyle=color;ctx.globalAlpha=.72;
    ctx.beginPath();ctx.moveTo(P.x,P.y-camY+16);ctx.quadraticCurveTo((P.x+px)/2,(P.y-camY+gy)/2,px,gy-8);ctx.stroke();
    ctx.setLineDash([]);ctx.beginPath();ctx.ellipse(px,gy-9,12,6,0,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;txt('예상 착지',px,gy-30,12,color,'center',false);ctx.restore();
  }
}

function drawHUD(){
  const box=(x,y,w,h)=>{rr(x,y,w,h,15);ctx.fillStyle='rgba(255,248,231,.96)';ctx.fill();ctx.strokeStyle='rgba(142,99,62,.35)';ctx.lineWidth=1.5;ctx.stroke()};
  box(12,10,122,52);txt(`STAGE ${G.stage}`,22,25,15,'#a45d35','left',false);txt(`${G.jump%3+1}/3  ${P.ch.name}`,22,47,14,'#604735','left',false);
  box(W-76,10,64,52);txt(`${G.total}`,W-44,25,17,'#ef6687','center',false);txt(`★ ${P.stars}`,W-44,47,14,'#dc9d18','center',false);
  // 바람
  const wv=Math.round(Math.abs(wind.v)/13),d=Math.sign(wind.v);
  ctx.save();ctx.translate(W/2,31);rr(-51,-14,102,28,14);ctx.fillStyle='rgba(255,248,231,.96)';ctx.fill();ctx.strokeStyle='rgba(142,99,62,.3)';ctx.lineWidth=1.5;ctx.stroke();
  txt(`바람 ${wv}`,-8,1,14,'#604735','center',false);
  ctx.strokeStyle='#e89035';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(25-d*10,1);ctx.lineTo(25+d*10,1);ctx.lineTo(25+d*4,-5);ctx.moveTo(25+d*10,1);ctx.lineTo(25+d*4,7);ctx.stroke();ctx.restore();
  // 고도계
  if(P.state==='fall'||P.state==='chute'){
    const x=W-20,y0=90,y1=H-190,yy=a=>y1-a/MAXALT*(y1-y0);
    rr(x-5,y0,10,y1-y0,5);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();
    ctx.fillStyle='#ffd84d';ctx.fillRect(x-5,yy(BONUS_ALT),10,yy(DANGER_ALT)-yy(BONUS_ALT));
    ctx.fillStyle='#ff6b6b';ctx.fillRect(x-5,yy(DANGER_ALT),10,y1-yy(DANGER_ALT));
    const a=alt(P.y),my=yy(Math.min(a,MAXALT));
    ell(x,my,8,8,'#fff',OL);txt(`${a}m`,x-14,my,13,a<DANGER_ALT?'#ff4d4d':'#4a3a33','right');
  }
  // 목표 표시
  if(GROUND-camY>H-10&&P.state!=='landed'){
    const x=clamp(target.x,20,W-20),y=H-24;ell(x,y,13,6,'#ff8fab',OL);ell(x,y,5,2.4,'#ff5c8a');
    txt('목표',x,y-16,12,'#ff5c8a');
  }
}
function drawButton(){
  if(P.state==='chute'){
    const a=alt(P.y),ok=a<90&&a>12;
    const dy=input.y-input.startY,dx=input.x-input.startX;
    const hint=input.down&&dy>22?'줄 당기는 중!':input.down&&Math.abs(dx)>12?(dx<0?'왼쪽으로 기울어요':'오른쪽으로 기울어요'):ok?'착지 직전 아래로 당겨요':'좌우로 끌어 바람 타기';
    txt(hint,W/2,H-82,15,ok||dy>22?'#ff5c8a':'#4a3a33');
    if(ok){rr(W/2-44,H-57,88,7,4);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();rr(W/2-44,H-57,88*P.flare,7,4);ctx.fillStyle='#ff8fab';ctx.fill()}
    return;
  }
  if(P.state!=='fall')return;const bx=W/2,by=H-150,pulse=1+Math.sin(t*8)*.04;
  ctx.save();ctx.translate(bx,by);ctx.scale(pulse,pulse);
  ell(0,4,46,46,'rgba(0,0,0,.15)');ell(0,0,46,46,P.ch.chute[0],OL);
  ctx.beginPath();ctx.arc(0,4,24,Math.PI,0);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();
  txt('펼쳐!',0,22,14,'#4a3a33','center',false);ctx.restore();
}
function drawCard(){
  if(P.landT<.8)return;const r=P.result,a=Math.min(1,(P.landT-.8)*4);
  const cw=Math.min(W-40,300),chh=252,x=(W-cw)/2,y=H*.17+(1-a)*30;
  ctx.save();ctx.globalAlpha=a;rr(x,y,cw,chh,22);ctx.fillStyle='rgba(255,255,255,.95)';ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  txt(r.label,W/2,y+38,30,r.safe?(r.acc===100?'#ff5c8a':'#3a6fd8'):'#ff6b6b','center',false);
  const rows=r.safe?[['정확도',r.acc],['과감 보너스',r.bold],['사뿐 보너스',r.softPts],[`별 ×${P.stars}`,r.starPts]]:[['너무 늦었어요',0],[`별 ×${P.stars} (반만)`,Math.floor(r.starPts/2)]];
  rows.forEach((row,i)=>{txt(row[0],x+28,y+76+i*24,15,'#7a6a63','left',false);txt('+'+row[1],x+cw-28,y+76+i*24,15,'#4a3a33','right',false)});
  ctx.fillStyle='#eee';ctx.fillRect(x+24,y+178,cw-48,2);
  txt('합계',x+28,y+199,17,'#4a3a33','left',false);txt('+'+r.pts,x+cw-28,y+199,20,'#ff5c8a','right',false);
  if(P.landT>1.1)txt(G.jump%3===2?`스테이지 ${G.stage} 클리어! 탭 ▶`:'탭해서 다음 친구 ▶',W/2,y+chh+26,15,'#4a3a33');
  ctx.restore();
}
function drawTitle(){
  for(const c of clouds)drawCloud((c.x+t*12*c.s)%(W+120)-60,c.y%H,c.s);
  const bob=Math.sin(t*2)*8,ch=CHARS[Math.floor(t/2.5)%3];
  drawChute(W/2,H*.42+bob,1,ch,Math.sin(t*1.5)*.15,1.18);drawChar(W/2,H*.42+bob,ch,{arms:'chute',rot:Math.sin(t*1.5)*.15,scale:1.18});
  txt('둥실둥실 낙하대',W/2,H*.16,34,'#ff5c8a');
  const lines=['탭해서 비행기에서 뛰어내리기','낙하산을 펼치고 좌우로 쓸어 바람 타기','착지 직전 아래로 당겨 속도 줄이기','늦게 펼수록 보너스, 너무 늦으면 꽈당!'];
  lines.forEach((l,i)=>txt(l,W/2,H*.6+i*26,15,'#4a3a33'));
  if(Math.sin(t*5)>-.3)txt('탭하면 바로 출발!',W/2,H*.86,22,'#3a6fd8');
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6db8ff');g.addColorStop(1,'#dff4ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(G.phase==='title'){drawTitle();return}
  const hi=1-camY/(WORLD-H);ctx.fillStyle=`rgba(60,100,210,${hi*.22})`;ctx.fillRect(0,0,W,H);
  for(const c of clouds){const sy=c.y-camY;if(sy>-60&&sy<H+60)drawCloud(c.x,sy,c.s)}
  if(P.state==='fall'&&P.vy>450){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
    for(let i=0;i<7;i++){const lx=(i*97+Math.floor(t*30)*53)%W,ly=((i*131-t*900)%H+H)%H;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+40);ctx.stroke()}}
  for(const s of stars)if(!s.got){const sy=s.y-camY;if(sy>-30&&sy<H+30)drawStar(s.x,sy+Math.sin(t*3+s.x)*3,12,t)}
  for(const b of birds){const sy=b.y-camY;if(sy>-30&&sy<H+30)drawBird(b,sy)}
  drawGround();drawTarget();
  const py=PLANE_Y-camY;
  if(P.state==='plane'){drawChar(P.x,P.y-camY,P.ch,{arms:'cheer'});drawPlane(plane.x,py,Math.sign(plane.vx));
    if(Math.sin(t*5)>-.3)txt('탭해서 뛰어내리기!',W/2,H*.45,22,'#ff5c8a');}
  else{
    if(py>-60)drawPlane(plane.x,py,Math.sign(plane.vx));
    const sy=P.y-camY,rot=P.rot+P.spin*Math.sin(t*25)*.6;
    if(P.state==='landed'){
      const r=P.result;
      if(r.safe){
        const settle=Math.max(0,1-P.landT/.48),impact=clamp((P.touchSpeed-70)/240,0,1);
        if(settle>0){ctx.save();ctx.globalAlpha=settle*.42;ell(P.x,sy+17,14+(1-settle)*24,4+impact*3,null,'#fff');ctx.restore()}
        drawChute(P.x,sy,P.chute,P.ch,0,1.18);
        const hop=r.acc>0?Math.max(0,Math.sin(P.landT*9))*7*Math.max(0,1-P.landT/1.5):0;
        drawChar(P.x,sy-hop,P.ch,{arms:r.acc>0?'cheer':'down',scale:1.18,squish:settle>.78})
      }
      else{drawChar(P.x,sy+8,P.ch,{squish:true,face:'dizzy'});for(let i=0;i<3;i++){const a=t*4+i*2.1;drawStar(P.x+Math.cos(a)*20,sy-14+Math.sin(a)*5,5,a)}}
    }else{
      drawChute(P.x,sy,P.chute,P.ch,rot+(P.state==='chute'?P.bank*.28:0),1.18);
      drawChar(P.x,sy,P.ch,{rot,arms:P.state==='chute'?'chute':'fall',face:P.state==='fall'||P.spin>.3?'wow':'happy',scale:1.18});
    }
  }
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2);ell(p.x,p.y-camY,p.s,p.s,p.c)}ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=1-p.t/1.1;txt(p.text,p.x,p.y-p.t*40,p.size,p.col)}ctx.globalAlpha=1;
  drawHUD();drawButton();if(P.state==='landed')drawCard();
}

// ---------- 입력 ----------
function action(x,y){
  if(G.phase==='title'){G.stage=1;G.jump=0;G.total=0;newJump();plane.x=W/2;P.x=plane.x;jump();return true}
  if(P.state==='plane'){jump();return true}
  if(P.state==='fall'&&(x==null||Math.hypot(x-W/2,y-(H-150))<54)){openChute();return true}
  if(P.state==='landed'&&P.landT>1.1){next();return true}
  return false;
}
cv.addEventListener('pointerdown',e=>{audioInit();if(action(e.clientX,e.clientY))return;input.down=true;input.x=input.startX=e.clientX;input.y=input.startY=e.clientY;cv.setPointerCapture?.(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(input.down){input.x=e.clientX;input.y=e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{input.down=false;input.flare=0}));
addEventListener('keydown',e=>{audioInit();if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key===' '){e.preventDefault();action()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false});

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
