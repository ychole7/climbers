<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#a4754c"><title>영차영차 등반대 — 네 접점 실험</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#6d4c35;color:#674531;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;user-select:none}.app{position:relative;margin:auto;width:min(100%,450px);height:100dvh;min-height:590px;overflow:hidden;background:#d9ba92 url('assets/scenery/gym-art.webp') center/100% 100% no-repeat}.app:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#301a0f55,transparent 30%,transparent 77%,#3d28153b)}header{position:absolute;top:calc(7px + env(safe-area-inset-top));left:9px;right:9px;z-index:8;display:flex;gap:7px}.panel{flex:1;min-width:0;padding:9px;border:2px solid #fff9e8;border-radius:16px;background:#fff5df;box-shadow:0 4px 0 #a8774e;font-size:12px;font-weight:800}.panel strong{display:block;font-size:16px}.panel:nth-child(2){flex:1.3}.subtitle{font-size:11px;line-height:1.4;font-weight:600;color:#8e6b51}.stage{position:absolute;top:18%;bottom:17%;left:9%;width:82%;touch-action:none;z-index:3}.hold{position:absolute;transform:translate(-50%,-50%);width:clamp(44px,17%,74px);aspect-ratio:1;pointer-events:none;filter:drop-shadow(2px 5px 3px #39271488)}.hold.foot{width:clamp(35px,12%,55px)}.hold img{width:100%;height:100%;object-fit:contain}.hold .num{position:absolute;left:50%;top:-9px;transform:translateX(-50%);border-radius:12px;background:#fff4d9;font-size:10px;padding:1px 5px;font-weight:850;white-space:nowrap}.hold.goal .num{background:#b2eabb}.hold.candidate{filter:drop-shadow(0 0 9px #68f4a9) drop-shadow(2px 5px 3px #39271488)}.hold.selected{filter:drop-shadow(0 0 10px #ffe277)}svg#rig{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.limb{stroke:#9b653f;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:drop-shadow(2px 3px 1px #3e251a66)}.limb.arm{stroke:#bd8d64}.paw{stroke:#f6d6ad;stroke-width:3;fill:#a36b46}.socket{fill:#ffe8c2;stroke:#794c32;stroke-width:2;cursor:grab;pointer-events:auto}.socket.arm{fill:#7bd0f0}.socket.leg{fill:#ffc27d}.socket.active{stroke:#fff;stroke-width:4}.reach{fill:#74dcb8;fill-opacity:.08;stroke:#71e3ac;stroke-width:2;stroke-dasharray:5 7;pointer-events:none}.line{stroke:#d4a678;stroke-width:3;stroke-dasharray:5 6}.body{filter:drop-shadow(3px 6px 2px #46301e80)}.bearhead{fill:#b88457;stroke:#9f6d43;stroke-width:2}.bearbody{fill:#bc8c63;stroke:#92623d;stroke-width:2}.harness{fill:none;stroke:#568aaa;stroke-width:8;stroke-linecap:round}.hint{position:absolute;top:calc(94px + env(safe-area-inset-top));left:12px;right:12px;z-index:8;border:2px solid #fff9e9;background:#fff5e4e8;border-radius:14px;padding:9px 11px;font-size:12px;font-weight:800;text-align:center}.footer{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:8}.footer button{font-size:12px;font-weight:850;border:2px solid #fff9ea;border-radius:15px;background:#fff3db;box-shadow:0 4px 0 #a7774d;color:#6a4937;padding:12px 4px;min-height:52px}.footer button.primary{background:#95d3ad}.footer button:disabled{opacity:.5}.modal{position:absolute;inset:0;background:#251709a8;z-index:12;display:grid;place-items:center;padding:25px}.modal[hidden]{display:none}.dialog{padding:25px 20px;text-align:center;background:#fff3df;border:4px solid #fff;border-radius:22px;box-shadow:0 9px 0 #916543}.dialog button{border:0;background:#79b892;border-radius:13px;padding:12px 28px;font-size:16px;color:white;font-weight:850}.dialog p{line-height:1.6}
</style></head><body><main class="app"><header><div class="panel">🧗 실험 STAGE<strong>02 · 발판</strong></div><div class="panel">🐾 동작 <strong id="moves">0</strong><span class="subtitle" id="supports">4점 지지</span></div><div class="panel">🎯 목표<strong id="status">정상 홀드</strong></div></header><div class="hint" id="hint">파란 손 / 주황 발을 드래그해 홀드에 놓아 봐!</div><div class="stage" id="stage"><div id="holds"></div><svg id="rig" viewBox="0 0 360 560" preserveAspectRatio="none"></svg></div><div class="footer"><button id="restart">⟳ 다시하기</button><button id="undo">↶ 되돌리기</button><button class="primary" id="help">💡 힌트</button></div><div class="modal" id="modal" hidden><div class="dialog"><h2>🐻 완등 성공!</h2><p>손발을 직접 움직여 정상 홀드를 잡았어!<br>이제 한 판의 조작감이 재미있는지 확인해보자.</p><button id="again">다시 도전</button></div></div></main><script src="game.js"></script></body></html>
