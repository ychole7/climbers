 {name:'중앙으로 돌아와!',goal:5,help:'둥근 슬로퍼는 몸이 기울면 마찰이 부족해요. 중앙에서 자세를 바로잡으세요.',rows:5,holds:[['A',-1,1,'jug',8],['B',1,1,'jug',3],['C',0,2,'jug',0],['D',-1,2,'sloper',-8],['E',1,2,'jug',0],['F',0,3,'jug',0],['H',-1,3,'jug',0],['I',1,3,'crimp',-8],['J',0,4,'jug',4],['K',1,4,'sloper',8],['G',0,5,'goal',0]]},
 {name:'지그재그 챌린지',goal:6,help:'큰 삼각 볼륨은 발을 지지하고 몸을 안정시켜요.',rows:6,holds:[['A',-1,1,'jug',-4],['B',1,1,'jug',-8],['C',0,2,'jug',0],['D',1,2,'crimp',4],['E',-1,2,'jug',8],['F',0,3,'jug',6],['H',-1,3,'crimp',-8],['I',1,3,'jug',-7],['J',0,4,'crimp',-7],['O',0,4,'jug',-7],['K',-1,4,'sloper',5],['L',1,4,'jug',7],['M',0,5,'jug',6],['N',-1,5,'jug',-7],['G',0,6,'goal',0]]},

 {name:'볼륨을 이용하자',goal:6,help:'볼륨을 발판처럼 활용해 위험한 손잡이를 우회하세요.',rows:6,holds:[['A',-1,1,'jug',-6],['B',0,1,'jug',0],['C',1,1,'jug',7],['D',-1,2,'crimp',5],['E',0,2,'jug',-4],['F',1,2,'crimp',-6],['H',-1,3,'crimp',-8],['I',0,3,'crimp',6],['J',1,3,'jug',8],['K',-1,4,'crimp',6],['L',0,4,'volume',-7],['M',1,4,'crimp',-5],['N',-1,5,'jug',-6],['O',0,5,'jug',4],['P',1,5,'jug',6],['G',0,6,'goal',0]]},
 {name:'안전한 루트 찾기',goal:7,help:'슬로퍼와 크림프의 차이를 읽고 그립을 지켜요.',rows:7,holds:[['A',-1,1,'jug',7],['B',0,1,'jug',-6],['C',1,1,'sloper',-5],['D',-1,2,'sloper',-7],['E',0,2,'jug',8],['F',1,2,'jug',7],['H',-1,3,'jug',8],['I',0,3,'crimp',-8],['J',1,3,'sloper',-6],['K',-1,4,'jug',-6],['L',0,4,'volume',5],['M',1,4,'jug',8],['N',-1,5,'sloper',6],['O',0,5,'jug',-6],['P',1,5,'crimp',-6],['Q',-1,6,'jug',-5],['R',0,6,'jug',4],['S',1,6,'jug',6],['G',0,7,'goal',0]]},
 {name:'크림프의 유혹',goal:7,help:'손끝 크림프 지름길은 빠르지만 위험해요.',rows:7,holds:[['A',-1,1,'jug',-5],['B',0,1,'jug',5],['C',1,1,'jug',7],['D',-1,2,'crimp',7],['E',0,2,'crimp',-6],['F',1,2,'crimp',-5],['H',-1,3,'jug',-8],['I',0,3,'jug',6],['J',1,3,'jug',8],['K',-1,4,'sloper',7],['L',0,4,'crimp',-7],['M',1,4,'sloper',-8],['N',-1,5,'jug',-6],['O',0,5,'jug',4],['P',1,5,'jug',8],['Q',-1,6,'jug',8],['R',0,6,'crimp',-6],['S',1,6,'jug',-5],['G',0,7,'goal',0]]},
 {name:'정상까지 루트 읽기',goal:8,help:'4종 홀드의 모양과 균형을 읽어 정상에 도착해요!',rows:8,holds:[['A',-1,1,'jug',7],['B',0,1,'jug',-6],['C',1,1,'jug',-6],['D',-1,2,'crimp',-8],['E',0,2,'crimp',6],['F',1,2,'jug',8],['H',-1,3,'jug',8],['I',0,3,'jug',-8],['J',1,3,'sloper',-7],['K',-1,4,'sloper',-8],['L',0,4,'crimp',6],['M',1,4,'jug',8],['N',-1,5,'jug',7],['O',0,5,'jug',-6],['P',1,5,'sloper',-7],['Q',-1,6,'crimp',-7],['R',0,6,'crimp',5],['S',1,6,'jug',8],['T',-1,7,'jug',7],['U',0,7,'jug',-7],['V',1,7,'sloper',-6],['G',0,8,'goal',0]]}
];
const el=id=>document.getElementById(id);
const STORE='kkomul-alpha01';
const loadPrefs=()=>{try{return JSON.parse(localStorage.getItem(STORE+'-settings'))||{}}catch{return {}}};
let prefs=Object.assign({sound:true,haptics:true,guide:true},loadPrefs());
let soundCtx=null;
function sound(f=480,len=.09,type='sine',vol=.065){if(!prefs.sound)return;try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();const o=soundCtx.createOscillator(),g=soundCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,soundCtx.currentTime);g.gain.setValueAtTime(vol,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+len);o.connect(g);g.connect(soundCtx.destination);o.start();o.stop(soundCtx.currentTime+len)}catch{}}
function savePrefs(){try{localStorage.setItem(STORE+'-settings',JSON.stringify(prefs))}catch{}}
function buzz(seq){if(prefs.haptics&&navigator.vibrate)try{navigator.vibrate(seq)}catch{}}
function saveProgress(){try{localStorage.setItem(STORE+'-progress',JSON.stringify({stage,stars:scored}))}catch{}}
function loadProgress(){try{const p=JSON.parse(localStorage.getItem(STORE+'-progress')||'null');if(p){if(Array.isArray(p.stars))scored=p.stars.map(x=>Math.min(3,Math.max(0,Number(x)||0)));if(Number.isInteger(p.stage))stage=Math.min(levels.length-1,Math.max(0,p.stage))}}catch{}}
let history=[];let stage=0,route=[],bal=0,grip=3,busy=false,complete=false,broken=new Set(),timer=0,raf=0,pending=null,modalOpen=false,scored=[];
const current=()=>route.length?lookup(route.at(-1)):{id:'START',col:0,row:0,type:'start'};const lookup=id=>levels[stage].holds.map(a=>({id:a[0],col:a[1],row:a[2],type:a[3],offset:a[4]||0})).find(h=>h.id===id);const all=()=>levels[stage].holds.map(a=>({id:a[0],col:a[1],row:a[2],type:a[3],offset:a[4]||0}));
// Only one row ascent at a time; safe side change needs central holds; central holds reduce tilt by one.
const nextBal=h=>h.type==='volume'?0:h.col===0?(bal>0?bal-1:bal<0?bal+1:0):bal+h.col;
const candidate=h=>h.row===current().row+1 && Math.abs(h.col-current().col)<=1 && Math.abs(coords(h).x-coords(current()).x)<=42 && !broken.has(h.id);
const movingReady=()=>((performance.now()%2400)/2400)<.62;
const canSelect=h=>candidate(h)&&Math.abs(nextBal(h))<=1&&(h.type!=='sloper'||bal===0)&&!busy&&!complete&&!modalOpen;
const balanceBlocked=h=>candidate(h)&&Math.abs(nextBal(h))>1;
function refreshMoving(){for(const b of document.querySelectorAll('.hold.moving')){const ready=movingReady(),h=lookup(b.dataset.holdId);const available=h&&candidate(h)&&Math.abs(nextBal(h))<=1&&(h.type!=='sloper'||bal===0)&&!busy&&!complete&&!modalOpen;b.classList.toggle('ready',ready&&available);b.classList.toggle('reachable',ready&&available);b.setAttribute('aria-disabled',String(!ready||!available));}requestAnimationFrame(refreshMoving)}
function remember(){history.push({route:[...route],bal,grip,broken:[...broken]});if(history.length>80)history.shift();updateUndo()}
function updateUndo(){const b=el('undo');if(b)b.disabled=!history.length||busy||complete||modalOpen}
function undo(){if(!history.length||busy||complete||modalOpen)return;const state=history.pop();route=state.route;bal=state.bal;grip=state.grip;broken=new Set(state.broken);pending=null;const b=el('bear');b.className='bear';rig();place(current());draw();msg('↶ 한 단계 되돌렸어요!');updateUndo()}

const coords=h=>({x:50+h.col*29+(h.offset||0),y:90-h.row*(78/levels[stage].rows)});
function msg(s){el('toast').textContent=s}
function hud(){el('stage').textContent='STAGE '+String(stage+1).padStart(2,'0');el('stageName').textContent=levels[stage].name;el('routeCallout').textContent='🧩 '+levels[stage].name;el('moves').textContent=route.length+' / '+levels[stage].goal;el('best').textContent=route.length<=levels[stage].goal?'⭐ 목표 이동 횟수':'✨ 정상까지 계속!';el('balanceDot').style.left=(50+bal*33)+'%';el('balanceText').textContent=bal===0?'안정':bal<0?'◀ 왼쪽':'오른쪽 ▶';el('grip').textContent='♥'.repeat(grip)+'♡'.repeat(3-grip)}
function draw(){el('holds').innerHTML='';for(const h of all()){const b=document.createElement('button');b.type='button';b.className='hold '+h.type+(route.includes(h.id)?' used':'')+(broken.has(h.id)?' broken':'')+(canSelect(h)?' reachable':'')+(balanceBlocked(h)?' balance-blocked':'');b.dataset.holdId=h.id;const p=coords(h);b.style.left=p.x+'%';b.style.top=p.y+'%';b.style.setProperty('--hold-art',`url(assets/holds/${h.type==='goal'?'jug':h.type in {jug:1,crimp:1,sloper:1,volume:1}?h.type:'jug'}.png)`);const names={jug:'저그',crimp:'크림프',sloper:'슬로퍼',volume:'볼륨',goal:'정상'};b.textContent=h.type==='goal'?'★':'';b.setAttribute('aria-label',`${h.id} ${names[h.type]||h.type} 홀드`);b.setAttribute('aria-disabled',String(!canSelect(h)));b.setAttribute('title',`${names[h.type]||h.type} · ${h.id}`);b.onclick=()=>select(h);el('holds').appendChild(b)}hud();updateUndo()}

function place(h){const p=coords(h),bear=el('bear');bear.style.left=p.x+'%';bear.style.top=`calc(${p.y}% + 43px)`;bear.style.rotate=(bal*9)+'deg';const sh=el('bearShadow');sh.style.left=`calc(${p.x}% - 28px)`;sh.style.top=`calc(${p.y}% + 5px)`;scheduleLimbs()}

// V7: four-point climbing rig. Hands reach one after another; feet push off the previous hold.
// The route, balance, grip, and timing rules are exactly the V6 rules.
let limbFrame=0, climbStarted=0, limbOrigin=null;
function scheduleLimbs(){
 if(limbFrame)cancelAnimationFrame(limbFrame);
 const started=performance.now();
 const frame=()=>{paintLimbs();if(performance.now()-started<840||el('bear').classList.contains('grip-danger')||el('bear').classList.contains('last-chance'))limbFrame=requestAnimationFrame(frame);else limbFrame=0};
 limbFrame=requestAnimationFrame(frame);
}
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function paintLimbs(){
 const play=el('play'),bear=el('bear'),layer=el('limbLayer');if(!play||!bear||!layer)return;
 const pb=play.getBoundingClientRect(),bb=bear.getBoundingClientRect();if(!pb.width||!pb.height)return;
 const bx=bb.left+bb.width*.5-pb.left,by=bb.top+bb.height*.5-pb.top;
 const h=current(),tgt=pending||h,target=coords(tgt);
 const tx=pb.width*target.x/100,ty=pb.height*target.y/100;
 const support=coords(h),sx=pb.width*support.x/100,sy=pb.height*support.y/100;
 const hangingRisk=bear.classList.contains('grip-danger')||bear.classList.contains('last-chance');
 const moving=Boolean(pending)||bear.classList.contains('climbing');
 const phase=moving?Math.min(1,(performance.now()-climbStarted)/550):1;
 const handA=ease(phase/.47),handB=ease((phase-.18)/.51),push=ease((phase-.32)/.68);
 // Hands grab the target at slightly different times. One stays behind until the other has contact.
 const handL={x:lerp(sx-12,tx-13,handA),y:lerp(sy+2,ty+2,handA)};
 const handR={x:lerp(sx+12,tx+13,handB),y:lerp(sy+2,ty+2,handB)};
 // Toes remain supported below the body, pushing off the previous contact point during ascent.
 const footY=by+bb.height*.33,bracedY=Math.max(footY+8,Math.min(footY+30,sy+24));
 const feet=hangingRisk?[
  {sx:bx-12,sy:by+24,hx:bx-36,hy:by+bb.height*.45,bend:-15},
  {sx:bx+12,sy:by+24,hx:bx+35,hy:by+bb.height*.51,bend:15}
 ]:[
  {sx:bx-12,sy:by+24,hx:lerp(sx-19,bx-25,push),hy:lerp(bracedY,footY+24,push),bend:-15},
  {sx:bx+12,sy:by+24,hx:lerp(sx+19,bx+25,push*.75),hy:lerp(bracedY+4,footY+20,push*.75),bend:15}
 ];
 const arms=hangingRisk?[
  {sx:bx-20,sy:by+6,hx:sx-12,hy:sy+1,bend:-17},
  {sx:bx+20,sy:by+6,hx:bx+34,hy:by+53,bend:23}
 ]:[
  {sx:bx-20,sy:by+6,hx:handL.x,hy:handL.y,bend:-17},
  {sx:bx+20,sy:by+6,hx:handR.x,hy:handR.y,bend:17}
 ];
 const limbs=[...feet,...arms].map((v,i)=>{
  // Two-bone illusion: the elbow/knee bends away from the reach direction.
  const dx=v.hx-v.sx,dy=v.hy-v.sy,len=Math.max(1,Math.hypot(dx,dy));
  // Bend elbow/knee perpendicular to reach vector. On long reaches the bend becomes smaller.
  const bend=Math.max(9,Math.min(24,len*.23))*(v.bend<0?-1:1);
  const jx=(v.sx+v.hx)/2-dy/len*bend,jy=(v.sy+v.hy)/2+dx/len*bend;
  const d=`M ${v.sx.toFixed(1)} ${v.sy.toFixed(1)} L ${jx.toFixed(1)} ${jy.toFixed(1)} L ${v.hx.toFixed(1)} ${v.hy.toFixed(1)}`;
  const highlight=`M ${v.sx.toFixed(1)} ${v.sy.toFixed(1)} L ${jx.toFixed(1)} ${jy.toFixed(1)}`;
  return `<path class="limb-border" d="${d}"/><path class="limb-fill" d="${d}"/><path class="limb-highlight" d="${highlight}"/><circle class="joint" cx="${jx.toFixed(1)}" cy="${jy.toFixed(1)}" r="6"/><ellipse class="${i<2?'toe':'paw'}" cx="${v.hx.toFixed(1)}" cy="${v.hy.toFixed(1)}" rx="${i<2?9:10}" ry="8"/>`;
 }).join('');
 const contact=moving&&phase<.95?`<circle cx="${handL.x.toFixed(1)}" cy="${handL.y.toFixed(1)}" r="${(9+4*Math.sin(phase*13)**2).toFixed(1)}" fill="none" stroke="#fff8cc" stroke-width="2" opacity="${(.45+.35*Math.sin(phase*9)**2).toFixed(2)}"/>`:'';
 layer.setAttribute('viewBox',`0 0 ${pb.width} ${pb.height}`);layer.innerHTML=limbs+contact;
 bear.classList.add('contact');
}
window.addEventListener('resize',()=>scheduleLimbs());
function rig(la=0,ra=0,ll=0,rl=0){const b=el('bear');b.style.setProperty('--la',la+'deg');b.style.setProperty('--ra',ra+'deg');b.style.setProperty('--ll',ll+'deg');b.style.setProperty('--rl',rl+'deg')}
function reach(h){const b=el('bear'),dir=h.col-current().col;climbStarted=performance.now();scheduleLimbs();b.classList.add('reaching','climbing');rig(dir<0?-72:-23,dir>0?72:23,dir<0?-18:20,dir>0?18:-20)}
function v5Effect(label,kind='pop',h=current()){
 const p=coords(h),node=document.createElement('div');node.className=kind==='ring'?'v5-ring':kind==='sweat'?'v5-sweat':'v5-reaction';if(label)node.textContent=label;
 node.style.left=p.x+'%';node.style.top=`calc(${p.y}% - ${kind==='pop'?44:6}px)`;el('play').appendChild(node);setTimeout(()=>node.remove(),900);
}
function v5Feedback(label,h,kind='pop'){
 v5Effect(label,kind,h);buzz(kind==='ring'?12:[25,30,25]);sound(label.includes('PERFECT')?780:label.includes('GOOD')?620:420,.11,'triangle')
}
function v5ScreenHit(){const app=el('app');app.classList.remove('v5-shock');void app.offsetWidth;app.classList.add('v5-shock');setTimeout(()=>app.classList.remove('v5-shock'),350)}
function v5GripHit(){const g=el('grip').parentElement;g.classList.add('hit');setTimeout(()=>g.classList.remove('hit'),300)}
function v5Fail(){sound(185,.30,'sawtooth',.032);const b=el('bear');b.classList.remove('scared','reaching','climbing','grip-danger');b.classList.add('last-chance');msg('앗! 한 손으로 간신히 버티는 중!');v5Feedback('으아아! 😵',current());scheduleLimbs();v5ScreenHit();setTimeout(()=>{if(!b.classList.contains('last-chance'))return;b.classList.remove('last-chance');b.classList.add('falling');setTimeout(()=>{if(b.classList.contains('falling'))show('fail')},730)},680)}
function dust(h){const p=coords(h),e=document.createElement('div');e.className='move-dust';e.style.left=`calc(${p.x}% - 18px)`;e.style.top=`calc(${p.y}% + 18px)`;el('play').appendChild(e);setTimeout(()=>e.remove(),580)}
function wobble(note){msg(note);v5Feedback('앗! 😵',current());v5ScreenHit();const b=el('bear');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),570)}
function select(h){if(busy||complete||modalOpen)return;if(!candidate(h)){wobble('거기엔 손이 닿지 않아요! 빛나는 홀드를 찾아봐요.');return}if(h.type==='sloper'&&bal!==0){wobble('🔵 슬로퍼는 균형이 안정된 상태에서 잡아야 해요!');return}if(Math.abs(nextBal(h))>1){wobble('⚖ 균형이 무너져요! 중앙 홀드를 거쳐야 해요.');return}remember();busy=true;pending=h;climbStarted=performance.now();scheduleLimbs();if(h.type==='crimp'||h.type==='risk'){reach(h);el('bear').classList.add('scared');v5Effect('💦','sweat',h);msg('⚡ 위험한 홀드! 타이밍에 맞게 잡아보자!');showTiming();return}perform(h,'SAFE')}
function perform(h,result){climbStarted=performance.now();el('bear').classList.remove('scared','grip-danger');el('timing').classList.add('hidden');cancelAnimationFrame(raf);pending=null;const prior=route.at(-1);if(prior&&lookup(prior).type==='crumble')broken.add(prior);if(result==='MISS')grip=Math.max(0,grip-2);if(result==='GOOD')grip=Math.max(0,grip-1);if(h.type==='sloper'&&bal!==0)grip=Math.max(0,grip-1);if(h.type==='volume')grip=Math.min(3,grip+1);if(result==='PERFECT')grip=Math.min(3,grip+1);bal=nextBal(h);route.push(h.id);el('bear').classList.add('climbing');rig(h.col<0?-46:-12,h.col>0?46:12,-17,17);place(h);dust(h);draw();scheduleLimbs();if(result==='PERFECT'){v5Feedback('PERFECT! ✨',h);el('bear').classList.add('recover');setTimeout(()=>el('bear').classList.remove('recover'),440)}else if(result==='GOOD'){v5Feedback('GOOD! 👍',h)}else if(result==='MISS'){v5Feedback('미끄덩! 💦',h);v5ScreenHit()}else{v5Effect('팡!','ring',h)}if(result!=='SAFE'||h.type==='sloper')v5GripHit();msg(result==='PERFECT'?'✨ PERFECT! 그립 회복!':result==='GOOD'?'👍 GOOD! 아슬아슬 성공!':result==='MISS'?'😵 미끄덩! 그립을 많이 잃었어!':h.type==='sloper'?'🔵 둥근 슬로퍼! 균형을 유지했어!':h.type==='crimp'?'🔴 손끝 크림프를 잡았어!':h.type==='jug'?'🟠 저그를 꽉 잡았어!':h.type==='volume'?'🔺 볼륨에 발을 디뎠어! 균형과 그립 회복!' :h.col===0?'좋아! 자세를 바로잡았어!':'좋아! 다음 홀드를 찾아보자!');setTimeout(()=>{el('bear').classList.remove('climbing','reaching');rig();if(grip===0){v5Fail();return}busy=false;if(h.type==='goal'){complete=true;const stars=route.length<=levels[stage].goal&&grip>=2?3:route.length<=levels[stage].goal?2:1;scored[stage]=Math.max(scored[stage]||0,stars);saveProgress();sound(920,.19,'triangle');try{localStorage.setItem('kkomul-v10-stars',JSON.stringify(scored))}catch{};confetti();el('bear').classList.add('celebrate');v5Feedback('정상 정복! 🏆',h);setTimeout(()=>show('win',stars),700)}else draw()},560)}
function showTiming(){el('bear').classList.add('grip-danger');scheduleLimbs();el('timing').classList.remove('hidden');timer=0;let started=performance.now();const speed=1150;const animate=now=>{timer=((now-started)/speed)%2;const pos=timer<=1?timer:2-timer;el('timingLine').style.left=(pos*100)+'%';raf=requestAnimationFrame(animate)};raf=requestAnimationFrame(animate)}
function timingTap(){if(!pending||el('timing').classList.contains('hidden'))return;const pos=timer<=1?timer:2-timer;const diff=Math.abs(pos-.5);const result=diff<=.07?'PERFECT':diff<=.19?'GOOD':'MISS';perform(pending,result)}
function reset(){climbStarted=0;cancelAnimationFrame(raf);if(limbFrame)cancelAnimationFrame(limbFrame);limbFrame=0;el('timing').classList.add('hidden');el('scrim').classList.add('hidden');modalOpen=false;route=[];history=[];bal=0;grip=3;busy=false;complete=false;pending=null;broken=new Set();el('bear').className='bear';rig();place({col:0,row:0});msg(stage===0?'빛나는 홀드를 눌러 등반을 시작해요!':levels[stage].help);draw()}
function changeStage(i){stage=i;saveProgress();reset()}
function confetti(){for(let i=0;i<16;i++){const e=document.createElement('div');e.className='confetti';e.textContent=['✨','⭐','🎉','🌟'][i%4];e.style.left=(14+Math.random()*72)+'%';e.style.top=(18+Math.random()*52)+'%';el('app').appendChild(e);setTimeout(()=>e.remove(),1100)}}
function show(which,stars){modalOpen=true;const m=el('modal');if(which==='settings'){m.innerHTML=`<div class="emoji">⚙️</div><h2>환경 설정</h2><p>소리와 진동을 원하는 방식으로 설정해요.</p><div class="setting-row"><span>🔊 효과음</span><button class="toggle" id="soundToggle" aria-pressed="${prefs.sound}">${prefs.sound?'켜짐':'꺼짐'}</button></div><div class="setting-row"><span>📳 진동</span><button class="toggle" id="hapticToggle" aria-pressed="${prefs.haptics}">${prefs.haptics?'켜짐':'꺼짐'}</button></div><div class="setting-row"><span>❔ 시작 안내</span><button class="toggle" id="guideToggle" aria-pressed="${prefs.guide}">${prefs.guide?'켜짐':'꺼짐'}</button></div><button id="close">게임으로 돌아가기</button>`;for(const [id,key] of [['soundToggle','sound'],['hapticToggle','haptics'],['guideToggle','guide']])m.querySelector('#'+id).onclick=()=>{prefs[key]=!prefs[key];savePrefs();m.querySelector('#'+id).textContent=prefs[key]?'켜짐':'꺼짐';m.querySelector('#'+id).setAttribute('aria-pressed',String(prefs[key]));if(key==='sound')sound(630)};m.querySelector('#close').onclick=close;}
else if(which==='welcome'){m.innerHTML='<div class="emoji">🐻🧗</div><h2>꼬물클라임!</h2><p><b>반짝이는 홀드</b>를 터치해서 올라가요.<br>한쪽으로만 가면 균형이 무너져요.<br><b>🔴 크림프</b>에서는 타이밍에 맞춰 탭!<br>그립 ♥을 지키며 정상에 도착해봐요.<br><b>↶ 되돌리기</b>로 직전 선택을 취소할 수 있어요.</p><button id="begin">등반 시작!</button><button class="secondary" id="noGuide">다음부터 안내 안 보기</button>';m.querySelector('#begin').onclick=close;m.querySelector('#noGuide').onclick=()=>{prefs.guide=false;savePrefs();close()}}
else if(which==='win'){const end=stage===levels.length-1;m.innerHTML=`<div class="emoji">${end?'🏆':'🎉'}</div><h2>${end?'10개 암벽 정복!':'STAGE CLEAR!'}</h2><div style="font-size:32px;color:#e5ad41">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${route.length}번 이동 · 그립 ${grip}/3<br>${stars===3?'퍼펙트! 전략도 그립도 최고야!':'더 좋은 경로를 찾아 별 3개에 도전해봐!'}</p><button id="next">${end?'다시 첫 스테이지':'다음 스테이지 →'}</button><button class="secondary" id="again">재도전 ↻</button>`;m.querySelector('#next').onclick=()=>changeStage(end?0:stage+1);m.querySelector('#again').onclick=reset}
else if(which==='fail'){m.innerHTML='<div class="emoji">😵</div><h2>앗! 그립을 놓쳤어!</h2><p>곰돌이는 안전 매트로 떨어졌어.<br>이번엔 안전한 경로를 골라볼까?</p><button id="again">바로 다시 도전 ↻</button>';m.querySelector('#again').onclick=reset}
else if(which==='hint'){m.innerHTML=`<div class="emoji">💡</div><h2>등반 힌트</h2><p>${levels[stage].help}<br><br>🟠 저그 = 안전 · 🔴 크림프 = 타이밍 액션.<br>🔵 슬로퍼 = 균형 0에서만 잡기 · 🔺 볼륨 = 균형 0 + 그립 회복.<br>초록 테두리는 잡을 수 있는 홀드, 주황 테두리는 균형이 불안정한 홀드야.<br>↶ 버튼으로 한 단계 되돌릴 수 있어.</p><button id="close">계속 등반</button>`;m.querySelector('#close').onclick=close}
else if(which==='levels'){m.innerHTML='<div class="emoji">🏔️</div><h2>스테이지 선택</h2><p>실제 클라이밍 홀드로 만든 10개 퍼즐 벽!</p><div class="level-grid" id="choices"></div><button class="secondary" id="close">돌아가기</button>';levels.forEach((lv,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'\n'+('★'.repeat(scored[i]||0));b.style.whiteSpace='pre-line';b.onclick=()=>changeStage(i);m.querySelector('#choices').appendChild(b)});m.querySelector('#close').onclick=close}
el('scrim').classList.remove('hidden')}
function close(){modalOpen=false;el('scrim').classList.add('hidden');draw()}
el('timingTap').addEventListener('click',e=>{e.stopPropagation();timingTap()});el('timing').addEventListener('click',e=>{if(e.target.closest('button'))return;timingTap()});el('reset').onclick=reset;el('undo').onclick=undo;el('hint').onclick=()=>show('hint');el('levels').onclick=()=>show('levels');el('settings').onclick=()=>{if(!busy&&!modalOpen)show('settings')};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!el('timing').classList.contains('hidden')){e.preventDefault();timingTap()}else if(e.key==='Escape'&&modalOpen)close();else if(e.key.toLowerCase()==='r'&&!modalOpen)reset();else if(e.key.toLowerCase()==='z'&&!modalOpen)undo()});try{scored=JSON.parse((localStorage.getItem('kkomul-v10-stars')||localStorage.getItem('kkomul-v9-stars')||localStorage.getItem('kkomul-v8-stars')||localStorage.getItem('kkomul-v7-stars'))||localStorage.getItem('kkomul-v6-stars')||localStorage.getItem('kkomul-v5-stars')||'[]')}catch{scored=[]}loadProgress();reset();requestAnimationFrame(refreshMoving);if(prefs.guide&&stage===0){show('welcome')}
</script><script>
(()=>{const bear=document.getElementById('bear'),art=document.getElementById('artBear');if(!bear||!art)return;
const update=()=>{const c=bear.classList;let idx=c.contains('celebrate')?2:c.contains('hanging')||c.contains('scared')||c.contains('falling')?3:c.contains('climbing')||c.contains('reaching')?1:0;
const url=`assets/characters/bear_pose_${idx}.png`;if(!art.src.endsWith(url))art.src=url;};
new MutationObserver(update).observe(bear,{attributes:true,attributeFilter:['class']});update();})();
</script></body></html>
