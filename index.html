<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a77b56"><title>영차영차 등반대 — 루트 선택 실험</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#684b36;background:#735137;user-select:none}button{font:inherit;cursor:pointer;touch-action:manipulation}.game{position:relative;height:100dvh;width:min(100%,470px);margin:auto;overflow:hidden;background:#ead0ac url('assets/scenery/gym-art.webp') center/100% 100% no-repeat}.game:before{content:'';position:absolute;inset:0;background:linear-gradient(#48291f43,transparent 32%,transparent 70%,#5c3f3040);pointer-events:none}
.top{position:absolute;z-index:15;top:calc(7px + env(safe-area-inset-top));left:9px;right:9px;display:grid;grid-template-columns:1fr .9fr 1.15fr;gap:6px}.card,.notice,.btn{background:linear-gradient(145deg,#fffbf1,#f5dec0);border:2px solid #fff6e8;border-radius:17px;box-shadow:0 4px 0 #a97650,0 7px 15px #42241846}.card{height:79px;padding:9px 8px;min-width:0}.micro{font-size:10px;color:#98765f;font-weight:800}.number{font-size:18px;font-weight:950;margin-top:3px}.caption{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pips{display:flex;gap:3px;margin-top:8px}.pips i{flex:1;height:10px;border-radius:5px;background:#ddc9b3}.pips i.on{background:#eaa356}.balance{position:relative;margin-top:6px;height:8px;border-radius:6px;background:linear-gradient(90deg,#ed8c84,#e6bb77,#76c2a1,#e6bb77,#ed8c84)}.balance i{position:absolute;top:-4px;width:14px;height:16px;border-radius:10px;background:#6f4832;border:2px solid white;transform:translateX(-50%);transition:left .25s}
.notice{position:absolute;z-index:14;top:calc(96px + env(safe-area-inset-top));left:12px;right:12px;min-height:51px;padding:9px 12px;text-align:center;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}.board{position:absolute;left:10%;right:10%;top:23%;bottom:17%;pointer-events:none}.hold{position:absolute;z-index:4;width:clamp(56px,22%,92px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:0;background:none;pointer-events:auto}.hold img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(3px 7px 4px #35282077)}.hold.open:after{content:'';position:absolute;inset:10%;border:3px solid #86ffba;border-radius:50%;box-shadow:0 0 12px #45cd8e;animation:pulse 1.4s infinite}.hold.locked{opacity:.76}.hold.here{opacity:.65}.hold:active img{transform:scale(.94)}.honey{position:absolute;top:-14px;right:-9px;font-size:24px;filter:drop-shadow(0 2px 2px #3a281d)}.tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;border:1px solid #fff;background:#fff5dc;padding:3px 7px;border-radius:12px;font-size:10px;font-weight:900;box-shadow:0 3px 6px #0003}.tag.goal{background:#c9edcb}
.bear{position:absolute;z-index:8;width:clamp(78px,33%,118px);aspect-ratio:210/266;transform:translate(-50%,-60%);filter:drop-shadow(4px 7px 5px #3020159a);transition:left .5s cubic-bezier(.3,1.25,.65,1),top .5s cubic-bezier(.3,1.25,.65,1);pointer-events:none}.bear img{width:100%;height:100%;object-fit:contain}.bear.hop img{animation:hop .5s}.bear.fall{transition:top .7s ease-in}.routes{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}.routes path{fill:none;stroke-width:2.4;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;opacity:.78}.route-mark{position:absolute;z-index:10;font-weight:900;border-radius:13px;padding:4px 8px;font-size:11px;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}.route-mark.safe{background:#d8f3dc;color:#397b59;left:13%;top:48%}.route-mark.risk{background:#ffe1c1;color:#af6730;left:87%;top:49%}
.footer{position:absolute;z-index:15;bottom:calc(env(safe-area-inset-bottom) + 8px);left:9px;right:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{height:66px;color:#6a4934;font-weight:850;font-size:12px}.btn b{display:block;font-size:22px;margin-bottom:2px}.btn:disabled{opacity:.5}.btn.hint{background:linear-gradient(#9bdbb4,#65b68b);color:#fff}.modal{position:absolute;z-index:30;inset:0;background:#2b1c14bd;display:flex;align-items:center;justify-content:center;padding:20px}.modal[hidden]{display:none}.dialog{background:#fff1db;border:4px solid #fffaf4;border-radius:24px;box-shadow:0 10px 0 #8f6746;padding:22px 17px;width:min(340px,100%);text-align:center}.dialog h2{margin:0 0 8px;font-size:22px}.dialog p{font-size:14px;line-height:1.55}.modalbuttons{display:flex;gap:8px;margin-top:16px}.modalbuttons button{flex:1;border:0;border-radius:13px;background:#70b78b;color:#fff;padding:12px 7px;font-weight:900}.modalbuttons button.secondary{background:#bd9b7c}.timing{height:35px;background:linear-gradient(90deg,#e68b7d 0 30%,#f1c473 30% 44%,#76c9a1 44% 56%,#f1c473 56% 70%,#e68b7d 70%);border-radius:18px;position:relative;margin-top:20px;touch-action:manipulation}.timing i{position:absolute;top:-4px;height:43px;width:6px;border-radius:4px;background:#513d31;border:2px solid #fff;transform:translateX(-50%)}.panel{background:#fff9ed;padding:10px;border-radius:12px;text-align:left;font-size:12px;line-height:1.7}.panel strong{font-size:14px}@keyframes pulse{50%{box-shadow:0 0 19px 7px #8cf3a8}}@keyframes hop{50%{transform:translateY(-8px) rotate(-4deg)}}@media(max-height:730px){.board{top:25%;bottom:17%}.notice{font-size:11px;min-height:42px}}
</style></head><body><main class="game" id="game"><header class="top"><div class="card"><div class="micro">🧗 STAGE</div><div class="number">01 / 01</div><div class="caption">두 갈래 절벽</div></div><div class="card"><div class="micro">🐾 이동</div><div class="number" id="moves">0</div><div class="caption" id="honey">🍯 0/1</div></div><div class="card"><div class="micro">✊ 그립 <span id="grip">3/5</span></div><div class="pips" id="pips"></div><div class="balance"><i id="needle"></i></div><div class="caption">⚖️ 균형</div></div></header><div class="notice" id="message">왼쪽은 안전한 길, 오른쪽은 빠른 지름길!</div><div class="board" id="board"><svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" id="lines"></svg><div class="route-mark safe">🌿 안전 · 회복</div><div class="route-mark risk">⚡ 도전 · 3수</div><div id="holds"></div><div class="bear" id="bear"><img id="bearImg" alt="등반하는 곰돌이" src="assets/characters/bear_pose_0.png"></div></div><footer class="footer"><button class="btn" id="reset"><b>⟳</b>다시하기</button><button class="btn" id="undo"><b>↶</b>되돌리기</button><button class="btn hint" id="hint"><b>💡</b>힌트</button></footer><div class="modal" id="modal" hidden><div class="dialog"><div id="modalBody"></div><div class="timing" id="timing" hidden><i id="timingNeedle"></i></div><div class="modalbuttons"><button id="secondary" class="secondary" hidden>되돌리기</button><button id="primary">확인</button></div></div></div></main><script src="rules.js"></script><script src="stages.js"></script><script src="game.js"></script></body></html>
