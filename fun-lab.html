<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>영차영차 등반대 · 재미 실험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7e9ce;color:#553524;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}.app{max-width:530px;margin:auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#eed7ae}.top{padding:9px 12px 8px;display:flex;gap:8px;background:#805537;color:#543624}.pill{background:#fff7e9;border:2px solid #d8b785;box-shadow:0 3px 0 #b48559;border-radius:18px;padding:8px 11px;font-weight:900;text-align:center;white-space:nowrap}.top .pill:first-child{flex:1}.pill small{font-size:10px;display:block;color:#9b7856}.arena{position:relative;flex:1;min-height:0;overflow:hidden;background:#f8e6cc}canvas{display:block;width:100%;height:100%;touch-action:none}.speech{position:absolute;top:10px;left:12px;right:12px;pointer-events:none;background:#4e3025e8;color:#fff6de;padding:10px 14px;border:2px solid #efd29d;border-radius:15px;font-size:13px;font-weight:800;text-align:center;box-shadow:0 3px 6px #422b252b}.bottom{background:#fff4de;border-top:3px solid #dfbb82;padding:8px 10px 13px;box-shadow:0 -4px 13px #59391a19}.lab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.meter{height:14px;flex:1;border-radius:20px;background:#e6d4ae;overflow:hidden;border:1px solid #d0b481}.meter>div{height:100%;width:100%;background:#67be8a;transition:width .25s}.status{font-weight:900;font-size:12px;min-width:60px;text-align:right}.limbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.limb{font-size:12px;font-weight:850;padding:10px 1px;border:2px solid #cfad7b;border-radius:14px;background:#fffaf0;color:#65432a;box-shadow:0 2px 0 #c6a170}.limb.active{border-color:#e17c40;background:#ffdc95;transform:translateY(1px);box-shadow:0 1px 0 #bd8950}.tools{display:flex;gap:7px;margin-top:9px}.tools button{flex:1;border:0;background:#e6d1b0;color:#563a24;padding:10px 6px;font-weight:800;border-radius:12px}.tools button:last-child{background:#f8d789}.hint{font-size:11px;color:#987451;text-align:center;margin-top:7px}.sr{position:absolute;left:-9999px}
</style></head><body><div class="app"><div class="top"><div class="pill"><small>STAGE 01</small>숨은 발판</div><div class="pill"><small>이동</small><span id="moves">0</span>회</div><div class="pill"><small>꿀</small><span id="honey">0</span>/1 🍯</div></div><div class="arena"><canvas id="game"></canvas><div class="speech" id="say">손이나 발을 선택하고, 빛나는 홀드를 눌러 봐!</div></div><div class="bottom"><div class="lab"><b style="font-size:12px">✊ 그립</b><div class="meter"><div id="bar"></div></div><span class="status" id="status">편안해!</span></div><div class="limbs"><button class="limb active" data-limb="0">🐾 왼손</button><button class="limb" data-limb="1">🐾 오른손</button><button class="limb" data-limb="2">🦶 왼발</button><button class="limb" data-limb="3">🦶 오른발</button></div><div class="tools"><button id="undo">↶ 되돌리기</button><button id="hint">💡 힌트</button><button id="reset">↻ 처음부터</button></div><div class="hint">독립 테스트 페이지 · 기존 게임과 자산을 수정하지 않음</div></div></div><script src="reach-core.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),s=STAGES[0],names=['왼손','오른손','왼발','오른발'];let contacts,got,steps,selected,grip,history,won,cam,highlight,anim=0,hover=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let width=0,height=0,dpr=1,scale=1,top=0,renderId=0;function msg(t){$('#say').textContent=t}function reset(){contacts=s.start.slice();got=[];steps=0;selected=0;grip=100;history=[];won=false;highlight=null;cam=950;msg('왼손이 위에 닿지 않아! 발판부터 찾아볼까?');update();draw()}function update(){document.querySelectorAll('[data-limb]').forEach(b=>b.classList.toggle('active',Number(b.dataset.limb)===selected));$('#moves').textContent=steps;$('#honey').textContent=got.length;$('#bar').style.width=grip+'%';$('#bar').style.background=grip<30?'#e87862':grip<60?'#e7b452':'#67be8a';const p=pose(s,contacts),strain=Math.round(p.strain*100);$('#status').textContent=won?'완등! 🎉':grip<30?'위험!':strain>87?'아슬아슬!':'편안해!'}function resize(){const b=canvas.getBoundingClientRect();width=b.width;height=b.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);scale=width/700;draw()}function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function line(x,y,X,Y,w,color){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function point(x,y){return {x:x*scale,y:(y-top)*scale}}function oval(x,y,rx,ry,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}function limb(a,b,len,shade,front=false){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;let m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const bend= front?1:-1;let normal={x:-dy/d,y:dx/d};let v=Math.sqrt(Math.max(0,(len/2)**2-(d/2)**2));v=Math.min(v,62);let elbow={x:m.x+normal.x*v*bend,y:m.y+normal.y*v*bend};let A=point(a.x,a.y),B=point(b.x,b.y),E=point(elbow.x,elbow.y);line(A.x,A.y,E.x,E.y,34*scale,shade);line(E.x,E.y,B.x,B.y,32*scale,shade);circle(E.x,E.y,17*scale,shade);circle(B.x,B.y,22*scale,'#ad6b44');circle(B.x,B.y,16*scale,'#f2c595');for(let n=-1;n<=1;n++)circle(B.x+n*8*scale,B.y-8*scale,4.5*scale,'#fbdebd')}
function draw(time=0){if(!width)return;const p=pose(s,contacts),t=p.torso;const target=clamp(t.y-400,0,s.H-height/scale);cam+=(target-cam)*.18;top=cam;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);ctx.save();ctx.scale(scale,scale);ctx.translate(0,-top);ctx.fillStyle='#f6e7cb';ctx.fillRect(0,0,700,s.H);const shapes=[[0,0,320,500,'#c7e4d9'],[700,100,330,650,'#e0d4eb'],[0,780,430,1220,'#f5d0c6'],[700,650,320,1250,'#f8dfac'],[150,230,650,880,'#d4e9f0']];for(const [x,y,xx,yy,col] of shapes){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,y+130);ctx.lineTo(xx+40,yy);ctx.lineTo(x-60,yy+130);ctx.fill()}for(let i=0;i<115;i++){const x=(i*257+51)%699,y=(i*193+87)%s.H;circle(x,y,1.8,'#c9b9a2')}ctx.fillStyle='#ad9071';ctx.font='bold 22px system-ui';for(let y=150;y<s.H;y+=300){ctx.fillText(Math.round((s.floor-y)/300)+'m',8,y)}ctx.restore();const candidates=new Set(s.holds.filter(h=>canPlace(s,contacts,selected,h.id).ok).map(h=>h.id));for(const h of s.holds){let q=point(h.x,h.y);if(q.y < -80||q.y>height+80)continue;const enabled=candidates.has(h.id),goal=h.id===s.goal,foot=h.type==='chip';const rad=(foot?15:27)*scale;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(-.16);if(enabled){circle(0,0,rad+13*scale,highlight===h.id?'#fff09b':'#bdf2d7')}oval(0,4*scale,rad*1.25,rad*.68,'#996c47');oval(0,0,rad*1.28,rad*.7,foot?'#b0a6a0':goal?'#ffb735':'#f5b62f');circle(0,0,5*scale,'#805c44');circle(-1*scale,-1*scale,2*scale,'#e7d0a3');ctx.restore();if(h.honey){ctx.font=`${25*scale}px system-ui`;ctx.fillText('🍯',q.x+15*scale,q.y-18*scale)}if(goal){ctx.font=`${28*scale}px system-ui`;ctx.fillText('🏁',q.x+13*scale,q.y-26*scale)}}const T=point(t.x,t.y);const edge=['#c88b5a','#cc9160','#bd8050','#c78b59'];for(let i=2;i<4;i++){const id=contacts[i];if(!id)continue;const a=anchor(t,i),b=holdOf(s,id);limb(a,b,210,edge[i],i===2)}for(let i=0;i<2;i++){const id=contacts[i];if(!id)continue;const a=anchor(t,i),b=holdOf(s,id);limb(a,b,230,edge[i],i===1)}oval(T.x,T.y,54*scale,72*scale,'#bf8354');line(T.x-36*scale,T.y-28*scale,T.x+35*scale,T.y+32*scale,10*scale,'#397fc7');line(T.x+36*scale,T.y-28*scale,T.x-35*scale,T.y+32*scale,10*scale,'#397fc7');line(T.x-45*scale,T.y+24*scale,T.x+45*scale,T.y+24*scale,11*scale,'#3377b9');circle(T.x,T.y+52*scale,18*scale,'#dc9e69');circle(T.x-29*scale,T.y-93*scale,19*scale,'#bf8354');circle(T.x+29*scale,T.y-93*scale,19*scale,'#bf8354');circle(T.x,T.y-75*scale,53*scale,'#c88b5a');if(p.strain>.82){ctx.font=`${20*scale}px system-ui`;ctx.fillText('💦',T.x+35*scale,T.y-95*scale)}if(won){ctx.font=`${44*scale}px system-ui`;ctx.fillText('🎉',T.x-25*scale,T.y-153*scale)}renderId=requestAnimationFrame(draw)}function pickAt(x,y){let hit=null,best=40;for(const h of s.holds){const p=point(h.x,h.y),d=Math.hypot(x-p.x,y-p.y)/scale;if(d<best){best=d;hit=h}}return hit}function choose(i){selected=i;update();msg(names[i]+' 선택! 빛나는 홀드를 눌러 봐.');}function place(h){if(won)return;const r=canPlace(s,contacts,selected,h.id);if(!r.ok){const why={reach:'너무 멀어! 발부터 옮겨 몸을 끌어올려 봐.',cross:'팔다리가 꼬여! 다른 홀드를 선택해.',chip:'손으로는 작은 발판을 잡을 수 없어.',taken:'다른 손발이 이미 사용하고 있어.',same:'이미 잡고 있는 홀드야.'};msg(why[r.why]||'여기는 지금 갈 수 없어.');return}history.push({contacts:contacts.slice(),got:got.slice(),steps,grip});contacts=r.next;steps++;if(h.honey&&!got.includes(h.id))got.push(h.id);const strain=r.pose.strain;grip=clamp(grip-(strain>.87?14:strain>.73?7:3)+(h.type==='jug'?5:0),0,100);if(grip===0){msg('앗! 그립이 다 떨어졌어. 되돌리기를 눌러봐!')}else if(isWin(s,contacts)){won=true;msg('🎉 드디어 정상! '+steps+'번 이동해서 완등했어!')}else{msg((strain>.87?'으으윽! 간신히 버텼어!':h.type==='chip'?'좋아! 발을 디디니까 안정됐어.':'영차! 다음 손발을 골라 봐.')+' (이동 '+steps+')')}highlight=null;update()}let start=null;canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();start={x:e.clientX-r.left,y:e.clientY-r.top};try{canvas.setPointerCapture(e.pointerId)}catch{}});canvas.addEventListener('pointerup',e=>{if(!start)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const hit=pickAt(x,y);if(hit){place(hit)}else{const p=pose(s,contacts);for(let i=0;i<4;i++){const h=holdOf(s,contacts[i]),q=point(h.x,h.y);if(Math.hypot(q.x-x,q.y-y)<31){choose(i);break}}}start=null});document.querySelectorAll('[data-limb]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.limb)));$('#undo').onclick=()=>{const h=history.pop();if(!h)return;({contacts,got,steps,grip}=h);won=false;msg('↶ 되돌렸어! 다른 길을 찾아봐.');update()};$('#reset').onclick=reset;$('#hint').onclick=()=>{const r=solve(s,contacts,got,true)||solve(s,contacts,got,false);if(!r||!r.path.length){msg('현재 상태에서 찾은 경로가 없어. 되돌려 보자.');return}const a=r.path[0];choose(a.limb);highlight=a.id;msg('💡 '+names[a.limb]+'을(를) 빛나는 홀드로 옮겨봐!');};window.addEventListener('resize',resize);reset();resize();})();
</script></body></html>
