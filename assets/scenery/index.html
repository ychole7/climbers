<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd8d66"><title>영차영차 등반대</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;background:#6e452e;color:#67432f;user-select:none;-webkit-user-select:none}button{font:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
.game{width:min(100%,470px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:#d7b58c url('assets/scenery/gym-art.webp') center/100% 100% no-repeat}.game:before{content:"";position:absolute;inset:0;background:linear-gradient(#40240f40,transparent 25%,transparent 74%,#4b2c165e);pointer-events:none}.game.quake{animation:quake .4s}
.top{position:absolute;top:calc(5px + env(safe-area-inset-top));left:9px;right:9px;display:grid;grid-template-columns:1fr .9fr 1.1fr;gap:6px;z-index:10}
.card,.action,.message{background:linear-gradient(145deg,#fffdf3,#f4dec0);border:2px solid #fff8e9;border-radius:17px;box-shadow:0 4px 0 #a67550,0 6px 13px #3f291d4c}
.card{height:76px;padding:7px 8px;min-width:0;position:relative}.mini{font-size:10px;font-weight:800;color:#94735a}.stat{font-size:19px;font-weight:950;white-space:nowrap}.stat small{font-size:11px;color:#a07b60;font-weight:800}.small{font-size:10px;color:#97735c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.honeyc{font-size:12px;font-weight:900;margin-top:2px}.honeyc.bump{animation:bump .5s}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{flex:1;height:9px;border-radius:5px;background:#e6d2b8;box-shadow:inset 0 1px 2px #0002}.pips i.on{background:linear-gradient(#ffb36b,#ef7d45)}.pips.low i.on{background:linear-gradient(#ff8a80,#e04b4b);animation:blink .8s infinite}.pips.flash{animation:bump .4s}
.balancebar{height:10px;border-radius:10px;background:linear-gradient(90deg,#e27c78 0 20%,#eac070 20% 40%,#7fc69b 40% 60%,#eac070 60% 80%,#e27c78 80%);margin:7px 0 2px;position:relative}.balancebar i{position:absolute;width:15px;height:15px;border-radius:100%;background:#633d29;border:3px solid white;top:-3px;left:50%;transform:translateX(-50%);transition:left .3s cubic-bezier(.3,1.6,.5,1)}
.message{position:absolute;z-index:10;top:calc(90px + env(safe-area-inset-top));left:11px;right:11px;padding:8px 44px;text-align:center;font-weight:800;font-size:12px;min-height:35px;display:flex;align-items:center;justify-content:center}.message.pop{animation:bump .35s}
.iconbtn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#f0d6b4;font-size:14px;padding:0;box-shadow:0 2px 0 #a67550}.iconbtn.l{left:5px}.iconbtn.r{right:5px}
.board{position:absolute;left:10%;right:10%;top:21%;bottom:16%;pointer-events:none}
.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:4}.lines line{stroke-linecap:round;vector-effect:non-scaling-stroke}
.hold,.foothold{position:absolute;z-index:5;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;pointer-events:auto}.hold{width:clamp(57px,24%,94px);aspect-ratio:1}.hold img,.foothold img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(3px 7px 4px #44302399);pointer-events:none;transition:transform .2s}.hold:active img{transform:scale(.92)}
.hold:before,.foothold:before{content:"";position:absolute;inset:12%;border-radius:50%;border:3px solid transparent;pointer-events:none}.hold.open:before,.foothold.open:before{border-color:#93ffc1;box-shadow:0 0 12px 4px #52e1a499;animation:pulse 1.3s infinite}.hold.hint:before,.foothold.hint:before{border-color:#ffe46b!important;box-shadow:0 0 18px 7px #ffd23f!important;animation:pulse .5s infinite!important}
.hold.locked{opacity:.6;filter:saturate(.55)}.hold.here{opacity:.85}.hold.wiggle{animation:wiggle .35s}
.tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#fff9e7;border-radius:15px;padding:1px 5px;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 2px 4px #0003;pointer-events:none}.tag:empty{display:none}.htag{position:absolute;right:2%;bottom:6%;font-size:15px;filter:drop-shadow(0 1px 1px #fff) drop-shadow(0 1px 2px #0005);pointer-events:none}
.honey{position:absolute;right:-6%;top:-8%;font-size:25px;z-index:2;animation:float 1.6s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 2px 2px #0004)}
.foothold{width:48px;height:48px}.foothold .tag{top:-14px;font-size:10px}.foothold.used:before{border-color:#ffd54d;box-shadow:0 0 12px #ffdb63}.foothold .honey{font-size:19px;right:-14px;top:-10px}
.bear{position:absolute;z-index:6;width:clamp(72px,34%,116px);aspect-ratio:210/266;top:85%;left:50%;transform:translate(-50%,-58%);filter:drop-shadow(4px 9px 4px #322012aa);transition:left .42s cubic-bezier(.4,1.3,.6,1),top .42s cubic-bezier(.4,1.3,.6,1);pointer-events:none}.bear img{width:100%;height:100%;object-fit:contain;transform-origin:50% 20%}
.bear.hop img{animation:hop .42s}.bear.shake img{animation:shake .35s}.bear.wob img{animation:wob .6s}.bear.fall{transition:top .9s cubic-bezier(.5,0,1,.5)}.bear.fall img{animation:spin .9s linear}.bear.cheer img{animation:cheer .6s 3}
.fx{position:absolute;z-index:20;pointer-events:none;transform:translate(-50%,-50%)}.fx.puff{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.9;animation:puff .7s ease-out forwards}.fx.txt{font-weight:950;font-size:16px;color:#fff;text-shadow:0 2px 0 #7a4a2c,0 0 6px #7a4a2c;animation:rise 1s ease-out forwards;white-space:nowrap}.fx.conf{width:8px;height:12px;border-radius:2px;animation:conf 1.4s ease-in forwards}.fx.honeyfly{font-size:24px;transition:all .7s cubic-bezier(.5,-0.3,.7,1);transform:translate(-50%,-50%)}
.footer{position:absolute;z-index:11;bottom:calc(env(safe-area-inset-bottom) + 7px);left:7px;right:7px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.action{min-height:58px;font-size:12px;font-weight:850;color:#704934;padding:5px 0}.action b{display:block;font-size:23px}.action.highlight{background:linear-gradient(#a2d8a8,#66b48b);color:#fff}.action:disabled{opacity:.5}.action.nudge{animation:nudge 1s infinite}
.modal{position:absolute;z-index:50;inset:0;background:#2c180fc0;display:flex;align-items:center;justify-content:center;padding:18px}.modal[hidden]{display:none}.dialog{background:#fff2dc;border:4px solid white;border-radius:24px;padding:22px 18px;text-align:center;width:min(340px,100%);max-height:92%;overflow:auto;box-shadow:0 12px 0 #91623c;animation:popin .35s cubic-bezier(.3,1.5,.5,1)}.dialog h2{margin:0 0 8px}.dialog p{font-size:14px;line-height:1.6;margin:8px 0}
.btns{display:flex;gap:8px;justify-content:center;margin-top:12px}.btns button{border:0;background:#65af84;border-radius:12px;padding:12px 18px;color:#fff;font-weight:900;box-shadow:0 3px 0 #3f7c58}.btns button.sec{background:#d9b997;color:#5d3d29;box-shadow:0 3px 0 #a67550}.btns button[hidden]{display:none}
.stars{font-size:40px;letter-spacing:4px;margin:4px 0}.stars span{display:inline-block;filter:grayscale(1) opacity(.35)}.stars span.on{filter:none;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) backwards}.goals{text-align:left;font-size:13px;background:#fff8ec;border-radius:12px;padding:8px 12px;margin:8px 0;line-height:1.8}.goals .ok{color:#3d9a63;font-weight:800}.goals .no{color:#b39880}
.timing{height:30px;background:linear-gradient(90deg,#ea8585 0 30%,#f1c776 30% 44%,#80c89b 44% 56%,#f1c776 56% 70%,#ea8585 70%);border-radius:20px;margin:18px 0 6px;position:relative;cursor:pointer}.timing:after{content:"";position:absolute;left:48%;width:4%;top:0;bottom:0;background:#4fb67a;border-radius:3px}.timing i{position:absolute;width:6px;background:#49352a;height:40px;top:-5px;left:0;border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
.legend{font-size:11px;color:#8a6a55;margin-top:6px}.intro-hold{width:96px;height:96px;object-fit:contain;filter:drop-shadow(2px 6px 4px #0004);animation:float 2s ease-in-out infinite}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.grid button{border:0;border-radius:12px;background:#f6dcb9;padding:8px 0 5px;font-weight:950;font-size:16px;box-shadow:0 3px 0 #b88b63}.grid button small{display:block;font-size:9px;letter-spacing:-1px}.grid button.cur{background:#a2d8a8;color:#fff}.grid button:disabled{opacity:.45}
.rules{text-align:left;font-size:12px;line-height:1.5}.rules div{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #e3c9a8}.rules img{width:38px;height:38px;object-fit:contain;flex:none}.rules b{white-space:nowrap}
@keyframes pulse{50%{opacity:.5;scale:1.07}}@keyframes shake{25%{rotate:-8deg}75%{rotate:8deg}}@keyframes hop{0%{transform:scale(1)}25%{transform:scale(.9,1.12) translateY(-6%)}60%{transform:scale(1.06,.94)}100%{transform:scale(1)}}@keyframes wob{20%{rotate:-12deg}40%{rotate:10deg}60%{rotate:-7deg}80%{rotate:4deg}}@keyframes spin{to{rotate:540deg}}@keyframes cheer{50%{transform:translateY(-12%) scale(1.05)}}@keyframes wiggle{25%{translate:-4px 0}75%{translate:4px 0}}
@keyframes puff{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.4);opacity:0}}@keyframes rise{0%{transform:translate(-50%,-30%) scale(.6)}20%{transform:translate(-50%,-80%) scale(1.15)}100%{transform:translate(-50%,-220%);opacity:0}}@keyframes conf{0%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}}
@keyframes float{50%{translate:0 -4px}}@keyframes bump{40%{scale:1.15}}@keyframes blink{50%{opacity:.4}}@keyframes nudge{50%{box-shadow:0 4px 0 #a67550,0 0 0 4px #ffd23f}}@keyframes popin{from{scale:.7;opacity:0}}@keyframes starpop{from{scale:0;rotate:-90deg}}@keyframes quake{20%{translate:-6px 3px}40%{translate:5px -3px}60%{translate:-4px 2px}80%{translate:3px 0}}
@media(max-height:720px){.board{top:23%;bottom:16%}.card{height:68px}.message{top:calc(80px + env(safe-area-inset-top))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="game" id="game">
<header class="top">
 <div class="card"><div class="mini">🧗 STAGE</div><div class="stat" id="stageNum">01<small> / 10</small></div><div class="small" id="stageName"></div></div>
 <div class="card"><div class="mini">🐾 이동</div><div class="stat" id="moves">0</div><div class="honeyc" id="honeyc">🍯 0/0</div></div>
 <div class="card"><div class="mini">✊ 체력 <span id="stNum"></span></div><div class="pips" id="pips"></div><div class="balancebar"><i id="balanceNeedle"></i></div><div class="small">균형 · <span id="balanceName">중립</span></div></div>
</header>
<div class="message" id="msgbox"><button class="iconbtn l" id="mute" aria-label="소리">🔊</button><span id="message"></span><button class="iconbtn r" id="help" aria-label="홀드 도감">?</button></div>
<div class="board" id="board"><svg class="lines" id="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="holds"></div><div id="foots"></div><div class="bear" id="bear"><img id="bearImg" src="assets/characters/bear_pose_0.png" alt="등반 중인 곰돌이"></div></div>
<footer class="footer"><button class="action" id="reset"><b>⟳</b>다시하기</button><button class="action" id="undo"><b>↶</b>되돌리기</button><button class="action highlight" id="hint"><b>💡</b>힌트</button><button class="action" id="select"><b>☰</b>스테이지</button></footer>
<div class="modal" id="modal" hidden><div class="dialog"><div id="modalBody"></div><div class="timing" id="timing" hidden><i id="needle"></i></div><div class="btns"><button class="sec" id="modalAlt" hidden></button><button id="modalAction">확인</button></div><div class="legend" id="modalFoot"></div></div></div>
</main><script src="rules.js"></script><script src="stages.js"></script><script src="game.js"></script></body></html>
