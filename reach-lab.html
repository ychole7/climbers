<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>영차영차 리치 실험실</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 레이아웃: 화면 전체가 암벽(캔버스), HUD는 위아래 가장자리에 얇게 떠 있음. 실내 암장 합판·초크·매트의 세계 */
:root{
  --wood:#6e452e;        /* 바깥 프레임 */
  --ply:#efe3cf;         /* 합판 벽 */
  --ink:#4f2f1c;         /* 글자 */
  --paper:#fff8ea;       /* HUD 카드 */
  --chalk:#ffffff;
  --go:#58c48a;          /* 잡을 수 있음 */
  --warn:#f2a93b;        /* 팔이 거의 다 뻗음 */
  --bad:#e5604f;         /* 안 닿음 / 그립 부족 */
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--wood);color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.game{position:relative;width:min(100%,470px);height:100%;margin:0 auto;overflow:hidden;background:var(--ply);touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;z-index:5;pointer-events:none;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.hud.top{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:stretch}
.pill{background:var(--paper);border-radius:14px;padding:6px 11px;box-shadow:0 3px 0 #c9a27c,0 6px 14px #4f2f1c33;font-family:var(--display);font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill small{font-family:var(--body);font-size:11px;font-weight:700;opacity:.65}
.pill.grow{flex:1;min-width:0;justify-content:center}
.pill.course{border:0;pointer-events:auto;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:left;border:0;border-radius:14px;padding:10px 12px;background:#f6ead6;box-shadow:0 3px 0 #d8bb94}
.list button.cur{background:#d9f2e3;box-shadow:0 3px 0 #8fcfaa}
.list b{font-family:var(--display);font-weight:400;font-size:20px}
.list span{font-size:13px;line-height:1.3}.list span small{display:block;opacity:.7;font-size:11px}
.list em{font-style:normal;font-size:13px;letter-spacing:1px}
.tag{display:inline-block;background:#ffe9a6;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800;margin-bottom:6px}
.toast{align-self:center;max-width:94%;background:#4f2f1ce6;color:var(--paper);border-radius:14px;padding:8px 14px;font-size:14px;font-weight:700;line-height:1.4;text-align:center;text-wrap:balance;transition:opacity .25s,transform .25s}
.toast.hide{opacity:0;transform:translateY(-6px)}
.hud.bottom{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.grip{background:var(--paper);border-radius:16px;padding:7px 12px 9px;box-shadow:0 3px 0 #c9a27c,0 6px 14px #4f2f1c33;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.grip b{font-family:var(--display);font-weight:400;font-size:16px}
.bar{height:14px;border-radius:9px;background:#e8d6bd;overflow:hidden;box-shadow:inset 0 2px 3px #0002}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:var(--go);transition:background .3s}
.grip.low .bar i{background:var(--bad);animation:blink .6s infinite}
.grip .rate{font-size:12px;font-weight:800;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;pointer-events:auto}
.btns button{border:0;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 #c9a27c;padding:8px 0;font-family:var(--display);font-size:16px}
.btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a27c}
.btns button:disabled{opacity:.45}
.btns .hint{background:#ffe9a6}
.modal[hidden]{display:none}
.modal{position:absolute;inset:0;z-index:20;background:#2b170cb3;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:24px;padding:22px 20px 18px;width:min(330px,100%);text-align:center;box-shadow:0 10px 0 #b58457;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px;text-wrap:balance}
.card p{margin:6px 0;line-height:1.55;font-size:14px}
.stars{font-size:42px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;filter:grayscale(1) opacity(.3)}
.stars span.on{filter:none;animation:star .5s cubic-bezier(.3,1.8,.5,1) backwards}
.goals{text-align:left;background:#f6ead6;border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.9}
.goals .ok{color:#2f8f5a;font-weight:800}.goals .no{color:#a58a70}
.card .act{display:flex;gap:8px;justify-content:center;margin-top:14px}
.card .act button{border:0;border-radius:14px;padding:12px 18px;font-family:var(--display);font-size:18px;background:var(--go);color:#fff;box-shadow:0 3px 0 #2f8f5a}
.card .act button.sec{background:#e3c9a6;color:var(--ink);box-shadow:0 3px 0 #b58457}
@keyframes blink{50%{opacity:.45}}@keyframes pop{from{transform:scale(.7);opacity:0}}@keyframes star{from{transform:scale(0) rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main class="game" id="game">
  <canvas id="cv" aria-label="곰돌이 클라이밍 벽. 곰돌이의 손이나 발을 끌어서 홀드에 놓으세요."></canvas>
  <div class="hud top">
    <div class="row">
      <button class="pill grow course" id="course" type="button"><small id="courseNo">코스 1</small> <span id="courseName">숨은 발판</span> <small>▾</small></button>
      <div class="pill">🍯 <span id="honey">0/2</span></div>
      <div class="pill">🐾 <span id="moves">0</span></div>
    </div>
    <div class="toast" id="toast">곰돌이의 손이나 발을 끌어서 홀드에 놓아 봐!</div>
  </div>
  <div class="hud bottom">
    <div class="grip" id="grip"><b>✊ 그립</b><div class="bar"><i id="gripBar"></i></div><span class="rate" id="gripRate"></span></div>
    <div class="btns">
      <button id="undo" type="button">↶ 되돌리기</button>
      <button id="hint" class="hint" type="button">💡 힌트</button>
      <button id="restart" type="button">⟳ 처음부터</button>
    </div>
  </div>
  <div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
</main>

<script src="reach-core.js"></script>
<script>
'use strict';
let S=STAGES[0],SI=0,VW=860,OX=80;const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let PAR=20;const parOf=s=>{s._par??=(solve(s,s.start,[],true)||{moves:20}).moves+Math.max(3,Math.round(s.holds.length/6));return s._par};
let STARS={};try{STARS=JSON.parse(localStorage.getItem('climbers.reach.v2')||'{}')}catch(e){}
const HOLD_SIZE={jug:86,crimp:68,sloper:92,pinch:76,chip:50};
const IMG={};['jug','crimp','sloper','pinch'].forEach(t=>{IMG[t]=new Image();IMG[t].src=`assets/holds/${t}.png`});IMG.chip=new Image();IMG.chip.src='assets/holds/footchip.png';
const WALL=new Image();WALL.src='assets/scenery/wall.webp';let wallPat=null;
WALL.onload=()=>{try{const t=document.createElement('canvas');t.width=WALL.width*2;t.height=WALL.height*2;const c=t.getContext('2d');
  // 미러 타일: 2x2로 뒤집어 붙여 반복 경계가 안 보이게
  c.drawImage(WALL,0,0);c.save();c.translate(t.width,0);c.scale(-1,1);c.drawImage(WALL,0,0);c.restore();
  c.save();c.translate(0,t.height);c.scale(1,-1);c.drawImage(WALL,0,0);c.restore();
  c.save();c.translate(t.width,t.height);c.scale(-1,-1);c.drawImage(WALL,0,0);c.restore();
  wallPat=ctx.createPattern(t,'repeat')}catch(e){wallPat=null}};
const PX_PER_M=250,mOf=y=>Math.max(0,(S.floor-y-260)/PX_PER_M);

/* ---------- 상태 ---------- */
let C,stamina,honey,moves,hist,mode,torso,drag=null,ret=[null,null,null,null],snapT=[0,0,0,0],happyT=0,hintMove=null,hintT=0;
let falls=0,fails=0,taughtFoot=false,camY=0,fallV=0,fallSpin=0,lastBuzz=0,lastTick=0,ampPrev=0,winT=0,parts=[],pops=[];
let modalTimer=null;
function reset(){clearTimeout(modalTimer);C=S.start.slice();stamina=S.st||100;honey=[];moves=0;hist=[];mode='play';drag=null;hintMove=null;fails=0;torso={...pose(S,C).torso};camY=clampCam(torso.y-viewH()*.47);parts=[];pops=[];hideModal();hud();say(SI===0&&moves===0?'곰돌이의 손이나 발을 끌어서 홀드에 놓아 봐!':S.tip)}
function loadStage(i,intro=true){SI=i;S=STAGES[i];resize();PAR=parOf(S);PANELS=makePanels();TILT=Object.fromEntries(S.holds.map((h,k)=>[h.id,(rng(k+3+i*31)()-.5)*.7]));falls=0;$('courseNo').textContent='코스 '+(i+1);$('courseName').textContent=S.name;reset();
  if(intro)modal(`<div class="tag">${S.pattern}</div><h2>${S.name}</h2><p>${S.tip}</p>${S.st?`<p><b>시작 그립 ${S.st}</b></p>`:''}`,[['오르기!',()=>{hideModal();sayBrief(S.tip,3500)}]])}
function snapshot(){return {C:C.slice(),stamina,honey:honey.slice(),moves}}

/* ---------- 사운드 ---------- */
let ac=null;
function tone(f,d=.12,type='sine',v=.16,when=0,slide=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={
  lift:()=>tone(260,.12,'sine',.12,0,420),
  grab:y=>{tone(160,.08,'square',.09);tone(520+(S.floor-y)*.25,.1,'triangle',.18,.02)},
  rest:()=>{tone(660,.1,'sine',.08,.08);tone(880,.12,'sine',.07,.15)},
  no:()=>tone(330,.25,'triangle',.14,0,150),
  creak:a=>tone(90+a*60,.05,'sawtooth',.03+a*.04),
  honey:()=>[988,1319,1760].forEach((f,i)=>tone(f,.14,'triangle',.12,i*.07)),
  fall:()=>tone(900,.9,'triangle',.16,0,80),
  thud:()=>{tone(70,.25,'sine',.35);tone(120,.12,'square',.05)},
  win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,'triangle',.14,i*.1))
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- 화면 좌표 ---------- */
let dpr=1,scale=1,cw=0,ch=0;
function resize(){const r=$('game').getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cw=r.width;ch=r.height;cv.width=cw*dpr;cv.height=ch*dpr;scale=Math.min(cw/720,Math.max(cw/860,ch/(S.H+120)));VW=cw/scale;OX=(VW-S.W)/2}
const viewH=()=>ch/scale;
const clampCam=y=>{const hb=(document.querySelector('.hud.bottom').offsetHeight-30)/scale,ht=(document.querySelector('.hud.top').offsetHeight)/scale;const hi=S.H-viewH()+hb;return Math.max(Math.min(-80-ht*.5,hi),Math.min(hi,y))};
function toWorld(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/scale-OX,y:(e.clientY-r.top)/scale+camY}}

/* ---------- HUD ---------- */
function say(t){const el=$('toast');el.innerHTML=t;el.classList.remove('hide')}
let toastTimer=null;function sayBrief(t,ms=2200){say(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hide'),ms)}
function hud(rate=0){
  $('honey').textContent=`${honey.length}/${honeyIds(S).length}`;$('moves').textContent=`${moves}/${PAR}`;
  const b=$('gripBar');b.style.width=stamina+'%';b.style.background=stamina>50?'var(--go)':stamina>25?'var(--warn)':'var(--bad)';
  $('grip').classList.toggle('low',stamina<25);
  const r=$('gripRate');r.textContent=Math.abs(rate)<.5?'':(rate>0?'▲ 쉬는 중':'▼ '+Math.round(-rate)+'/초');r.style.color=rate>0?'#2f8f5a':'#c4573f';
  $('undo').disabled=!hist.length||mode!=='play';
}

/* ---------- 입력 ---------- */
const FINGER_LIFT=30; // 손가락에 가리지 않도록 살짝 위로
function pawPos(i){
  if(drag&&drag.limb===i)return drag.paw;
  if(ret[i]){const r=ret[i],k=Math.min(1,(performance.now()-r.t)/260),e=1-Math.pow(1-k,3)*(1-k*2.2*(1-k));const h=holdOf(S,C[i]);if(k>=1)ret[i]=null;return {x:r.x+(h.x-r.x)*e,y:r.y+(h.y-r.y)*e}}
  const h=holdOf(S,C[i]),pair=i<2?1-i:5-i,shared=C[pair]===C[i]&&!(drag&&drag.limb===pair);
  return {x:h.x+(shared?(i%2?17:-17):0),y:h.y};
}
cv.addEventListener('pointerdown',e=>{
  if(mode!=='play'||drag)return;const w=toWorld(e);
  let best=-1,bd=95;for(let i=0;i<4;i++){const p=pawPos(i),d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=i}}
  if(best<0){const near=S.holds.find(h=>Math.hypot(h.x-w.x,h.y-w.y)<60);if(near)sayBrief('홀드를 누르는 게 아니라, <b>곰돌이의 손발</b>을 끌어서 거기에 놓아 줘!');return}
  cv.setPointerCapture(e.pointerId);
  const reach=new Set(S.holds.filter(h=>canPlace(S,C,best,h.id).ok).map(h=>h.id));
  drag={limb:best,id:e.pointerId,sx:e.clientX,sy:e.clientY-FINGER_LIFT,finger:{x:w.x,y:w.y-FINGER_LIFT/scale},paw:pawPos(best),reach,cand:null,over:0,t0:performance.now()};
  hintMove=null;SFX.lift();buzz(8);
});
cv.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){drag.sx=e.clientX;drag.sy=e.clientY-FINGER_LIFT}});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;release();};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){ret[drag.limb]={...drag.paw,t:performance.now()};drag=null}});

function release(){
  const d=drag,i=d.limb;drag=null;
  if(d.cand){commit(i,d.cand);return}
  ret[i]={...d.paw,t:performance.now()};
  const near=S.holds.filter(h=>h.id!==C[i]).map(h=>({h,d:Math.hypot(h.x-d.finger.x,h.y-d.finger.y)})).sort((a,b)=>a.d-b.d)[0];
  if(!near||near.d>85||(performance.now()-d.t0<160))return;
  const why=canPlace(S,C,i,near.h.id).why;SFX.no();buzz([20,40,20]);
  if(why==='reach'){
    fails++;
    if(isHand(i)&&near.h.y<holdOf(S,C[i]).y-20){
      if(fails>=2&&!taughtFoot){say('🦶 <b>발을 먼저 올려 봐!</b> 발이 높아지면 몸이 올라가서 손이 더 멀리 닿아.');taughtFoot='pulse'}
      else sayBrief('으앗, 팔이 짧아! 몸을 더 올릴 방법이 없을까?',2600);
    }else sayBrief('거기까진 안 닿아! 동그라미 안쪽만 닿을 수 있어.');
  }
  else if(why==='chip')sayBrief('작은 발판은 <b>발</b>로만 디딜 수 있어.');
  else if(why==='sloper')sayBrief('슬로퍼는 둥글고 미끄러워. <b>몸을 홀드 바로 아래</b>로 가져온 다음 잡아!');
  else if(why==='cross')sayBrief('팔다리가 꼬여 버려! 다른 쪽 손발로 잡아 봐.');
  else if(why==='taken')sayBrief('거기엔 이미 다른 손발이 있어.');
}
function commit(i,id){
  hist.push(snapshot());const h=holdOf(S,id),from=pawPos(i);
  C[i]=id;moves++;snapT[i]=performance.now();happyT=performance.now();
  if(isHand(i))stamina=Math.max(1,stamina-({crimp:4,sloper:3,pinch:2}[h.type]||0));
  SFX.grab(h.y);buzz(18);chalk(h.x,h.y,9);pop(h.x,h.y-50,moves%3?'탁!':'영차!');
  if(h.honey&&!honey.includes(id)){honey.push(id);setTimeout(()=>{SFX.honey();buzz([10,30,10])},120);pop(h.x+30,h.y-90,'🍯 +1','#ffd23f')}
  if(isWin(S,C))return win();
  if(!isHand(i)&&taughtFoot==='pulse'){taughtFoot=true;sayBrief('좋아! 몸이 올라갔지? 이제 손을 뻗어 봐 ✋',3000)}
  else if(moves===1)sayBrief('잘했어! 손발을 하나씩 옮기며 위로 🧗',2200);
  else if(h.type==='crimp'&&isHand(i))sayBrief('크림프는 잡고 있는 동안 그립이 빨리 줄어! 오래 머물지 마.',2600);
  else $('toast').classList.add('hide');
}

/* ---------- 시뮬레이션 ---------- */
let rateNow=0,amp=0,strain=0;
function step(dt){
  const now=performance.now();
  if(mode==='play'){
    let target,st;
    if(drag){
      const r=cv.getBoundingClientRect();drag.finger={x:(drag.sx-r.left)/scale-OX,y:(drag.sy-r.top)/scale+camY};
      let p=pose(S,C,drag.limb,drag.finger);if(!p.ok)p=pose(S,C,drag.limb);
      target=p.torso;
      const a=anchor(torso,drag.limb),dx=drag.finger.x-a.x,dy=drag.finger.y-a.y,dist=Math.hypot(dx,dy),L=BEAR.len[drag.limb];
      drag.over=dist/L;const k=Math.min(1,L/dist||1);
      drag.paw={x:a.x+dx*k,y:a.y+dy*k};
      // 놓으면 잡힐 홀드
      let cand=null,cd=78;for(const id of drag.reach){const h=holdOf(S,id),d=Math.hypot(h.x-drag.paw.x,h.y-drag.paw.y);if(d<cd){cd=d;cand=id}}
      if(cand!==drag.cand&&cand){buzz(6);tone(1200,.03,'square',.03)}
      drag.cand=cand;st=Math.max(p.strain,Math.min(1,drag.over));
    }else{const p=pose(S,C);target=p.torso;st=p.strain}
    strain=st;
    torso.x+=(target.x-torso.x)*(1-Math.exp(-dt*11));torso.y+=(target.y-torso.y)*(1-Math.exp(-dt*11));
    amp=Math.max(0,Math.min(1,(st-.84)/.17));
    // 그립: 잡은 손 홀드 + 뻗은 정도
    let rate=drag?-4:2;C.forEach((id,i)=>{if(isHand(i)&&!(drag&&drag.limb===i))rate+=HOLD_RATE[holdOf(S,id).type]});
    rate-=Math.max(0,st-.92)*60;rateNow=rate;
    stamina=Math.max(0,Math.min(100,stamina+rate*dt));
    if(amp>.05&&now-lastBuzz>280-amp*200){lastBuzz=now;buzz(Math.round(5+amp*12))}
    if(amp>.2&&now-lastTick>320-amp*220){lastTick=now;SFX.creak(amp)}
    if(stamina<=0)startFall();

function drawFx(){
  parts.forEach(p=>{const k=p.t/p.life;ctx.globalAlpha=(1-k)*(p.sq?1:.8);ctx.fillStyle=p.c;if(p.sq){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.t*8);ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+k*1.6),0,7);ctx.fill()}});ctx.globalAlpha=1;
  pops.forEach(p=>{const k=p.t;ctx.globalAlpha=1-k*k;ctx.font=`${30+Math.min(1,k*6)*8}px Jua, sans-serif`;ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#5a3420';ctx.strokeText(p.text,p.x,p.y-k*60);ctx.fillStyle=p.c;ctx.fillText(p.text,p.x,p.y-k*60)});ctx.globalAlpha=1;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);
  const t=now/1000;ctx.setTransform(dpr*scale,0,0,dpr*scale,OX*dpr*scale,-camY*dpr*scale);
  drawWall();drawHolds(t);drawDrag(t);drawBear(t);drawHint(t);drawFootNudge(t);drawFx();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
// 설계 검증기에서 코스 주입받아 단독 플레이
let injected=null;
if(location.hash==='#designtest'){
  window.addEventListener('message',e=>{if(e.data&&e.data.climbersStage){injected=e.data.climbersStage;injected._par=null;STAGES[0]=injected;loadStage(0)}});
  document.querySelector('.pill.course')&&(document.querySelector('.pill.course').style.pointerEvents='none');
}
resize();loadStage(0);requestAnimationFrame(frame);
</script>
