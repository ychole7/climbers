function drawHolds(){const t=trans();let validSet=new Set();if(drag>=0){for(let h of stage.holds){if(canPlace(stage,contacts,drag,h.id).ok)validSet.add(h.id)}} stage.holds.forEach(h=>{let p=posWorld(h.x,h.y);if(p.y< -30||p.y>t.h+30)return;let isFeet=h.type==='chip',r=(isFeet?19:27)*t.s,hover=hoverHold===h.id,valid=validSet.has(h.id),held=contacts.includes(h.id);if(valid){circle(p.x,p.y,r+12,'#b8f1c988');circle(p.x,p.y,r+7,'', '#309d68',3)}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.12);ctx.shadowColor='#65431f66';ctx.shadowBlur=4;ctx.shadowOffsetY=4;const art=holdArt[h.type];if(art&&art.naturalWidth){const sz=r*(isFeet?3.0:3.25);ctx.drawImage(art,-sz/2,-sz/2,sz,sz)}else{rounded(-r,-r*.44,2*r,r*.88,r*.4,isFeet?'#8aadb1':h.type==='crimp'?'#df7b80':'#f4ae30','#8e7256',1.5)}ctx.restore();if(held)circle(p.x,p.y,r+4,'','#fff5d0',2);if(hover)circle(p.x,p.y,r+9,'','#ffcb4f',4);if(h.honey){ctx.font='18px system-ui';ctx.fillText('🍯',p.x+12,p.y-8)}if(h.id===stage.goal){ctx.font='20px system-ui';ctx.fillText('🏁',p.x+15,p.y-10)}if(hintMove?.id===h.id){circle(p.x,p.y,r+11,'','#fff64a',3)}})}
function drawBear(){
  const t=trans();ctx.save();ctx.translate(0,t.oy);ctx.scale(t.s,t.s);
  const c=displayTorso;
  const joints=[0,1,2,3].map(i=>({x:c.x+BEAR.off[i][0],y:c.y+BEAR.off[i][1]}));
  const ends=joints.map((a,i)=>{
    const p=getEnd(i),dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),max=BEAR.len[i]-.8;
    return d<=max?{x:p.x,y:p.y}:{x:a.x+dx*max/Math.max(1,d),y:a.y+dy*max/Math.max(1,d)};
  });
  let elbows=[];
  for(let i=0;i<4;i++)elbows[i]=solveJoint(joints[i],ends[i],BEAR.len[i]/2,i,
    elbows.filter((_,j)=>(j<2)===(i<2)));
  limbs=elbows.map(j=>({joint:{x:j.x,y:j.y}}));
  const ink='#925b35',fur=profile.fur,highlight='#e6a771';
  // Draw shoulder/hip joints behind the torso so limbs emerge organically.
  const puffySegment=(a,b,w,shade)=>{
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=ink;ctx.lineWidth=w+3.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.strokeStyle=shade;ctx.lineWidth=w;ctx.stroke();
    ctx.strokeStyle='#ffe0ad55';ctx.lineWidth=Math.max(3,w*.15);
    ctx.beginPath();ctx.moveTo(a.x-2,a.y-3);ctx.lineTo(b.x-2,b.y-3);ctx.stroke();
  };
  // Body silhouette is deliberately large relative to short, soft limbs.
  for(const i of [3,2,1,0]){
    const hand=i<2;
    puffySegment(joints[i],elbows[i],hand?profile.armWidth:profile.legWidth,hand?profile.fur:profile.furDark);
    puffySegment(elbows[i],ends[i],hand?profile.armWidth*.93:profile.legWidth*.90,hand?profile.fur:profile.furDark);
    circle(elbows[i].x,elbows[i].y,hand?profile.armWidth*.42:profile.legWidth*.42,profile.fur);
  }
  // Draw lifted feet under the body layer.
  const paintPaw=(i)=>{
    const e=ends[i],rad=i<2?profile.pawHand:profile.pawFoot;
    circle(e.x,e.y,rad,profile.furDark,'#88532e',2.5);
    circle(e.x,e.y+5,rad*.46,'#edc39a');
    for(let k=-1;k<=1;k++)circle(e.x+k*9,e.y-10-(k===0?3:0),3.8,'#edc39a');
  };
  for(let i=2;i<4;i++)paintPaw(i);
  const lean=ClimbMotion.clamp(((ends[0].x+ends[1].x)/2-c.x)/240,-profile.lean,profile.lean);
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(lean);
  // Round pelvis and plush belly: drawn on top of the limb roots.
  circle(0,39,profile.bodyX*.68,profile.furDark);
  const g=ctx.createRadialGradient(-18,-30,12,2,10,110);
  g.addColorStop(0,'#e6a86f');g.addColorStop(.78,'#c78850');g.addColorStop(1,'#9d633b');
  ctx.beginPath();ctx.ellipse(0,0,profile.bodyX,profile.bodyY,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#9c623b';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.ellipse(-2,1,profile.bodyX*.61,profile.bodyY*.65,0,0,Math.PI*2);ctx.fillStyle='#f4d9ae';ctx.fill();
  // Harness belt and central buckle stay on body rather than on separate limbs.
  rounded(-profile.bodyX*.95,40,profile.bodyX*1.9,25,11,'#287ec3','#236297',2.5);
  rounded(-15,38,30,29,6,'#45596a','#2b4653',2);
  ctx.restore();
  const stretch=Math.max(...ends.map((e,i)=>Math.hypot(e.x-joints[i].x,e.y-joints[i].y)/BEAR.len[i]));
  const strained=stretch>.92||(drag>=0&&stretch>.81);
  const reaction=performance.now()<emotionUntil?emotion:(strained?'strain':'normal');
  // A friendly frontal face on a subtly tilted torso; clear at mobile scale.
  const headYaw=Math.max(-.18,Math.min(.18,((ends[0].x+ends[1].x)/2-c.x)/330));
  const hx=c.x+headYaw*21,hy=c.y-112+Math.sin(time*.002)*.75+bodyBob;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(lean*.32);
  for(const x of [-49,49]){
    if(profile.earShape==='long'){
      ctx.save();ctx.translate(x,-45);ctx.rotate((x<0?-.22:.22));
      ctx.beginPath();ctx.ellipse(0,-37,17,52,0,0,2*Math.PI);ctx.fillStyle=profile.furDark;ctx.fill();
      ctx.beginPath();ctx.ellipse(0,-39,9,38,0,0,2*Math.PI);ctx.fillStyle='#efb5bc';ctx.fill();ctx.restore();
    }else{circle(x,-44,profile.earSize,profile.furDark,'#946037',2);circle(x,-44,14,'#f0c69b');}
  }
  const hg=ctx.createRadialGradient(-17,-21,9,0,5,80);
  hg.addColorStop(0,'#e5a671');hg.addColorStop(.83,'#cc8d56');hg.addColorStop(1,'#a46c40');
  circle(0,0,profile.head,hg,'#9d643c',2.5);
  circle(-34,15,11,'#ed9c90');circle(34,15,11,'#ed9c90');
  ctx.lineCap='round';ctx.lineWidth=4;ctx.strokeStyle='#593c2b';
  if(reaction==='strain'){
    ctx.beginPath();ctx.moveTo(-31,-9);ctx.lineTo(-14,-4);ctx.moveTo(14,-4);ctx.lineTo(31,-9);ctx.stroke();
  }else{
    circle(-23,-7,7,'#30251d');circle(23,-7,7,'#30251d');
    circle(-25,-10,2,'#fff');circle(21,-10,2,'#fff');
  }
  ctx.beginPath();ctx.ellipse(0,24,26,20,0,0,Math.PI*2);ctx.fillStyle='#f6e2c2';ctx.fill();
  circle(0,13,5.6,'#3d2b23');if(species==='rabbit'){circle(-7,18,3,'#fbfbfb');circle(7,18,3,'#fbfbfb')} 
  ctx.strokeStyle='#61432d';ctx.lineWidth=2.8;
  if(reaction==='strain'){
    ctx.beginPath();ctx.ellipse(0,31,6,9,0,0,Math.PI*2);ctx.fillStyle='#673c36';ctx.fill();
    ctx.beginPath();ctx.ellipse(53,10,4,9,-.25,0,Math.PI*2);ctx.fillStyle='#81d2ed';ctx.fill();
  }else{
    ctx.beginPath();ctx.arc(0,21,9,.08,Math.PI-.08);ctx.stroke();
  }
  ctx.restore();
  for(let i=0;i<2;i++)paintPaw(i);
  ctx.restore();
}
function draw(){time=performance.now();fitBody();ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);drawWall();drawHolds();drawBear();requestAnimationFrame(draw)}requestAnimationFrame(draw);
function coords(e){let r=cv.getBoundingClientRect();return worldPos(e.clientX-r.left,e.clientY-r.top)}function nearestLimb(p){let idx=-1,best=50;for(let i=0;i<4;i++){let q=getEnd(i),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<best){best=d;idx=i}}return idx}function nearestHold(p,threshold=56){let h=null,d=threshold;for(let q of stage.holds){let dd=Math.hypot(p.x-q.x,p.y-q.y);if(dd<d){d=dd;h=q}}return h}
$('#species').addEventListener('change',e=>{if(motion.active){e.target.value=species;return}species=e.target.value;profile=ClimbMotion.PROFILES[species]||ClimbMotion.PROFILES.bear;msg(profile.name+' · 공통 IK와 손발 판정은 똑같아!')});
cv.addEventListener('pointerdown',e=>{if(win||motion.active)return;let p=coords(e);drag=nearestLimb(p);if(drag<0){msg('손이나 발바닥에서 끌기 시작해봐!');return}motionFrom=null;dragP=p;cv.setPointerCapture(e.pointerId);msg(['왼손','오른손','왼발','오른발'][drag]+'을 옮겨봐! 초록색은 가능한 홀드야.')});cv.addEventListener('pointermove',e=>{if(drag<0)return;dragP=coords(e);let h=nearestHold(dragP);hoverHold=h?.id||null});
function finish(e){if(drag<0)return;let p=coords(e),h=nearestHold(p);if(h){let r=canPlace(stage,contacts,drag,h.id);if(r.ok){const oldHold=holdOf(stage,contacts[drag]);const before={...displayTorso};const after={...r.pose.torso};
              motion.begin({limb:drag,from:oldHold,to:h,torsoFrom:before,torsoTo:after,response:profile.bodyResponse,now:performance.now()});bodyBob=-5;history.push({contacts:contacts.slice(),moves,honey:[...honey]});contacts=r.next;moves++;if(h.honey&&!honey.has(h.id))honey.add(h.id);$('#moves').textContent='🐾 '+moves+'수';$('#honey').textContent='🍯 '+honey.size+'/'+honeyIds(stage).length;emotion='normal';emotionUntil=performance.now()+420;msg('찰싹! '+(['왼손','오른손','왼발','오른발'][drag])+' 성공!');if(isWin(stage,contacts)){win=true;msg('🎉 완등! '+moves+'수 · 다시 하려면 처음부터')}hintMove=null}else {emotion='strain';emotionUntil=performance.now()+550;msg(r.why==='reach'?'아직 닿지 않아! 발을 먼저 올려볼까?':r.why==='cross'?'몸이 너무 꼬여! 다른 홀드를 잡아봐.':'여기는 지금 잡을 수 없어.')}}else {emotion='strain';emotionUntil=performance.now()+500;msg('홀드 가까이 놓아봐!')} drag=-1;dragP=null;hoverHold=null}
cv.addEventListener('pointerup',finish);cv.addEventListener('pointercancel',()=>{drag=-1;dragP=null;hoverHold=null});$('#restart').onclick=()=>{motion.cancel();contacts=contacts0.slice();history=[];moves=0;honey.clear();win=false;hintMove=null;poseTarget=pose(stage,contacts);displayTorso={...poseTarget.torso};cameraY=displayTorso.y-90;bendMemory.fill(0);limbs=[];motionFrom=null;bodyBob=0;$('#moves').textContent='🐾 0수';$('#honey').textContent='🍯 0/'+honeyIds(stage).length;msg('손발 하나씩 드래그! 발을 먼저 올려봐.')};$('#undo').onclick=()=>{if(motion.active){msg('동작이 끝난 뒤 되돌릴 수 있어.');return}let h=history.pop();if(!h)return;contacts=h.contacts;moves=h.moves;honey=new Set(h.honey);win=false;motionFrom=null;bendMemory.fill(0);$('#moves').textContent='🐾 '+moves+'수';$('#honey').textContent='🍯 '+honey.size+'/'+honeyIds(stage).length;msg('한 수 되돌렸어.')};$('#hint').onclick=()=>{if(motion.active)return;let r=solve(stage,contacts,[...honey],false);hintMove=r?.path?.[0]||null;msg(hintMove?'💡 '+['왼손','오른손','왼발','오른발'][hintMove.limb]+' → 빛나는 홀드':'현재 상태에서 길이 없어. 되돌려 봐!')};
